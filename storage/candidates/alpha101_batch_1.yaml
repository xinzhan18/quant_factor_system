batch_id: "alpha101_batch_1"
timestamp: "2026-03-24T11:00:00"
description: "Alpha101 translations — simple price/volume formulas (OHLCV only)"
candidates:
  # Alpha#6: -1 * correlation(open, volume, 10)
  - name: "alpha006"
    expression: "Mul(Corr($open, $volume, 10), -1)"
    category: "volume"
    rationale: "Alpha101#6: Negative open-volume correlation"

  # Alpha#12: sign(delta(volume, 1)) * (-1 * delta(close, 1))
  - name: "alpha012"
    expression: "Mul(Sign(Delta($volume, 1)), Mul(Delta($close, 1), -1))"
    category: "volume"
    rationale: "Alpha101#12: Volume direction * inverse price change"

  # Alpha#33: rank(-1 + open/close) — open vs close ratio ranked
  - name: "alpha033"
    expression: "Rank(Sub(Div($open, $close), 1), 60)"
    category: "candlestick"
    rationale: "Alpha101#33: Time-series rank of open/close gap"

  # Alpha#38: -1 * rank(ts_rank(open, 10)) * rank(close/open)
  - name: "alpha038"
    expression: "Mul(Mul(Rank(Rank($open, 10), 60), Rank(Div($close, $open), 60)), -1)"
    category: "candlestick"
    rationale: "Alpha101#38: Open rank * intraday return rank"

  # Alpha#53: -1 * delta((close-low-(high-close))/(close-low), 9)
  - name: "alpha053"
    expression: "Mul(Delta(Div(Sub(Sub($close, $low), Sub($high, $close)), Sub($close, $low)), 9), -1)"
    category: "candlestick"
    rationale: "Alpha101#53: Change in candle body position over 9 days"

  # Alpha#54: -1 * (low-close) * open^5 / ((low-high) * close^5)
  # Simplified to ratio form: (close-low)/(high-low) * (open/close)^5
  - name: "alpha054"
    expression: "Mul(Div(Sub($close, $low), Sub($high, $low)), Mul(Mul(Mul(Mul(Div($open,$close), Div($open,$close)), Div($open,$close)), Div($open,$close)), Div($open,$close)))"
    category: "candlestick"
    rationale: "Alpha101#54: Close position * (open/close)^5 ratio"

  # Alpha#101: (close - open) / (high - low + 0.001)
  - name: "alpha101"
    expression: "Div(Sub($close, $open), Sub($high, $low))"
    category: "candlestick"
    rationale: "Alpha101#101: Candle body / range ratio"

  # Alpha#9: trend continuation/reversal conditional
  - name: "alpha009"
    expression: "If(Greater(Min(Delta($close, 1), 5), 0), Delta($close, 1), If(Less(Max(Delta($close, 1), 5), 0), Delta($close, 1), Mul(Delta($close, 1), -1)))"
    category: "momentum"
    rationale: "Alpha101#9: Continue if consistent trend, reverse if mixed"

  # Alpha#23: (sma(high,20) < high) ? -1*delta(high,2) : 0
  - name: "alpha023"
    expression: "If(Greater($high, Mean($high, 20)), Mul(Delta($high, 2), -1), 0)"
    category: "momentum"
    rationale: "Alpha101#23: Reversal when high exceeds 20d average high"

  # Alpha#30: volume ratio * sign pattern
  # (1-rank(sign changes of delta close)) * vol_5/vol_20
  - name: "alpha030"
    expression: "Mul(Sub(1, Rank(Sub(Sub(Sign(Delta($close,1)), Sign(Ref(Delta($close,1),1))), Sign(Ref(Delta($close,1),2))), 60)), Div(Sum($volume, 5), Sum($volume, 20)))"
    category: "volume"
    rationale: "Alpha101#30 adapted: Sign consistency * volume concentration"

  # Alpha#46: price acceleration conditional
  - name: "alpha046"
    expression: "If(Greater(Sub(Div(Sub(Ref($close,10), $close), 10), Div(Sub(Ref($close,20), Ref($close,10)), 10)), 0.25), -1, If(Less(Sub(Div(Sub(Ref($close,10), $close), 10), Div(Sub(Ref($close,20), Ref($close,10)), 10)), 0), 1, Mul(Delta($close, 1), -1)))"
    category: "momentum"
    rationale: "Alpha101#46: Price acceleration regime — trending/decelerating/reversal"

  # Alpha#49: similar to #46 but different threshold
  - name: "alpha049"
    expression: "If(Less(Sub(Div(Sub(Ref($close,10), $close), 10), Div(Sub(Ref($close,20), Ref($close,10)), 10)), -0.1), 1, Mul(Delta($close, 1), -1))"
    category: "momentum"
    rationale: "Alpha101#49: Buy on strong deceleration, else reversal"
