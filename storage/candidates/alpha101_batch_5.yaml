batch_id: "alpha101_batch_5"
timestamp: "2026-03-24T11:00:00"
description: "Classic technical indicators + remaining Alpha101 + strong baseline factors"
candidates:
  # === Technical indicators ===
  # RSI-like: up moves / total moves
  - name: "rsi_like_14"
    expression: "Div(Mean(If(Greater($close, Ref($close,1)), Sub($close, Ref($close,1)), 0), 14), Mean(Abs(Sub($close, Ref($close,1))), 14))"
    category: "momentum"
    rationale: "RSI-like indicator (14d) — ratio of up moves to total moves"

  # Bollinger band position: (close - MA) / std
  - name: "bollinger_position_20"
    expression: "Div(Sub($close, Mean($close, 20)), Std($close, 20))"
    category: "trend"
    rationale: "Bollinger band position — z-score of close vs 20d MA"

  # MACD-like: short EMA / long EMA - 1
  - name: "macd_like"
    expression: "Sub(Div(EMA($close, 12), EMA($close, 26)), 1)"
    category: "trend"
    rationale: "MACD-like signal: EMA(12)/EMA(26) - 1"

  # ATR-like: smoothed true range
  - name: "atr_like_14"
    expression: "Mean(If(Greater(Sub($high,$low), Abs(Sub($high,Ref($close,1)))), If(Greater(Sub($high,$low), Abs(Sub($low,Ref($close,1)))), Sub($high,$low), Abs(Sub($low,Ref($close,1)))), If(Greater(Abs(Sub($high,Ref($close,1))), Abs(Sub($low,Ref($close,1)))), Abs(Sub($high,Ref($close,1))), Abs(Sub($low,Ref($close,1))))), 14)"
    category: "volatility"
    rationale: "Average True Range (14d) — true range smoothed"

  # === Remaining strong baseline factors ===
  # vol_weighted_abs_return: IC=-0.053
  - name: "vol_weighted_abs_return"
    expression: "Mean(Mul(Abs($close/Ref($close,1)-1), Div($volume, Mean($volume,20))), 20)"
    category: "volume"
    rationale: "Volume-weighted average absolute return. Baseline IC=-0.053."

  # IQR: IC=-0.058
  - name: "interquantile_range_20"
    expression: "Sub(Quantile($close/Ref($close,1)-1, 20, 0.9), Quantile($close/Ref($close,1)-1, 20, 0.1))"
    category: "distribution"
    rationale: "Interquantile range of returns. Baseline IC=-0.058."

  # MAD: IC=-0.058
  - name: "mad_volatility_20"
    expression: "Mad($close/Ref($close,1)-1, 20)"
    category: "volatility"
    rationale: "Median absolute deviation of returns. Baseline IC=-0.058."

  # Q90: IC=-0.056
  - name: "quantile_90_ret_20"
    expression: "Quantile($close/Ref($close,1)-1, 20, 0.9)"
    category: "distribution"
    rationale: "90th percentile return. Baseline IC=-0.056."

  # RealizedVol: IC=-0.055
  - name: "realized_vol_20"
    expression: "RealizedVol($close/Ref($close,1)-1, 20)"
    category: "volatility"
    rationale: "Realized volatility. Baseline IC=-0.055."

  # AmihudIlliq: IC=-0.057
  - name: "amihud_illiq_20"
    expression: "AmihudIlliq($close/Ref($close,1)-1, 20)"
    category: "volume"
    rationale: "Amihud illiquidity. Baseline IC=-0.057."

  # SignedPower: IC=-0.057
  - name: "signed_sqrt_return"
    expression: "SignedPower($close/Ref($close,1)-1, 0.5)"
    category: "momentum"
    rationale: "Signed square root of return. Baseline IC=-0.057."

  # price_range_pct_20: IC=-0.048
  - name: "price_range_pct_20"
    expression: "Div(Sub(Max($close,20), Min($close,20)), Min($close,20))"
    category: "volatility"
    rationale: "20d price range as percentage. Baseline IC=-0.048."
