batch_id: "batch_013"
timestamp: "2026-03-24T10:25:00"
description: "Volatility-orthogonal: normalize by vol, lagged returns, timing, volume pattern"
candidates:
  # === Normalize by vol to remove volatility component ===
  - name: "range_over_vol"
    expression: "Div(Mean(Div(Sub($high,$low),$close),5), Std($close/Ref($close,1)-1, 20))"
    category: "candlestick"
    rationale: "Range / volatility — how much intraday range exceeds return vol? Orthogonal to vol."

  - name: "resi_over_vol"
    expression: "Div(Abs(Resi($close, 10)), Std($close/Ref($close,1)-1, 20))"
    category: "trend"
    rationale: "Residual magnitude / vol — how unusual is the deviation relative to normal vol?"

  # === Pure timing (when, not how much) ===
  - name: "volume_max_day_20"
    expression: "Div(IdxMax($volume, 20), 20)"
    category: "volume"
    rationale: "When was the volume peak? 0=today, 1=20d ago. Timing, not magnitude."

  # === Lagged reversal (1-2 day) ===
  - name: "return_lag1"
    expression: "Ref($close/Ref($close,1)-1, 1)"
    category: "momentum"
    rationale: "Yesterday's return — short-term reversal signal"

  - name: "avg_return_3d"
    expression: "Mean($close/Ref($close,1)-1, 3)"
    category: "momentum"
    rationale: "Average of last 3 daily returns — very short momentum"

  # === Volume consistency (not dispersion) ===
  - name: "volume_stability"
    expression: "Div(Min($volume, 20), Max($volume, 20))"
    category: "volume"
    rationale: "Min/Max volume ratio — 1=perfectly stable, 0=huge spike. Different from Std."

  # === Multi-day range (5-day high to 5-day low) ===
  - name: "range_5d"
    expression: "Div(Sub(Max($high, 5), Min($low, 5)), Min($low, 5))"
    category: "candlestick"
    rationale: "5-day high-low range as % — captures multi-day volatility pattern"

  # === Skewness of volume (not price) ===
  - name: "volume_skew_60"
    expression: "Skew($volume, 60)"
    category: "volume"
    rationale: "Long-window volume skewness — persistent volume distribution shape"

  # === Vol-adjusted momentum ===
  - name: "sharpe_20"
    expression: "Div(Mean($close/Ref($close,1)-1, 20), Std($close/Ref($close,1)-1, 20))"
    category: "momentum"
    rationale: "Rolling Sharpe ratio — return/risk. Orthogonal to pure vol and pure return."

  # === Price oscillator ===
  - name: "price_oscillator_5_20"
    expression: "Div(Sub(Mean($close, 5), Mean($close, 20)), Mean($close, 20))"
    category: "trend"
    rationale: "Price oscillator — short MA deviation from long MA as percentage"
