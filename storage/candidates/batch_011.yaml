batch_id: "batch_011"
timestamp: "2026-03-24T10:15:00"
description: "Gap patterns, count-based signals, asymmetric range — all use untested constructions"
candidates:
  # === Gap/overnight patterns (untested data relationship) ===
  - name: "avg_gap_10"
    expression: "Mean(Sub($open, Ref($close, 1)), 10)"
    category: "momentum"
    rationale: "Average overnight gap over 10 days — gap direction tendency"

  - name: "gap_vol_interaction"
    expression: "Mul(Abs(Sub(Div($open, Ref($close, 1)), 1)), Div($volume, Mean($volume, 20)))"
    category: "volume"
    rationale: "Gap size * relative volume — conviction of overnight moves"

  # === Count-based signals (different math from continuous) ===
  - name: "new_high_count_20"
    expression: "Div(Count(Greater($high, Ref($high, 1)), 20), 20)"
    category: "momentum"
    rationale: "Fraction of days making new daily highs — bullish persistence"

  - name: "new_low_count_20"
    expression: "Div(Count(Less($low, Ref($low, 1)), 20), 20)"
    category: "momentum"
    rationale: "Fraction of days making new daily lows — bearish persistence"

  # === Range shape and compression ===
  - name: "range_compression_60"
    expression: "Div(Div(Sub($high, $low), $close), Mean(Div(Sub($high, $low), $close), 60))"
    category: "candlestick"
    rationale: "Today's normalized range / 60d avg range — range expansion/compression"

  - name: "log_hl_ratio"
    expression: "Mean(Log(Div($high, $low)), 10)"
    category: "candlestick"
    rationale: "Avg log(high/low) — Parkinson-style volatility proxy"

  # === Novel interactions ===
  - name: "intraday_vs_overnight"
    expression: "Sub(Div(Sub($close, $open), $open), Div(Sub($open, Ref($close, 1)), Ref($close, 1)))"
    category: "momentum"
    rationale: "Intraday return minus overnight gap — where does the action happen?"

  - name: "volume_up_down_ratio"
    expression: "Div(Sum(If(Greater($close, Ref($close, 1)), $volume, 0), 20), Sum(If(Less($close, Ref($close, 1)), $volume, 0), 20))"
    category: "volume"
    rationale: "Up-day volume / down-day volume ratio — directional volume bias"

  # === Regime with novel condition ===
  - name: "gap_regime_range_vol"
    expression: "If(Greater(Abs(Sub(Div($open, Ref($close, 1)), 1)), 0.01), Mean(Div(Sub($high, $low), $close), 5), Div($volume, Mean($volume, 20)))"
    category: "regime"
    rationale: "Large gap → range measure; small gap → volume measure. Truly different payloads."

  # === Cross-scale with novel operation ===
  - name: "close_mean_dev_ratio"
    expression: "Div(Abs(Sub($close, Mean($close, 10))), Abs(Sub($close, Mean($close, 60))))"
    category: "trend"
    rationale: "Short deviation / long deviation — converging or diverging from means?"
