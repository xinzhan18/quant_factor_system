batch_id: "batch_016"
timestamp: "2026-03-24T10:40:00"
description: "Near-miss variations: rank interactions at different windows, modified composites"
candidates:
  # === rank_ret_times_rank_vol variations (was 0.501 with 011) ===
  - name: "rank_ret10_rank_vol60"
    expression: "Mul(Rank($close/Ref($close,1)-1, 10), Rank($volume, 60))"
    category: "volume"
    rationale: "Shorter return rank * longer volume rank — may decorrelate from 011"

  - name: "rank_ret60_rank_vol20"
    expression: "Mul(Rank($close/Ref($close,1)-1, 60), Rank($volume, 20))"
    category: "volume"
    rationale: "Longer return rank * standard volume rank — different time scale"

  - name: "rank_ret5_rank_vol20"
    expression: "Mul(Rank($close/Ref($close,1)-1, 5), Rank($volume, 20))"
    category: "volume"
    rationale: "Very short return rank * volume rank — more responsive"

  # === Williams %R modifications to reduce conflicts ===
  - name: "williams_r_smoothed_10"
    expression: "Mean(Div(Sub(Mul(2, $close), $low), Sub($high, $low)), 10)"
    category: "candlestick"
    rationale: "10d smoothed Williams %R — smoothing may change correlation structure"

  - name: "williams_r_rank_60"
    expression: "Rank(Div(Sub(Mul(2, $close), $low), Sub($high, $low)), 60)"
    category: "candlestick"
    rationale: "Rank transform of Williams %R — uniform distribution may decorrelate"

  # === Novel: Regime with PV corr condition + non-vol payloads ===
  - name: "pv_regime_resi_vs_count"
    expression: "If(Greater(Corr($close,$volume,20), 0), Resi($close, 10), Div(Count(Greater($close, Ref($close,1)), 10), 10))"
    category: "regime"
    rationale: "PV aligned → regression residual; PV diverged → momentum count"

  # === Longer-horizon versions of admitted (may decorrelate) ===
  - name: "resi_close_20"
    expression: "Resi($close, 20)"
    category: "trend"
    rationale: "20d residual vs 5d (factor 006). Longer window captures different dynamic."

  - name: "delta_volume_20"
    expression: "Div(Delta($volume, 20), Mean($volume, 60))"
    category: "volume"
    rationale: "20d volume change vs 5d (factor 002). Different time scale."

  # === Pure interaction: shadow * volume change ===
  - name: "shadow_vol_change"
    expression: "Mul(Div(Sub($high, If(Greater($close,$open),$close,$open)), Sub($high,$low)), Div(Delta($volume,5), Mean($volume,20)))"
    category: "candlestick"
    rationale: "Upper shadow * volume change — candlestick pattern with volume confirmation"

  # === Skew of smoothed returns (not raw) ===
  - name: "skew_smoothed_ret"
    expression: "Skew(Mean($close/Ref($close,1)-1, 3), 20)"
    category: "distribution"
    rationale: "Skewness of 3-day smoothed returns — reduces noise in distribution"
