proposal_id: P001
proposed_logic_id: L001
name: volume_price_divergence
category: volume_price
proposed_status: active
priority: high

hypothesis:
  condition: "量价出现背离：价格运动方向与成交量/换手率变化方向不一致"
  behavior: "背离后价格大概率向量能方向修正，产生可预测的反转或延续"
  timeframe: "5-20d"
  mechanism: >
    A 股散户占比高，量价背离往往反映知情交易者与噪声交易者行为分歧。
    放量下跌=恐慌抛售（反转概率高）；缩量上涨=无资金确认（回调概率高）。
    CSI 1000 中小盘流动性较差，背离信号持续时间更长。

rationale: >
  量价关系是技术分析最基本的维度。在旧系统中，pv_corr_times_vol (F009)、
  ret_vol_cov_20 (F008)、vol_confirmed_reversal_5 (F025) 等因子在 Grade A/B，
  说明这类信号在 A 股有稳定 alpha。新系统需重新验证并扩展。

feasibility_notes: >
  所需字段: $close, $volume, $amount, $turnover_rate — 全部可用。
  核心算子: Corr, Cov, Std, Mean, Delta, CsRank — 全部在白名单。
  DSL 表达力足够，无需 Python。
