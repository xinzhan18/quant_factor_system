proposal_id: P003
proposed_logic_id: L003
name: candlestick_structure
category: price_structure
proposed_status: active
priority: medium

hypothesis:
  condition: "K 线形态结构（影线比例、实体比例、日内振幅）出现极端值或趋势变化"
  behavior: "特定 K 线结构模式预测短期价格反转或加速，尤其在流动性事件后"
  timeframe: "5-10d"
  mechanism: >
    K 线结构编码了日内多空博弈信息：长上影线=上方抛压、长下影线=下方支撑、
    小实体=犹豫。这些微观结构信号在 A 股 T+1 制度下更有意义，
    因为日内无法反转仓位，次日修正概率更高。

rationale: >
  旧系统中 shadow_product (F053, ls_t=-10.16)、upper_shadow_x_turnover (F054)
  等 candlestick 因子有强信号。新系统可系统化探索实体/影线比例组合。

feasibility_notes: >
  所需字段: $open, $high, $low, $close — 全部可用。
  衍生量: body_ratio = Abs(Sub($close,$open))/Sub($high,$low), shadow_ratio 等。
  核心算子: Abs, Sub, Div, Mean, CsRank — 全部可用。
