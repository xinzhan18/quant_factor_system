proposal_id: L008
name: 量能竞争强度 × 估值过滤
category: liquidity_microstructure
status: proposed
created_at: '2026-04-08'

hypothesis:
  condition: "股票成交量相对竞争强度（rel-tur = Div(CsRank(turnover), CsRank(volume))）的持续性或强度异常，反映机构主动交易的边际信息"
  behavior: "当个股rel-tur异常高（高换手率/高成交量比 = 机构主动交易密集）且估值偏低时，后续收益更高"
  timeframe: "10-20d形成，持有5-15d"
  direction: "做多rel-tur强度异常 + 低估值的标的"
  prior_evidence: |
    batch_039发现：Div(CsRank(tur), CsRank(vol)) × amount_rank = alpha_surv=0.496(最佳), Barra_res=-0.347(最干净)。
    这是全新的竞争强度编码范式，区别于任何现有机制。
    batch_047：PE conditioning突破turnover regime trap。rel-tur × PE可能是更干净的独立alpha。
    batch_040-046失败的原因：所有失败机制都是协方差/集中度/相关性，被Barra吸收。
    rel-tur竞争强度是全新的维度，不属于任何现有类别。

mechanism:
  description: "rel-tur = Div(CsRank(turnover), CsRank(volume)) = turnover per unit volume activity。
  衡量的是'每一单位成交量对应的换手率'——即资金利用效率/机构主动性。
  rel-tur高 = 高换手率 + 低成交量 = 小额大单 = 机构拆单交易或量化高频
  rel-tur低 = 低换手率 + 高成交量 = 大额小卖 = 散户或大宗交易"
  novelty: "竞争强度编码（rel-tur）是全新的信号维度，不是量价相关性，不是波动率，不是资金流"
  why_now: "batch_039确认了rel-tur × amount的有效性。但amount只是第一个partner。
  rel-tur × PE (估值过滤) 和 rel-tur × close (价格变化) 还没被测试。
  估值过滤改变了dominant_style（batch_047），rel-tur × PE可能产生类似效果。"

contract:
  current_focus_question: "rel-tur × PE conditioning是否产生独立于Barra风格的alpha？"
  direction_quota: 3
  candidate_quota: 6
  preferred_families:
    - rel_tur_encoding
    - smart_money_flow
  suggested_ops:
    - Div
    - CsRank
    - Mul
    - Corr
    - TsAutoCorr
    - Ref
    - Mean
    - PE
  required_fields:
    - $turnover_rate
    - $volume
    - $pe_ratio
    - $close
  avoid_patterns:
    - Cov($amount, $turnover) — L002已失败，协方差不是竞争强度
    - HHI × tur — batch_045已失败，集中度是turnover regime代理
    - TsEntropy × tur — batch_046已失败，分布熵是turnover regime代理

discovery_budget: 10

proposal_metadata:
  escalated_from:
    - anomaly_type: volume_competition_encoding
      batch_ids: [batch_039]
      escalation_status: escalated
      note: "rel-tur conditioning产生最佳alpha_surv=0.496，需要新logic专项研究"
  mechanism_distinction: |
    rel-tur vs 其他机制：
    - vs pv_corr: 相关性 vs 竞争强度（完全不同的维度）
    - vs amount_autocorr: 时间序列持续性 vs 截面竞争强度
    - vs HHI/TsEntropy: 分散度/熵 vs 相对强度（完全不同的机制）
    - vs 换手率: 绝对值 vs 相对竞争强度（除以成交量归一化）
  candidate_expressions:
    - "Mul(Div(CsRank($turnover_rate), CsRank($volume)), CsRank($pe_ratio))"
    - "Mul(Div(CsRank($turnover_rate), CsRank($volume)), CsRank($close))"
    - "Mul(Div(CsRank($turnover_rate), CsRank($volume)), Ref(CsRank($close), 5))"
    - "TsAutoCorr(Div(CsRank($turnover_rate), CsRank($volume)), 20)"
    - "Corr(Div(CsRank($turnover_rate), CsRank($volume)), $close, 20)"
