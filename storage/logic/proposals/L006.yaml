proposal:
  logic_id: L006
  name: A股特定市场微结构 × 涨停动量
  category: market_microstructure
  status: proposed
  priority: medium
  hypothesis:
    condition: "A股特有市场结构：涨停股（limit-up）在次日存在动量效应，且该效应与换手率和流通股比例相关"
    behavior: "涨停次日买强卖弱，利用A股T+1和涨跌停制度的特有行为模式"
    timeframe: "5-20d形成，持有5-10d"
    direction: "做多近期涨停且换手率处于极端水平的标的"
    prior_evidence: |
      63 batches failures: Barra风格覆盖极全面，几乎所有技术信号都被吸收为str_1m/vol_20d/ep_ratio。
      关键洞察：A股有特有市场结构（T+1制度、涨跌停板、大宗交易等），这些在 Barra的全球框架中不存在。
      具体机制：
      1. A股T+1制度：当日买入后次日才能卖出，导致涨停后次日抛压天然存在
      2. 涨跌停板：当日涨20%后，次日情绪延续
      3. 散户比例高：涨跌停反映散户追涨行为，次日反转概率高于成熟市场
      4. 量化规模：A股散户占成交量70%+，行为规律更明显
      因此，A股特有市场微结构可能在 Barra框架之外。
    mechanism_hypothesis: |
      核心机制：Div($amount, $volume) = 成交量/股本 = 人均持股金额（代理）。
      结合 $turnover_rate（换手率）：高换手 + 大宗金额 = 机构大单或散户合力？
      但这本身可能还是 turnover_20d 或 vol_20d 的代理。
      更好的机制：Ret($close, 5) 在 涨停股 上的分布特征。
      具体：Ret($close, 5) > 0.19（近期涨停）的股票，其未来5日收益分布。
      如果次日高换手散户出逃 → 反转效应
      如果大单封板机构锁仓 → 延续效应
      用 Div($amount, $volume) 代理大单比例：大户买入则amount/volume高。
  proposed_by: factor-logic
  created_at: '2026-04-08'
  review_status: pending

4d_review:
  mechanism_review: |
    核心机制：Ret($close, 5) 识别近期涨停股（A股特有）。Div($amount, $volume) 识别大单比例。
    假设：涨停后如果大单比例高（机构锁仓），则延续；如果高换手低金额（散户出逃），则反转。
    与L001的区别：L001测蜡烛图幅度（shadow/timing），本质是str_1m变体。
    L006测涨停后的机构vs散户行为差异，A股T+1制度下特有的微结构。
    独立性来源：T+1制度是A股特有，Barra是全球框架，不覆盖。
  feasibility_review: |
    DSL支持：
    - Ret($close, 5) 可以识别近期涨幅
    - Div($amount, $volume) 是人均金额代理
    - Mul(Ret($close, 5), Div($amount, $volume)) 组合两者
    - 问题：没有直接的"涨停"标识，只能用Ret($close, 5) > 0.19近似
    - 实际：Ret($close, 5) > 0.15（15%+涨幅）代理涨停前奏
    - 字段支持：$close, $volume, $amount, $turnover_rate
  novelty_review: |
    与L001 (shadow/timing): 完全不同的机制。L001是价格幅度，L006是A股特有行为。
    与L004 (pv_corr): L004测价关系，L006测资金性质。
    Barra中无对应：T+1制度和涨跌停板是A股特有的，Barra全球框架不覆盖。
    风险：Div($amount,$volume) 可能还是被vol_20d/turnover_20d吸收。
  research_value_review: |
    如果成功：第一 个在 Barra 全球框架外捕捉 A 股特有制度的 alpha。
    如果失败：进一步证明即使特有制度也无法逃避 Barra 风格吸收。
    价值：无论结果，都能回答"A股特有微结构是否独立于 Barra"这个核心问题。
