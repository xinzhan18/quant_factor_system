proposal:
  logic_id: L007
  name: 聪明钱流量持续性 × 估值过滤
  category: smart_money_flow
  status: proposed
  priority: high
  hypothesis:
    condition: "股票的amount（成交额 = 价格 × 成交量）自相关性反映了机构大单的资金流向持续性，PE估值过滤后应该产生独立于Barra风格的alpha"
    behavior: "当大单资金持续流入（amount正自相关）且估值偏低（低PE）时，未来收益更高"
    timeframe: "10-30d形成，持有5-15d"
    direction: "做多amount自相关强 + 低PE的标的"
    prior_evidence: |
      64 batches失败：几乎所有技术信号都被Barra风格吸收。
      关键发现：
      1. TsAutoCorr($amount, 20) 被确认为novel signal class (NM_001)
      2. PE conditioning突破turnover regime trap (batch_047): PE/PS conditioning让dominant_style从turnover_20d转为str_1m/log_circ_cap
      3. Amount variants (F004-F008, F012) 都是amount × vol-competition机制——amount autocorrelation × PE没有被系统测试过
      4. 纯amount信号(L005, L006)都失败是因为Div($amount,$volume)是size proxy，return信号是str_1m clone
      机制优势：TsAutoCorr($amount, N)捕捉的是"机构大单的流入是否持续"——不同于：
      - pv_corr（价格发现质量）
      - timing_range（事件位置编码）
      - amount × vol-competition（成交量竞争强度）
      PE conditioning让dominant style从turnover_20d转移，提供Barra正交性。
  mechanism_hypothesis: |
    核心机制：TsAutoCorr($amount, N) = 成交额自相关系数。
    amount = price × volume（成交额=价格×股数），所以：
    - 高amount自相关 = 机构大单持续买入/卖出（资金流向持续）
    - 低amount自相关 = 散户短期炒作（资金流向不稳定）
    结合PE conditioning：
    - 高amount自相关 + 低PE = 机构持续买入低估股票（信息驱动）→ 预期上涨
    - 高amount自相关 + 高PE = 机构持续买入高估股票（趋势驱动）→ 可能反转
    PE conditioning改变了turnover_20d的暴露，让dominant_style转移到str_1m/log_circ_cap。
    这个机制与现有机制的差异：
    - TsAutoCorr($amount) vs TsAutoCorr($volume): amount = price×volume，捕捉的是dollar金额维度的autocorr，不是count维度
    - TsAutoCorr($amount) vs Cov($amount, $turnover): 协方差捕捉共变性，自相关捕捉持续性——后者是资金流向的"惯性"
    - PE conditioning: 让turnover_20d不再是dominant style
  proposed_by: factor-logic
  created_at: '2026-04-08'
  review_status: pending

4d_review:
  mechanism_review: |
    TsAutoCorr($amount, N) × PE conditioning 是一个全新的机制组合：
    1. TsAutoCorr($amount) 捕捉smart money accumulation/distribution persistence
    2. PE conditioning 改变dominant style从turnover_20d到str_1m
    3. 这个组合没有被任何现有logic覆盖
    与L003的区别：L003测TsAutoCorr($amount)本身的预测力，没有fundamental conditioning
    与L004的区别：L004测amount × vol-competition（竞争强度），本proposal测autocorrelation（持续性）
    与L001/L006的区别：不涉及return、shadow或涨跌停
  feasibility_review: |
    DSL支持：
    - TsAutoCorr($amount, N) 可计算（N=10/20/30）
    - CsRank($pe_ratio) 可计算
    - Mul(CsRank($pe_ratio), TsAutoCorr($amount, N)) 组合两者
    - 字段支持：$amount, $pe_ratio, $turnover_rate
    注意：TsAutoCorr在batch_001被确认有效，probe数据显示IC IR=-0.141
  novelty_review: |
    与现有logic不重叠：
    - L001: shadow × Amihud / timing_range × PE
    - L002: Cov variants（已失败）
    - L003: TsAutoCorr($amount)（无PE conditioning）
    - L004: amount × vol-competition（竞争强度）
    - L005: volume distribution（peer-normalized，已失败）
    - L006: 涨跌停微结构（return-based，失败）
    风险：TsAutoCorr($amount) × PE可能还是turnover_20d clone，但batch_047证明PE conditioning可以改变dominant style
  research_value_review: |
    如果成功：
    1. 第一个TsAutoCorr($amount) × fundamental conditioning的admitted factor
    2. 证明"资金流向持续性"机制是Barra独立的
    3. 与L004的amount × vol-competition形成互补（一个是竞争强度，一个是持续性）
    如果失败：进一步证明amount autocorrelation也只是turnover_20d proxy
    价值：无论结果，都回答了"资金流向惯性是否独立于Barra"这个核心问题
