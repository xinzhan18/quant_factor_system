deepening_threads:
- id: T001
  question: 跨截面 volume 序位（peer-normalized）是否比绝对 volume 信号更强？
  why_matters: peer-normalization 去除市场整体 volume 趋势，聚焦个股特异性。绝对 volume 可能被市场情绪掩盖。
  status: parked
  priority: high
  next_probes:
  - Div(CsRank($volume), CsRank(Mean($volume, 20))) — 成交量相对市场整体排名的偏离
  - Div(CsRank($amount), CsRank(Mean($amount, 20))) — 成交额 peer-relative 版本
  stop_condition: 如果 peer-relative volume 信号不优于绝对 volume，说明 peer normalization 无效。
- id: T002
  question: PE/PB conditioning 是否给 volume 信号添加了正交信息？
  why_matters: PE conditioning 在方向类信号（pv_corr, vol_competition）中有效。在 volume 分布信号中是否同样有效？
  status: parked
  priority: high
  next_probes:
  - Mul(Div(CsRank($volume), CsRank(Mean($volume, 20))), CsRank($pe_ratio))
  - Mul(Div(CsRank($volume), CsRank(Mean($volume, 20))), CsRank($pb_ratio))
  stop_condition: 如果 PE/PB conditioning 在 volume 信号中产生 Barra_residual < 0，确认正交维度有效。
- id: T003
  question: volume 异常的最优形成窗口是多少？
  why_matters: 20d vs 40d vs 60d — 窗口太长可能失去 volume 信号的预测力，太短可能被噪声淹没。
  status: parked
  priority: medium
  next_probes:
  - Div(CsRank($volume), CsRank(Mean($volume, 20))) — 20d baseline
  - Div(CsRank($volume), CsRank(Mean($volume, 40))) — 40d
  - Div(CsRank($volume), CsRank(Mean($volume, 60))) — 60d
  stop_condition: 如果 20d 明显优于其他窗口，说明 volume 信号本质是短期的。
next_actions:
