logic_id: L005
name: 跨截面成交量异常 x 估值过滤
category: volume_distribution
status: parked
priority: medium
hypothesis:
  condition: 个股成交量在横截面（行业/市值分组）上处于极端序位，同时 PE/PB 处于极端水平
  behavior: 成交量异常 + 估值极端 → 预测未来 5-20 日收益方向
  timeframe: 20-60d 形成窗口，5-20d 持有
  direction: 做多低 PE/PB + 成交量异常高的标的（知情买入），做空高 PE/PB + 成交量异常低的标的
  prior_evidence: 'L001 (shadow/timing_range): 全部被 str_1m 吸收。L004: PE conditioning
    在 20d pv_corr 方向已饱和。关键洞察：shadow 机制（量价幅度）和 timing_range 机制（成交量峰值距离）都是 str_1m 的变体。volume
    分布异象（peer-relative）是更干净的 volume 信号。'
contract:
  current_focus_question: 跨截面 volume 异常是否携带独立于 str_1m 的信息？PE/PB conditioning 能否给 volume
    信号添加正交维度？
  direction_quota: 3
  candidate_quota: 5
  preferred_families:
  - volume_distribution
  - peer_relative_volume
  suggested_ops:
  - Div
  - Sub
  - Mul
  - Mean
  - TsRank
  - CsRank
  - Ref
  - Less
  - Greater
  - Count
  required_fields:
  - $close
  - $volume
  - $amount
  - $pe_ratio
  - $pb_ratio
  - $turnover_rate
  avoid_patterns:
  - absolute_volume_signals_without_peer_normalization
  - volume_x_price_interaction_without_fundamental_conditioning
  - short_window_volume (< 10d formation)
  - DO NOT retry peer-relative volume anomaly × any fundamental conditioning (PE,
    PB, PS).
  - DO NOT retry volume anomaly at any window (20d, 40d) — all will be style-absorbed.
  - The peer-normalization (CsRank volume / CsRank mean volume) is just a smoothed
  - volume proxy that reduces to str_1m at some frequency.
discovery_budget: 10
evidence_summary:
  current_bottleneck: 'Confirmed: peer-relative volume anomaly IS a str_1m clone.
    The mechanism reduces

    to "how much is volume elevated vs recent average" — this is a volatility/coverage

    proxy, not independent of str_1m. Even with PE conditioning (C002), the signal

    gets absorbed into ep_ratio. The Barra style system is very comprehensive —

    most technical signals reduce to one of its style factors.

    Key insight: Barra has very low residuals for most technical signals. Creating

    genuinely Barra-orthogonal signals requires either: (1) fundamental data not in
    Barra,

    or (2) cross-sectional relationships rather than absolute levels.'
  factors_generated: 0
  factors_admitted: 0
  rounds_without_admit: 1
  failed_families: []
  productive_families: []
  transitions:
  - from: active
    to: parked
    reason: Volume anomaly mechanism (peer-normalized volume ratio) is absorbed by
      str_1m (C001) or ep_ratio (C002). PE conditioning shifts but does not eliminate
      style absorption. L005 needs completely different mechanism. Do not retry volume
      anomaly × any fundamental conditioning.
    at: '2026-04-08 09:32:28'
