logic_id: L008
name: 量能竞争强度 × 估值过滤
category: liquidity_microstructure
status: active
priority: high
hypothesis:
  condition: 股票成交量相对竞争强度（rel-tur = Div(CsRank(turnover), CsRank(volume))）的持续性或强度异常，反映机构主动交易的边际信息
  behavior: 当个股rel-tur异常高（高换手率/高成交量比 = 机构主动交易密集）且估值偏低时，后续收益更高
  timeframe: 10-20d形成，持有5-15d
  direction: 做多rel-tur强度异常 + 低估值的标的
  prior_evidence: batch_039发现：Div(CsRank(tur), CsRank(vol)) × amount_rank = alpha_surv=0.496(最佳),
    Barra_res=-0.347(最干净)。这是全新的竞争强度编码范式。batch_047：PE conditioning突破turnover regime
    trap。rel-tur × PE可能是更干净的独立alpha。
contract:
  current_focus_question: rel-tur × PE conditioning是否产生独立于Barra风格的alpha？
  direction_quota: 3
  candidate_quota: 6
  preferred_families:
  - rel_tur_encoding
  - smart_money_flow
  suggested_ops:
  - Div
  - CsRank
  - Mul
  - Corr
  - TsAutoCorr
  - Ref
  - Mean
  required_fields:
  - $turnover_rate
  - $volume
  - $pe_ratio
  - $close
  avoid_patterns:
  - Cov($amount, $turnover) — L002已失败，协方差不是竞争强度
  - HHI × tur — batch_045已失败，集中度是turnover regime代理
  - TsEntropy × tur — batch_046已失败，分布熵是turnover regime代理
  - TsAutoCorr(rel-tur) time-series variants (C004/C005) are confirmed style traps.
  - Do NOT probe TsAutoCorr(rel-tur) at any window with any conditioning.
  - Pure rel-tur × PE (C001/C002) shows mechanism is valid but economic magnitude
    is insufficient.
  - The rel-tur encoding requires an additional orthogonalizing field (like amount
    from batch_039)
  - to be tradeable. Pure rel-tur × PE is a necessary but not sufficient condition.
discovery_budget: 10
evidence_summary:
  current_bottleneck: 'rel_tur × PE conditioning VALIDATES the mechanism: dominant_style
    flips from

    turnover_20d to str_1m. But the validation signal is too weak economically.

