next_actions:
- Mul(CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,60),Ref($ps_ratio,60)))),CsRank(Mul($pb_ratio,-1)))
  — Revenue change 60d × low PB conditioning. PB is less correlated with ep_ratio
  style than PE. If this reduces style_r2 below 0.15 while maintaining ICIRval > 0.25
  and barra_res > 0, this is the admission candidate.
- Mul(CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,60),Ref($ps_ratio,60)))),CsRank(Mul($market_cap,-1)))
  — Revenue change 60d × small cap (neglected stocks). Size conditioning may amplify
  the earnings momentum without adding ep_ratio style. Small-cap stocks with improving
  revenue have largest re-rating potential (coverage/attention asymmetry).
- Mul(CsRank(Sub(Div($close,$pe_ratio),Div(Ref($close,60),Ref($pe_ratio,60)))),CsRank(Mul($pb_ratio,-1)))
  — Absolute EPS change 60d × low PB. If PB conditioning has less ep_ratio style loading
  than PE conditioning, this amplifies EPS momentum with cleaner Barra profile.
- Mul(CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,60),Ref($ps_ratio,60)))),CsRank(Mul($ps_ratio,-1)))
  — Revenue change 60d × low PS (pure PS-based value-catalyst). CsRank(-ps_ratio)
  = cheap revenue stocks. Avoids ep_ratio loading entirely. Most coherent single-metric
  approach.
