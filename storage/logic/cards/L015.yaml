    value factor. If max_lib with existing value-based factors is high, this is style
    repackaging.

    The key test is whether barra_res_icir < -0.25 and style_r2 < 0.15.

    '
  status: active
  priority: high
  next_probes:
  - Sub(CsRank(Div(Ref($pe_ratio,20),$pe_ratio)),CsRank(Div($close,Ref($close,20))))
  - Sub(CsRank(Div(Ref($pb_ratio,20),$pb_ratio)),CsRank(Div($close,Ref($close,20))))
  stop_condition: If max_lib < 0.70 vs existing factors AND alpha_surv > 0.5 AND barra_res_icir
    < -0.25, confirm as novel mechanism
- id: T002
  question: Does amount conditioning amplify the fundamental-price divergence signal?
  why_matters: 'Mul(divergence, CsRank(Div($amount,Mean($amount,20)))) showed probe
    ICIR=+0.345 vs +0.323 raw.

    Amount conditioning filters to divergence signals in liquid stocks. If conditioning
    improves

    alpha_surv AND keeps max_lib low, this becomes the best variant.

    '
  status: active
  priority: high
  next_probes:
  - Mul(Sub(CsRank(Div(Ref($pe_ratio,20),$pe_ratio)),CsRank(Div($close,Ref($close,20)))),CsRank(Div($amount,Mean($amount,20))))
  - Mul(Sub(CsRank(Div(Ref($pe_ratio,20),$pe_ratio)),CsRank(Div($close,Ref($close,20)))),CsRank(Div($amount,Mean($amount,40))))
  stop_condition: If conditioning raises alpha_surv above 0.6 AND maintains ICIR_ho
    above +0.20
next_actions:
- CsRank(Div(Div($close,$pe_ratio),Div(Ref($close,120),Ref($pe_ratio,120)))) — EPS
  change at 120d (2 quarterly cycles). Captures more earnings revision momentum. If
  ICIRval>0.20 with barra_res_icir positive, this is the admission candidate.
- 'CsRank(Div(Div($close,$pe_ratio),Mean(Div($close,$pe_ratio),60))) — EPS acceleration:
  EPS_today vs 60d-average EPS. Amplifies stocks with recent EPS breakout above their
  own 3-month average. More sensitive to quarterly earnings beats.'
- CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,120),Ref($ps_ratio,120)))) — Revenue
  change at 120d. Revenue grows more smoothly than EPS (less quarterly noise). May
  be stronger signal than EPS at same horizon.
- 'Mul(CsRank(Div(Div($close,$pe_ratio),Div(Ref($close,120),Ref($pe_ratio,120)))),CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,120),Ref($ps_ratio,120)))))
  — Multi-metric confirmation: EPS_change × Revenue_change at 120d. Stocks with BOTH
  improving earnings and revenue have stronger signal than either alone.'
