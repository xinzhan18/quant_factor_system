  productive_families: []
  failed_families: []
  current_bottleneck: 'L015 thesis confirmed and refined by batch_101. The "value
    catalyst" mechanism is valid and barra-clean:

    Fundamental improvement (EPS/Revenue change) × cheap valuation (low PE) predicts
    positive returns

    with barra_res_icir POSITIVE across all tested variants.


    The sign flip is fully resolved. The root cause was identified (price component
    in divergence formula

    loads on str_1m). The solution (pure fundamental change without price component)
    works.


    NEW INSIGHT: The Barra ep_ratio factor is INVERSELY related to earnings momentum
    in CSI1000.

    This means:

    1. Value stocks (high ep_ratio, low PE) tend to have DECLINING earnings

    2. Growth stocks (low ep_ratio, high PE) tend to have IMPROVING earnings

    3. After Barra removal, pure earnings momentum is amplified (ep_ratio DETRACTS
    from it)

    4. Adding low-PE conditioning adds ep_ratio style (partially fighting the earnings
    signal)


    OPTIMAL DIRECTION: Find a value conditioner that:

    (1) Amplifies the IC when applied to earnings/revenue change

    (2) Does NOT add ep_ratio Barra style loading

    Options: low trading volume (attention/neglect), low market cap, low PS ratio,
    momentum reversal


    ADMISSION CANDIDATE (NEAR): C004 (revenue × low PE) — ICIRval=0.265, mono_val=1.0,
    barra_res=+0.220.

    Need: style_r2 < 0.15 (currently 0.187). Alternative conditioning may unlock admission.'
  transitions: []
