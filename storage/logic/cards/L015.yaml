logic_id: L015
name: Fundamental-Price Momentum Divergence
category: value_momentum
status: active
priority: high
hypothesis:
  condition: 个股基本面估值（PE/PB）的改善速度与价格动量的背离程度
  behavior: 当PE/PB比率改善（下降=更便宜）而价格动量为负（价格未跟上），预示价值重估机会。机制为"基本面领先价格的反转信号"——机构识别后推动估值修复。
  timeframe: 20-60d估值改善期，10-20d持有
  direction: 做多（正方向因子）— 基本面改善快于价格
  prior_evidence: 'Sub(CsRank(Div(Ref($pe_ratio,20),$pe_ratio)),CsRank(Div($close,Ref($close,20)))):
    ICIR=+0.323 PASS

    Sub(CsRank(Div(Ref($pe_ratio,60),$pe_ratio)),CsRank(Div($close,Ref($close,60)))):
    ICIR=+0.307 PASS

    Sub(CsRank(Div(Ref($pb_ratio,20),$pb_ratio)),CsRank(Div($close,Ref($close,20)))):
    ICIR=+0.326 PASS

    Mul(above, CsRank(Div($amount,Mean($amount,20)))): ICIR=+0.345 PASS (strongest
    variant)

    All variants POSITIVE direction (RARE — most factors are negative direction).

    Novel mechanism: combines fundamental change rate with price change rate in cross-sectional
    comparison.

    Key risk: correlation with existing value Barra factors (ep_ratio, book_to_price).

    But the PRICE MOMENTUM interaction makes this more than pure value — it captures
    value stocks

    that have been oversold relative to their improving fundamentals.

    '
contract:
  current_focus_question: Is the PE/PB-price divergence signal independent of Barra
    value style (ep_ratio, book_to_price)? Does the momentum interaction make this
    orthogonal to pure value factors?
  direction_quota: 2
  candidate_quota: 6
  preferred_families:
  - PF_fundamental_price_divergence
  suggested_ops:
  - Sub
  - CsRank
  - Div
  - Ref
  - Mul
  - Corr
  required_fields:
  - $pe_ratio
  - $pb_ratio
  - $ps_ratio
  - $close
  - $amount
  avoid_patterns:
  - 'Pure value rank without price comparison: CsRank($pe_ratio) alone = standard
    value factor'
  - 'Pure price momentum without fundamental: pure str_1m/momentum signal'
  - 'Div($pe_ratio, $close): mixing price into fundamental ratio creates confounded
    signal'
  - 'DO NOT use: relative amount conditioning (worsens alpha_surv, C005 confirmed)'
  - 'DO NOT use: 20d price momentum as denominator (overlaps with str_1m Barra factor)'
  - DO NOT repeat PE/PB divergence with same structure without addressing value trap
    issue
  - 'CONFIRMED DEAD ENDS:'
  - 'Sub(CsRank(fundamental_change), CsRank(price_change)): ALL variants (PE/PB/PS
    at any window) = sign flip'
  - 'PE-price independence filter (1 - rolling correlation): ADDS str_1m, does not
    remove it'
  - 'Relative amount conditioning: worsens alpha_surv (C005 in batch_099)'
  - '20d price momentum component: unavoidable str_1m loading'
  - 'VIABLE PATH:'
  - 'Pure fundamental change WITHOUT price component: EPS/Revenue/EPS_acceleration'
discovery_budget:
  adjacent_discovery_route_quota: 1
evidence_summary:
  factors_generated: 0
  factors_admitted: 0
  rounds_without_admit: 2
  productive_families: []
  failed_families: []
  current_bottleneck: 'L015 thesis refined by batch_100: the sign flip in PE/PB/PS
    divergence signals comes from the PRICE CHANGE

    COMPONENT, not the fundamental change component. Sub(CsRank(fundamental_change),
    CsRank(price_change))

    = CsRank(earnings_momentum) - CsRank(price_momentum_reversal).


    The CsRank(price_change) component directly loads on str_1m Barra factor (positive
    direction = reversal

    after price DECLINE, but str_1m positive means recent price increase = opposite
    direction loading).

    This is the root cause of the sign flip: the subtraction creates a negative loading
    on str_1m.


    C003 (pure EPS change 60d) PROVES the earnings component alone is barra-clean
    (barra_res_icir=+0.394,

    alpha_surv=3.017). The mechanism exists and is orthogonal to ALL library factors
    (max_lib=0.025).

    The ONLY problem is signal weakness (ICIRval=0.123).


    Path forward is clear: amplify pure earnings momentum. Options:

    1. Longer lookback (120d): captures 2 quarterly earnings cycles — should strengthen
    signal

    2. EPS acceleration: compare EPS_today to Mean(EPS, 60d) — amplifies stocks with
    ACCELERATING earnings

    3. Revenue change proxy: CsRank(Div(Div($close,$ps_ratio), Div(Ref($close,120),Ref($ps_ratio,120))))
    — revenue momentum at 120d

    4. Multi-metric earnings momentum: Mul(CsRank(EPS_change), CsRank(Revenue_change))
    — both improving'
  transitions: []
