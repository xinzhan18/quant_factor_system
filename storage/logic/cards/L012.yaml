  current_bottleneck: 'The PE conditioning paradigm from L009 does NOT transfer to
    TsAutoCorr.

    Three distinct failure modes were observed:

    (1) PE conditioning (20d): ep_ratio style trap — alpha_surv drops to 9%

    (2) Soft-decorrelation (20d): near-duplicate of F001 with wrong-sign Barra residual
    (+0.171)

    (3) PE conditioning (10d): vol_20d style trap — alpha_surv=12%

    The core finding is that TsAutoCorr has fundamentally different Barra structure
    than Corr.

    For Corr($close,$amount,N), the signal information content is orthogonal to PE
    rank conditioning.

    For TsAutoCorr($amount,N), the signal information content is already embedded
    in Barra styles —

    conditioning just reorganizes which style factor dominates.

    F001 (plain TsAutoCorr($amount,20)) remains the canonical autocorr factor.

    Conditioning does not add value and creates style contamination.'
  transitions:
  - from: active
    to: warm
    reason: '3/3 candidates rejected. PE conditioning on TsAutoCorr produces style
      traps (ep_ratio or vol_20d).

      Soft-decorrelation creates wrong-sign Barra residuals — mechanically broken.

      The core hypothesis (PE conditions autocorr similarly to pv_corr) is FALSIFIED
      in genesis round 1.

      Key insight: TsAutoCorr has different Barra structure than Corr — the PE conditioning
      that works

      for pv_corr does NOT transfer to autocorr. The conditioning paradigm is direction-specific.

