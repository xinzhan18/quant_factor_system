    stable

    cross-sectional ranking but not enough to fully dilute the momentum component.
    The result is

    a stable (non-reversing) str_1m exposure that DOESN''T cause quintile collapse
    but IS

    flagged as borderline risk.


    The core alpha is clearly real (barra_res_icir=-0.23 for all conditioned variants,

