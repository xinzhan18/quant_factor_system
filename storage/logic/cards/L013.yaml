logic_id: L013
name: Range-Amount Correlation
category: microstructure_flow
status: active
priority: high
hypothesis:
  condition: 日内价格区间波动（(high-low)/close）与成交金额的协同运动强度
  behavior: 高波动日与大单日的共现（正相关）预示机构主动参与；两者背离（负相关）预示被动/噪声交易。与pv_corr（价格方向×成交量）互补——range-amount捕捉"波动烈度×资金量"，而非"价格方向×成交量"。
  timeframe: 10-20d形成，5-15d持有
  direction: 做多range-amount相关性异常（有条件地）
  prior_evidence: 'pv_corr family (F003-F016): ALL use $close as Corr first arg. Range
    vs amount is completely unexplored in v2. Legacy F022 (range_compression_60) used
    range magnitude, NOT range-amount correlation. Mechanism is orthogonal to all
    existing factors.'
contract:
  current_focus_question: What window (5d, 7d) maximizes IC strength for Corr(range/close,
    amount, N) while preserving the clean Barra residual (barra_res<0, alpha_surv>0.7)?
  direction_quota: 2
  candidate_quota: 4
  preferred_families:
  - PF_range_amount_flow
  suggested_ops:
  - Corr
  - Div
  - Sub
  - Mul
  - CsRank
  required_fields:
  - $high
  - $low
  - $close
  - $amount
  - $pe_ratio
  - $turnover_rate
  avoid_patterns:
  - Corr($high,$low,N) — price-only, no flow information
  - Pure range/close without amount correlation — similar to ATR, absorbed by vol
    Barra
  - Large windows (>30d) — range compression artifact, weaker signal
  - 'PROVEN FAILURES for L013:'
  - '20d window: split_stability=poor, severe train_val_decay — too slow'
  - 'PE conditioning on 10d: catastrophic holdout collapse (decay=0.312, mono_ho=-0.30)'
  - PE conditioning is INCOMPATIBLE with range-amount mechanism
  - Next exploration should NOT include PE conditioning or windows >= 10d.
discovery_budget:
  adjacent_discovery_route_quota: 2
evidence_summary:
  factors_generated: 0
  factors_admitted: 0
  rounds_without_admit: 1
  productive_families: []
  failed_families: []
  current_bottleneck: 'The range-amount correlation mechanism IS valid and novel.

    C005 (10d): max_lib=0.065, alpha_surv=0.734, barra_res=-0.201, style_r2=0.042.

    These are the BEST mechanism quality metrics in all of batch_089.

    The mechanism: when high-volatility days (wide range) consistently co-occur with
    high monetary

    flow days ($amount) over N days, this captures aggressive institutional participation.

    This is orthogonal to pv_corr (which uses close price direction vs amount).

    HOWEVER: the current 10d window is too slow. The signal has strong validation
    (ICIR=-0.271)

    but weak holdout (ICIR=-0.144), indicating the 10d averaging creates some train/val
    leakage.

    The dominant vol_20d Barra exposure (0.194) is real but manageable given low style_r2
    (0.042).

    Shorter windows (5d, 7d) should preserve the clean residual while increasing IC
    signal frequency.'
  transitions: []
