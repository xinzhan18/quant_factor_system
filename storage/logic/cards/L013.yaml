    amplifies IC (ICIR_val=-0.668) but introduces book_to_price style. Need industry
    normalization to fix style contamination.
  stop_condition: If ICIR_val > 0.35 AND barra_res < -0.15 AND alpha_surv > 0.6, promote
    to admit candidate
- id: T004
  question: Can per-industry amount normalization amplify range-amount IC without
    book_to_price style trap?
  why_matters: CsRank($amount) amplifies ICIR from -0.20 to -0.67 but introduces book_to_price
    style (style_r2=0.14-0.18, alpha_surv=0.43). Book_to_price from CsRank($amount)
    is because high daily amount = large cap = often growth stocks. Industry normalization
    removes cross-sector size bias while preserving intra-sector institutional activity
    signal.
  status: active
  priority: high
  next_probes:
  - Mul(Corr(Div(Sub($high,$low),$close),$amount,5),CsRank(Div($amount,Mean($amount,40))))
  - Mul(Corr(Div(Sub($high,$low),$close),$amount,5),CsRank(Div($amount,Mean($amount,30))))
  stop_condition: If alpha_surv > 0.5 AND barra_res_icir < -0.25 AND mono_ho <= -0.5
    AND risk_bucket=acceptable, promote to admit
