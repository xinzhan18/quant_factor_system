logic_id: L013
name: Range-Amount Correlation
category: microstructure_flow
status: active
priority: high
hypothesis:
  condition: 日内价格区间波动（(high-low)/close）与成交金额的协同运动强度
  behavior: 高波动日与大单日的共现（正相关）预示机构主动参与；两者背离（负相关）预示被动/噪声交易。与pv_corr（价格方向×成交量）互补——range-amount捕捉"波动烈度×资金量"，而非"价格方向×成交量"。
  timeframe: 10-20d形成，5-15d持有
  direction: 做多range-amount相关性异常（有条件地）
  prior_evidence: 'pv_corr family (F003-F016): ALL use $close as Corr first arg. Range
    vs amount is completely unexplored in v2. Legacy F022 (range_compression_60) used
    range magnitude, NOT range-amount correlation. Mechanism is orthogonal to all
    existing factors.'
contract:
  current_focus_question: Does the 30d-40d relative amount normalization window find
    the alpha_surv>0.5 + stable mono_ho sweet spot between 20d (alpha_surv=0.68, mono
    collapse) and 60d (alpha_surv=0.46, stable mono)?
  direction_quota: 2
  candidate_quota: 4
  preferred_families:
  - PF_range_amount_flow
  suggested_ops:
  - Corr
  - Div
  - Sub
  - Mul
  - CsRank
  required_fields:
  - $high
  - $low
  - $close
  - $amount
  - $pe_ratio
  - $turnover_rate
  avoid_patterns:
  - Corr($high,$low,N) — price-only, no flow information
  - Pure range/close without amount correlation — similar to ATR, absorbed by vol
    Barra
  - Large windows (>30d) — range compression artifact, weaker signal
  - 'PROVEN FAILURES for L013:'
  - '20d window: split_stability=poor, severe train_val_decay — too slow'
  - 'PE conditioning on 10d: catastrophic holdout collapse (decay=0.312, mono_ho=-0.30)'
  - PE conditioning is INCOMPATIBLE with range-amount mechanism
  - Next exploration should NOT include PE conditioning or windows >= 10d.
  - 'PROVEN for L013 at this stage:'
  - 'Raw window range [5d, 7d, 10d]: ICIR_ho ceiling is ~-0.14 to -0.16. Window alone
    cannot push'
  - past this. Do not probe more raw window variants without a mechanism change.
  - 'CsRank($amount) conditioning: strong IC but book_to_price trap (style_r2=0.14-0.18).'
  - Not ready for admit due to alpha_surv < 0.5.
  - 'PE conditioning (batch_089): catastrophic holdout collapse. Do not revisit.'
  - 'PROVEN FAILURES:'
  - 'CsRank($turnover_rate) conditioning: mono_ho collapse, do not probe'
  - 'CsRank($volume) conditioning: alpha_surv=0.18, do not probe'
  - 'Corr(range/close, turnover_rate, N): degenerate signal, do not probe'
  - 'Raw window variants [3d-10d]: plateau at ICIR_ho~-0.15, do not probe'
  - 'PE conditioning: batch_089 failure, do not revisit'
  - 'UPDATED PROVEN FAILURES:'
