    NEW UNDERSTANDING: str_1m exposure is NON-MONOTONIC across normalization windows:

    - 20d: str_1m≈8% (pure recent momentum → REVERSES in 2024 → mono collapse)

    - 30d: str_1m=37% (HIGH)

    - 40d: str_1m=38-42% (HIGH)

    - 60d: str_1m=14-17% (medium — longer baseline dilutes momentum component)


