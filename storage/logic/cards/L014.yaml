logic_id: L014
name: Turnover Rate Autocorrelation
category: microstructure_flow
status: active
priority: high
hypothesis:
  condition: 换手率（$turnover_rate）的时序自相关性反映了机构交易中的换手速度持续性
  behavior: 高换手率自相关（股票持续处于高/低换手率状态）预示异常的市场关注度/资金流入集中效应，可能预测未来收益
  timeframe: 10-40d形成，5-15d持有
  direction: 做多/做空基于换手率自相关方向（初始为负方向，待验证）
  prior_evidence: |
    TsAutoCorr($turnover_rate,N) probe: 10d ICIR=-0.309, 20d ICIR=-0.388 (strongest), 40d ICIR=-0.331.
    ALL three windows pass with ICIR > -0.30. This differs from TsAutoCorr($amount,20) (F001) which
    ALSO passes probe but fails full evaluation due to style contamination.
    Key difference: turnover_rate = shares traded / total shares (velocity/liquidity measure),
    amount = price × volume (dollar flow measure). Different Barra structure expected.
    Warning: soft-decorr on TsAutoCorr(turnover_rate,20) shows ICIR=-0.174 (weakens like L012),
    suggesting potential similar style contamination pattern. Full evaluation will determine
    if turnover_rate autocorr has different Barra profile than amount autocorr.
contract:
  current_focus_question: Does TsAutoCorr($turnover_rate,N) have different dominant Barra style
    than TsAutoCorr($amount,N)? L012 had turnover_20d style contamination — does turnover_rate
    autocorrelation have a different style profile that allows admission?
  direction_quota: 2
  candidate_quota: 6
  preferred_families:
    - PF_turnover_autocorrelation
  suggested_ops:
    - TsAutoCorr
    - CsRank
    - Mul
    - Sub
    - Div
  required_fields:
    - $turnover_rate
    - $pe_ratio
    - $close
    - $amount
  avoid_patterns:
    - 'PE conditioning: if turnover_rate autocorr has ep_ratio dominant style (like amount autocorr in batch_089), PE conditioning will fail the same way'
    - 'Soft-decorr of turnover_rate autocorr already tested and weakens: ICIR -0.388→-0.174'
    - 'Do NOT probe CsRank($turnover_rate) as conditioning (turnover_20d style fatal for L013)'
discovery_budget:
  adjacent_discovery_route_quota: 1
evidence_summary:
  factors_generated: 0
  factors_admitted: 0
  rounds_without_admit: 0
  productive_families: []
  failed_families: []
  current_bottleneck: null
  transitions: []
deepening_threads:
  - id: T001
    question: Does TsAutoCorr($turnover_rate) have different dominant Barra style than TsAutoCorr($amount)?
    why_matters: L012 failed because TsAutoCorr($amount) was dominated by turnover_20d Barra factor
      (barra_res_icir positive). If TsAutoCorr($turnover_rate) has a different dominant style
      (or no dominant style), it becomes admissible. Key test is whether barra_res_icir is negative.
    status: active
    priority: high
    next_probes:
      - 'TsAutoCorr($turnover_rate,20)'
      - 'TsAutoCorr($turnover_rate,10)'
      - 'TsAutoCorr($turnover_rate,40)'
    stop_condition: If alpha_surv > 0.5 AND barra_res_icir < -0.25 AND mono_ho <= -0.5
      AND risk_bucket=acceptable, promote to admit
  - id: T002
    question: Can relative amount conditioning on TsAutoCorr(turnover_rate) improve alpha_surv
      without str_1m style trap?
    why_matters: For L013, relative-amount conditioning at 40d window worked (soft-decorr approach).
      If TsAutoCorr(turnover_rate) has relative-amount conditioning opportunities, same approach
      may work.
    status: active
    priority: medium
    next_probes:
      - 'Mul(TsAutoCorr($turnover_rate,20),CsRank(Div($amount,Mean($amount,40))))'
      - 'Mul(TsAutoCorr($turnover_rate,20),Sub(CsRank(Div($amount,Mean($amount,40))),Mul(CsRank(Div($close,Ref($close,22))),0.3)))'
    stop_condition: If conditioning reduces style_r2 below 0.15 and improves alpha_surv above 0.6
next_actions:
  - 'TsAutoCorr($turnover_rate,20) — baseline 20d window, strongest probe ICIR=-0.388. Full evaluation to determine Barra style profile.'
  - 'TsAutoCorr($turnover_rate,10) — shorter window. Different regime exposure?'
  - 'Mul(TsAutoCorr($turnover_rate,20),CsRank(Div($amount,Mean($amount,40)))) — conditioning by relative amount (40d). If turnover autocorr has ep_ratio style, amount conditioning might help.'
  - 'Mul(TsAutoCorr($turnover_rate,20),Sub(CsRank(Div($amount,Mean($amount,40))),Mul(CsRank(Div($close,Ref($close,22))),0.3))) — full str_1m soft-decorr conditioning applied to turnover autocorr.'
