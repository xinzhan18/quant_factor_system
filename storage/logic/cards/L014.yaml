logic_id: L014
name: Turnover Rate Autocorrelation
category: microstructure_flow
status: parked
priority: high
hypothesis:
  condition: 换手率（$turnover_rate）的时序自相关性反映了机构交易中的换手速度持续性
  behavior: 高换手率自相关（股票持续处于高/低换手率状态）预示异常的市场关注度/资金流入集中效应，可能预测未来收益
  timeframe: 10-40d形成，5-15d持有
  direction: 做多/做空基于换手率自相关方向（初始为负方向，待验证）
  prior_evidence: 'TsAutoCorr($turnover_rate,N) probe: 10d ICIR=-0.309, 20d ICIR=-0.388
    (strongest), 40d ICIR=-0.331.

    ALL three windows pass with ICIR > -0.30. This differs from TsAutoCorr($amount,20)
    (F001) which

    ALSO passes probe but fails full evaluation due to style contamination.

    Key difference: turnover_rate = shares traded / total shares (velocity/liquidity
    measure),

    amount = price × volume (dollar flow measure). Different Barra structure expected.

    Warning: soft-decorr on TsAutoCorr(turnover_rate,20) shows ICIR=-0.174 (weakens
    like L012),

    suggesting potential similar style contamination pattern. Full evaluation will
    determine

    if turnover_rate autocorr has different Barra profile than amount autocorr.

    '
contract:
  current_focus_question: Does TsAutoCorr($turnover_rate,N) have different dominant
    Barra style than TsAutoCorr($amount,N)? L012 had turnover_20d style contamination
    — does turnover_rate autocorrelation have a different style profile that allows
    admission?
  direction_quota: 2
  candidate_quota: 6
  preferred_families:
  - PF_turnover_autocorrelation
  suggested_ops:
  - TsAutoCorr
  - CsRank
  - Mul
  - Sub
  - Div
  required_fields:
  - $turnover_rate
  - $pe_ratio
  - $close
  - $amount
  avoid_patterns:
  - 'PE conditioning: if turnover_rate autocorr has ep_ratio dominant style (like
    amount autocorr in batch_089), PE conditioning will fail the same way'
  - 'Soft-decorr of turnover_rate autocorr already tested and weakens: ICIR -0.388→-0.174'
  - Do NOT probe CsRank($turnover_rate) as conditioning (turnover_20d style fatal
    for L013)
  - DO NOT probe TsAutoCorr($turnover_rate,N) for any window — it maps to F001/L012
    subspace.
  - The mechanism is equivalent to amount autocorrelation at DSL level.
