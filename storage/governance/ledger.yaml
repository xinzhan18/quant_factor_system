  discovery_candidates:
  - anomaly_type: timing_range_3d_false_mono
    batch_ids:
    - batch_053
    description: 3d timing_range × PE shows mono_ho=-1.0 but decay_ratio=0.876 (<1),
      ls_tstat_ho=-1.09, quintuple spread=0.0006. Perfect monotonicity is a statistical
      artifact — signal WEAKENS on holdout. 3d is too fast.
    escalation_status: watch
    explainable_by_existing_logic: full
  - anomaly_type: orthogonal_blend_expression_level_fails
    batch_ids:
    - batch_054
    description: 'F002 (shadow×Amihud) × F013 (timing_range×PE) at expression level:
      both multiplicative and additive blends collapse ranking (mono_ho=0.0). Orthogonal
      families interfere when expression-level combined. Must combine at portfolio
      level.'
    escalation_status: watch
    explainable_by_existing_logic: full
    first_seen_batch: batch_053
    identified_at: '2026-04-07T06:05:00+00:00'
    likely_mechanism: 3d is too fast for timing_range — volume peak-trough distance
      requires ≥5d to accumulate meaningful signal above noise.
    style_repackaging_risk: low
  - anomaly_type: repeated_near_miss_cluster
    batch_ids:
    - batch_001
    - batch_002
    description: 'Shadow candidates (batch_001: C001, C003; batch_002: C001, C002)
      consistently produce strong in-sample signals that collapse on holdout with
      alpha_surv<0.30. Pattern: shadow × [any dimension] → style absorption within
      1-2 batches.'
    escalation_status: watch
    explainable_by_existing_logic: full
    first_seen_batch: batch_001
    likely_mechanism: Shadow is a microstructure proxy that is fundamentally correlated
      with short-term volatility and turnover. Without an orthogonal conditioning
      dimension, any shadow signal collapses.
    style_repackaging_risk: high
  - anomaly_type: amount_field_orthogonality
    batch_ids:
    - batch_038
    description: $amount field (monetary volume) produces orthogonal signals to $volume
      in multiplicative conditioning. C003 (amount variant) achieves comparable ICIR
      to C001 (volume variant) with clean Barra residual. This is a new signal direction
      beyond OHLCV daily space.
    escalation_status: watch
    explainable_by_existing_logic: partial
    first_seen_batch: batch_038
    likely_mechanism: $amount = price × volume in monetary terms. It proxies informed
      trading better than raw share count because large trades have larger monetary
      impact.
    style_repackaging_risk: medium
  - anomaly_type: volume_competition_encoding
    batch_ids:
    - batch_039
    description: Relative tur rank conditioning (Div(CsRank(tur),CsRank(vol))) achieves
      alpha_surv=0.496 (session best) and Barra_res=-0.347 (session cleanest). New
      conditioning paradigm beyond simple multiplicative CsRank.
    escalation_status: escalated
    explainable_by_existing_logic: partial
    first_seen_batch: batch_039
    likely_mechanism: Div(CsRank(tur), CsRank(vol)) = turnover per unit volume activity.
      Captures the intensity of trading activity beyond raw levels.
    style_repackaging_risk: low
  - anomaly_type: L002_systematically_absorbed_by_style
    batch_ids:
    - batch_001
    - batch_002
    - batch_003
    - batch_040
    description: L002 has 0 admits across 4 batches. All Cov variants (amt,tur; amt,pb;
      tur,range; tur,ps_ratio) produce positive Barra residuals, confirming systematic
      absorption by Barra styles.
    escalation_status: escalated
    explainable_by_existing_logic: full
    first_seen_batch: batch_001
    likely_mechanism: Cov with turnover as operand is absorbed by turnover_20d regime.
      No L002 mechanism has survived Barra residual check.
    style_repackaging_risk: high
  - anomaly_type: duplicate_expression_cluster
    batch_ids:
    - batch_041
    description: 2 candidates (C001, C004) are expression-level duplicates of already-admitted
      factors (F010, F002). Pre-probe expression dedup check is missing in current
      pipeline.
    escalation_status: watch
    explainable_by_existing_logic: full
    first_seen_batch: batch_041
    likely_mechanism: Expression dedup is not checked during probe or manifest freeze.
      The probe step should reject expressions identical to existing registry factors.
    style_repackaging_risk: high
  - anomaly_type: pure_vol_competition_insufficient
    batch_ids:
    - batch_041
    description: Div(CsRank(amount),CsRank(volume)) without pv_corr fails holdout
      with sign flip (mono_val=-0.9 → mono_ho=+0.5). The pv_corr component is essential
      for signal survival.
    escalation_status: watch
    explainable_by_existing_logic: partial
    first_seen_batch: batch_041
    likely_mechanism: Volume competition alone (no price discovery component) is insufficient
      mechanism. The pv_corr provides the price dimension that makes vol-competition
      actionable.
    style_repackaging_risk: medium
  - anomaly_type: shadow_conditioning_boundaries
    batch_ids:
    - batch_042
    description: Shadow only survives with Amihud (cost-of-trading) as conditioning
      partner. pv_corr (alpha_surv=0.138) and vol-competition (mono sign flip, size
      proxy) both fail. Confirms shadow captures cost-of-trading microstructure.
    escalation_status: watch
    explainable_by_existing_logic: full
    first_seen_batch: batch_042
    likely_mechanism: Shadow signal is fundamentally about cost-of-trading. Only Amihud
      (amount/volume) is orthogonal. pv_corr and vol-competition are correlated with
      style factors.
    style_repackaging_risk: high
  - anomaly_type: pe_conditioning_not_universal
    description: PE conditioning breakthrough from L004 (pv_corr direction signals)
      does NOT transfer to Cov(close, turnover/amount) co-movement signals. Same conditioning
      dimension, completely different mechanism response.
    escalation_status: watch
    explainable_by_existing_logic: full
    first_seen_batch: batch_049
    identified_at: '2026-04-07T12:00:00+00:00'
    likely_mechanism: PE/PS conditioning works for direction signals (pv_corr, vol
      competition) but not for magnitude/co-movement signals (Cov-based)
    status: watch
    style_repackaging_risk: high
  - anomaly_type: timing_range_perfect_mono
    description: 'IdxMax-IdxMin range (volume/turnover peak-trough distance) × PE
      conditioning shows perfect holdout monotonicity (mono_ho=-1.0) with decay_ratio>1.8.
      Signal is STRONGER on holdout. Key question: genuine timing range alpha or str_1m
      re-labeled?'
    escalation_status: watch
    explainable_by_existing_logic: partial
    first_seen_batch: batch_050
    identified_at: '2026-04-07T12:30:00+00:00'
    likely_mechanism: Timing range captures volatility of timing, genuinely different
      from single-point timing or co-movement
    status: watch
    style_repackaging_risk: medium
  - anomaly_type: timing_range_window_optimization
    description: '10d timing_range × PE: alpha_surv=0.879, 2× better than 20d timing_range
      (0.44-0.45). Window optimization is decisive. Amihud conditioning fails for
      timing_range (opposite of shadow).'
    escalation_status: watch
    explainable_by_existing_logic: partial
    first_seen_batch: batch_051
    identified_at: '2026-04-07T13:00:00+00:00'
    likely_mechanism: Shorter timing_range windows capture transient timing before
      str_1m absorption. str_1m style absorption happens over time — shorter windows
