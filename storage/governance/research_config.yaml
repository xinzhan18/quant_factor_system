# ============================================================
# Research Configuration — Single Source of Truth
# ============================================================
# All skills, CLI commands, and pipeline code load from this file.
# Path: storage/governance/research_config.yaml
#
# To override for a specific run, use CLI flags (e.g. --universe).
# To change defaults for all future runs, edit this file.
# ============================================================

# ---- Universe ----
universe: csi1000

# ---- Qlib ----
qlib_data_dir: "~/.qlib/qlib_data/cn_data_1d"

# ---- Evaluation Profile ----
evaluation_profile:
  profile_id: research_eval_v1
  delay: 1
  holding_horizon: 5
  primary_pipeline:
    - universe_mask
    - tradability_mask
    - winsorize
    - zscore_or_rank
    - neutralization

# ---- Sample Policy (date ranges) ----
sample_policy:
  data_start: "2015-01-01"
  active_train_range: ["2015-01-01", "2021-12-31"]
  active_validation_range: ["2022-01-01", "2023-12-31"]
  support_validation_windows:
    - window_id: val_2020_2021
      range: ["2020-01-01", "2021-12-31"]
    - window_id: val_2021_2022
      range: ["2021-01-01", "2022-12-31"]
    - window_id: val_2022_2023
      range: ["2022-01-01", "2023-12-31"]
  holdout_pool_range: ["2024-01-01", "2025-12-31"]
  holdout_used: true
  validation_policy_version: research_sample_v3

# ---- Thresholds ----
thresholds:
  ic_threshold: 0.01
  correlation_threshold: 0.7
  replacement_ic_ratio: 1.3
  replacement_ic_min: 0.03
  hard_gate_oos_decay_min: 0.2
  hard_gate_coverage_min: 0.3
  hard_gate_ic_oos_min: 0.008

# ---- Library ----
library:
  target_size: 100
  candidates_per_batch: 8
  corr_check_years: 2

# ---- Probe defaults ----
probe:
  start: "2019-01-01"
  end: "2023-12-31"

# ---- Forbidden patterns ----
# Expressions matching these are auto-rejected by precheck.
# Managed via ForbiddenManager lifecycle (active → under_review → retired).
forbidden_patterns:
  - id: FP001
    pattern: "TsAutoCorr\\(\\$turnover_rate"
    description: "换手率自相关零信号 (ST002, batch_003)"
    status: active
    added_batch: batch_003

  - id: FP002
    pattern: "Mean\\(Div\\(Sub\\(\\$high.*If\\(Gt\\(\\$open,\\$close\\)"
    description: "上影线比例均值 — extreme regime instability, holdout IC=0 (ST005, batch_003)"
    status: active
    added_batch: batch_003

  - id: FP003
    pattern: "Std\\(Div\\(Sub\\(\\$high.*If\\(Gt\\(\\$open,\\$close\\)"
    description: "上影线比例波动 — same regime trap as FP002 (ST005, batch_003)"
    status: active
    added_batch: batch_003

  - id: FP004
    pattern: "IdxMax\\(\\$amount"
    description: "IdxMax(amount) near-duplicate of IdxMax(volume), corr=0.92 (batch_004)"
    status: active
    added_batch: batch_004

  - id: FP005
    pattern: "IdxMax\\(\\$turnover_rate"
    description: "IdxMax(turnover_rate) near-duplicate of IdxMax(volume), corr=0.99 (batch_004)"
    status: active
    added_batch: batch_004

  - id: FP006
    pattern: "Corr\\(\\$amount.*\\$turnover_rate"
    description: "amount-turnover corr produces near-constant values, zero signal (batch_004)"
    status: active
    added_batch: batch_004
