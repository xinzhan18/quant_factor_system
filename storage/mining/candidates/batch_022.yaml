timestamp: "2026-03-31T18:00:00"
candidates:
  # ── Direction 1: amount_volatility (genesis, L003 量价背离) ──────────
  # Probe: Std($amount, 20) IC=-0.035. $amount has confirmed data.
  # Similar structure to F004 (Std($volume,20)) but different signal dimension.

  - name: amount_vol_10
    expression: "Std($amount, 10)"
    category: volume
    logic_id: L003
    direction: amount_volatility
    rationale: >
      Short-window amount volatility. $amount = price×volume, captures combined
      price-volume activity differently from pure volume vol (F004). High amount
      vol = high-activity stocks with large price swings, consistent with low-vol
      anomaly in A-shares.

  - name: amount_vol_20
    expression: "Std($amount, 20)"
    category: volume
    logic_id: L003
    direction: amount_volatility
    rationale: >
      20-day amount volatility, same as probe expression (IC=-0.035). Different
      from F004 (Std($volume,20), IC=-0.039) because $amount incorporates price
      level, not just share count.

  - name: amount_pv_corr_10
    expression: "Corr($close, $amount, 10)"
    category: volume
    logic_id: L003
    direction: amount_volatility
    rationale: >
      Price-amount correlation over 10 days. F008=Cov(ret,$volume,20),
      F009=Corr($close,$volume,10)×vol. Using $amount instead of $volume captures
      a different PV-divergence signal (incorporates effective trading price).

  # ── Direction 2: turnover_x_reversal (crossover, L004 换手率流动性折价) ─
  # Probe: Std($turnover_rate,10) × neg_ret5 IC=+0.024, WinRate=59.9%.
  # Logic: high-activity stocks (measured by turnover volatility) that declined
  # recently face mean reversion as active traders step in.

  - name: turnover_vol_x_reversal_5
    expression: "Mul(Std($turnover_rate, 10), Mul(Sub(Div($close,Ref($close,5)),1), -1))"
    category: liquidity
    logic_id: L004
    direction: turnover_x_reversal
    rationale: >
      Turnover volatility (10d) × negative 5-day return. High-turnover-vol stocks
      that declined recently attract reversal players. Crossover of L004
      (换手率流动性) and L001 (动量反转). Probe IC=+0.0238, WinRate=59.9%.

  - name: turnover_level_x_reversal_20
    expression: "Mul(Mean($turnover_rate, 20), Mul(Sub(Div($close,Ref($close,20)),1), -1))"
    category: liquidity
    logic_id: L004
    direction: turnover_x_reversal
    rationale: >
      Turnover level (20d mean) × negative 20-day return. Structurally different
      from candidate above: uses level (not volatility) and longer reversal window.
      Low turnover stocks with 20d decline may be neglected value stocks.

  # ── Direction 3: value_x_reversal (crossover, L009 价值估值效应) ───────
  # Probe: 1/PB × neg_ret20 IC=+0.022, WinRate=57.9%.
  # Logic: cheap stocks (low PB) with recent price decline = deep value opportunity.
  # F028 (inverse_pb) alone IC=+0.028; adding momentum filter should refine timing.

  - name: pb_x_reversal_20
    expression: "Mul(Div(1, Add($pb_ratio, 0.001)), Mul(Sub(Div($close,Ref($close,20)),1), -1))"
    category: valuation
    logic_id: L009
    direction: value_x_reversal
    rationale: >
      1/PB × negative 20-day return. Cheap stocks that have fallen 20d = deep value
      with momentum confirmation (waiting for stock to show weakness before buying).
      Probe IC=+0.0223. Combines F028 structure with reversal timing.

  - name: pb_x_reversal_10
    expression: "Mul(Div(1, Add($pb_ratio, 0.001)), Mul(Sub(Div($close,Ref($close,10)),1), -1))"
    category: valuation
    logic_id: L009
    direction: value_x_reversal
    rationale: >
      1/PB × negative 10-day return. Shorter reversal window may capture faster
      mean-reversion dynamics in cheap stocks. Variant of pb_x_reversal_20 with
      10d instead of 20d momentum window.

  - name: pb_rank_x_reversal_20
    expression: "Mul(Mul(Rank($pb_ratio, 60), -1), Mul(Sub(Div($close,Ref($close,20)),1), -1))"
    category: valuation
    logic_id: L009
    direction: value_x_reversal
    rationale: >
      -Rank(PB,60) × neg_ret20. Rank(PB,60) is time-series rank of current PB
      within own 60d history; -1× means low rank = currently cheap vs own history.
      Cross with reversal: stock currently cheap vs own history AND recently fell.
      Different from pb_x_reversal which uses absolute PB level.
