batch_id: "batch_004"
timestamp: "2026-03-24T01:35:00"
candidates:
  - name: "vol_regime_asym_mom"
    expression: "If(Greater(Std($close/Ref($close,1)-1, 20), Med(Std($close/Ref($close,1)-1, 20), 60)), $close/Ref($close,5)-1, $close/Ref($close,20)-1)"
    category: "regime"
    rationale: "ASYMMETRIC payloads: high vol → short-term 5d return (fast reversal), low vol → longer 20d return (slow momentum). Different horizons, not just negation."

  - name: "vol_regime_range_vol"
    expression: "If(Greater(Std($close/Ref($close,1)-1, 20), Med(Std($close/Ref($close,1)-1, 20), 60)), Mean(Div(Sub($high, $low), $close), 5), Mean(Div(Sub($high, $low), $close), 60))"
    category: "regime"
    rationale: "ASYMMETRIC: high vol → use short-term (5d) intraday range, low vol → use long-term (60d) range. Different lookbacks per regime."

  - name: "price_high_distance"
    expression: "Div(Sub($close, TsMax($close, 60)), TsMax($close, 60))"
    category: "momentum"
    rationale: "Distance from 60-day high as percentage. Strong momentum stocks stay near highs. Classic 52-week high proxy."

  - name: "price_low_distance"
    expression: "Div(Sub($close, TsMin($close, 60)), TsMin($close, 60))"
    category: "momentum"
    rationale: "Distance from 60-day low. Stocks near lows may be value traps or reversal candidates."

  - name: "vol_weighted_return"
    expression: "Div(Sum(Mul($close/Ref($close,1)-1, $volume), 20), Sum($volume, 20))"
    category: "volume"
    rationale: "Volume-weighted average return over 20 days. High volume returns carry more information — institutional-driven moves."

  - name: "max_drawdown_20"
    expression: "Div(Sub(TsMin($close, 20), TsMax($close, 20)), TsMax($close, 20))"
    category: "volatility"
    rationale: "Maximum drawdown over 20 days. Captures downside risk which may be more informative than symmetric volatility."

  - name: "volume_spike_freq"
    expression: "Mean(If(Greater($volume, Mul(Mean($volume, 20), 2)), 1, 0), 20)"
    category: "volume"
    rationale: "Frequency of volume spikes (>2x average) in last 20 days. Captures event-driven trading activity."

  - name: "mean_reversion_strength"
    expression: "Div(Sub($close, Mean($close, 20)), Std($close, 20))"
    category: "momentum"
    rationale: "Bollinger Band z-score: (close - MA20) / std20. Measures how far price deviates from moving average, normalized."
