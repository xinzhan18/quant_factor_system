batch_id: "batch_028"
timestamp: "2026-04-02T03:00:00"
candidates:
  # ── Direction 1: VWAP/close proxy ($amount construct) ──────────────────────
  - name: vwap_close_ratio
    expression: "Div($amount, Add(Mul($close, $volume), 1))"
    category: volume
    logic_id: L007
    direction: vwap_signal
    rationale: >
      VWAP/close proxy. $amount/(close×volume) ≈ VWAP/close. Probe IC=+0.033,
      ICIR=+0.201, WinRate=62%. When VWAP > close: stock sold off into close.
      Novel construct — no existing factor uses this ratio.

  - name: vwap_close_ratio_5d
    expression: "Mean(Div($amount, Add(Mul($close, $volume), 1)), 5)"
    category: volume
    logic_id: L007
    direction: vwap_signal
    rationale: >
      5-day mean of VWAP/close ratio. Smooths daily noise. Persistent VWAP>close
      over 5 days = sustained selling pressure into close = stronger reversal signal.

  # ── Direction 2: Amount coefficient of variation ────────────────────────────
  - name: amount_cv_5_20
    expression: "Div(Std($amount, 5), Add(Mean($amount, 20), 1))"
    category: volume
    logic_id: L003
    direction: amount_cv
    rationale: >
      5d amount Std / 20d mean. Probe IC=-0.031, ICIR=-0.290. Scale-invariant
      version of Std($amount) — batch_026 Std($amount,10) had corr=0.731 with F004.
      CV normalization should reduce this by adjusting for trading level.

  - name: amount_cv_10_60
    expression: "Div(Std($amount, 10), Add(Mean($amount, 60), 1))"
    category: volume
    logic_id: L003
    direction: amount_cv
    rationale: >
      10d amount Std / 60d mean. Longer-term normalized instability. Different
      time scales from 5/20 version, may capture medium-term shifts.

  # ── Direction 3: Medium-term price reversal (L001) ──────────────────────────
  - name: price_reversal_60
    expression: "Div(Ref($close, 60), Add($close, 0.001))"
    category: momentum
    logic_id: L001
    direction: medium_reversal
    rationale: >
      60-day price reversal. Probe IC=+0.029, ICIR=+0.140. Past/current price ratio.
      High ratio = stock fell = oversold. With F003/F023 removed, medium-term reversal
      space is open. Pure level ratio, different from alpha024's complex construct.

  - name: price_reversal_20
    expression: "Div(Ref($close, 20), Add($close, 0.001))"
    category: momentum
    logic_id: L001
    direction: medium_reversal
    rationale: >
      20-day price reversal. Shorter window captures recent reversal. Different
      from 60d in capturing quicker mean reversion.

  # ── Direction 4: Size × reversal (L010×L011) ───────────────────────────────
  - name: size_x_reversal_20
    expression: "Mul(Div(1, Add($circ_market_cap, 1)), Mul(Sub(Div($close, Ref($close, 20)), 1), -1))"
    category: other
    logic_id: L010
    direction: size_x_reversal
    rationale: >
      Small-cap × 20d reversal. Probe IC=+0.025, ICIR=+0.150. Small stocks that
      recently declined have strongest bounce potential (retail speculation + neglect).
      Different from size_x_pb (F038) — reversal dimension instead of valuation.

  - name: mad_returns_20
    expression: "Mean(Abs(Sub(Div($close, Ref($close, 1)), 1)), 20)"
    category: volatility
    logic_id: L005
    direction: mad_volatility
    rationale: >
      20-day mean absolute deviation of returns. Probe IC=-0.023, ICIR=-0.129.
      Alternative volatility measure to Std. MAD is more robust to outliers.
      With F003/F007 removed, may have lower corr with remaining vol factors.
