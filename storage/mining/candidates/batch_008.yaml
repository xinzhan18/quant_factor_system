description: "Target missing dimensions: momentum (no factors), distribution (no factors). Also try novel constructions."
candidates:
  # === Momentum dimension (completely missing) ===
  # Raw returns failed (IC=-0.035 but corr with library). Try non-standard momentum.
  - name: "rank_momentum_20"
    expression: "Rank($close/Ref($close,1)-1, 20)"
    category: "momentum"
    rationale: "Rolling rank of return — transforms to uniform distribution, may decorrelate"

  # Momentum via regression
  - name: "slope_volume_20"
    expression: "Slope($volume, 20)"
    category: "momentum"
    rationale: "Volume slope — is volume trending up or down?"

  # === Distribution dimension (completely missing) ===
  # IQR and quantiles all correlated with volatility. Try skew-based.
  - name: "signed_skew_momentum"
    expression: "Mul(Skew($close/Ref($close,1)-1, 20), $close/Ref($close,5)-1)"
    category: "distribution"
    rationale: "Skew * return — positive skew in downtrend vs negative skew in uptrend"

  # === Novel interactions ===
  - name: "volume_price_divergence"
    expression: "Sub(Rank($volume, 60), Rank($close, 60))"
    category: "volume"
    rationale: "Long-term volume rank minus price rank — divergence signal"

  - name: "conditional_decay_range"
    expression: "If(Greater(Div($volume, Mean($volume,20)), 1), TsDecay(Div(Sub($high,$low),$close), 5), Mean(Div(Sub($high,$low),$close), 20))"
    category: "regime"
    rationale: "High volume → decay-weighted recent range; low volume → average range"

  # === Stronger constructions from baseline insights ===
  - name: "pv_corr_signed_vol"
    expression: "Mul(Corr($close,$volume,20), Std($volume, 20))"
    category: "volume"
    rationale: "PV corr * volume vol — different interaction from pv_corr*price_vol"

  - name: "close_range_ratio_smoothed"
    expression: "Mean(Div(Sub($close, $low), Sub($high, $low)), 10)"
    category: "candlestick"
    rationale: "10-day smoothed close position — more stable than single-day"

  - name: "high_low_ratio_20"
    expression: "Div(Mean($high, 20), Mean($low, 20))"
    category: "candlestick"
    rationale: "Average high / average low ratio — price range over 20 days"
