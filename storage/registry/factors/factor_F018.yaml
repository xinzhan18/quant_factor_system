rationale: >
  Absolute EPS change 60d conditioned on low PB. EPS_today - EPS_60d_ago (using
  close/pe_ratio as proxy) captures fundamental earnings improvement in absolute
  terms. Low PB conditioning selects stocks cheap on book assets. PB is less correlated
  with ep_ratio Barra factor than PE, reducing style contamination. This is the
  primary value catalyst: cheap assets + improving earnings = re-rating potential.

mechanism_category: fundamental_value_catalyst
mechanism_description: >
  EPS momentum × value anchor. Earnings change (close/pe_ratio) captures per-share
  earnings improvement over 60d. CsRank(-pb_ratio) isolates stocks cheapest relative
  to book assets. The combination targets stocks with fundamental improvement trading
  below book value — the classic value re-rating mechanism for Chinese A-shares.

