rationale: >
  Revenue change 60d (PS-based) conditioned on low PS. Revenue_today/Revenue_60d_ago
  captures improvement in revenue efficiency. CsRank(-ps_ratio) selects stocks cheapest
  relative to their revenue base. Pure single-metric PS catalyst: "cheap revenue stock
  with growing revenue." PS is orthogonal to all standard Barra value factors (ep_ratio
  is earnings-based, book_to_price is asset-based; PS is revenue-based). Achieves
  style_r2=0.049 — cleanest Barra profile in the entire L015 series.

mechanism_category: fundamental_value_catalyst
mechanism_description: >
  Revenue momentum × revenue value anchor. Revenue change (close/ps_ratio) captures
  per-share revenue growth over 60d. CsRank(-ps_ratio) isolates stocks cheapest relative
  to their revenue base. Pure self-consistent PS catalyst: both the change metric and
  the conditioning anchor use the same fundamental metric (revenue). Targets stocks where
  revenue is growing while the stock is still cheap relative to that revenue — classic
  growth-at-a-discount signal. Revenue is smoother than EPS (no one-time charges),
  reducing quarterly noise.

