thresholds:
  ic_min: 0.01
  correlation_max: 0.7
  replacement_ic_ratio: 1.3
  replacement_ic_min: 0.03
factors:
- id: '001'
  name: std_returns_20
  expression: Std($close/Ref($close,1)-1, 20)
  category: volatility
  ic_mean: -0.0575
- id: '002'
  name: delta_volume_5
  expression: Delta($volume, 5) / Mean($volume, 20)
  category: volume
  ic_mean: -0.0323
- id: '003'
  name: vol_regime_reversal
  expression: If(Greater(Std($close/Ref($close,1)-1, 20), Med(Std($close/Ref($close,1)-1,
    20), 60)), $close/Ref($close,5)-1, Mul($close/Ref($close,5)-1, -1))
  category: regime
  ic_mean: -0.0435
- id: '004'
  name: std_volume_20
  expression: Std($volume, 20)
  category: volume
  ic_mean: -0.0392
- id: '005'
  name: upper_shadow_ratio
  expression: Div(Sub($high, If(Greater($close, $open), $close, $open)), Sub($high,
    $low))
  category: candlestick
  ic_mean: 0.0347
- id: '006'
  name: resi_close_5
  expression: Resi($close, 5)
  category: trend
  ic_mean: -0.0325
- id: '007'
  name: vol_regime_resi_vs_slope
  expression: If(Greater(Std($close/Ref($close,1)-1,10), Std($close/Ref($close,1)-1,60)),
    Resi($close,10), Slope($close,10))
  category: regime
  ic_mean: -0.034
- id: 008
  name: ret_vol_cov_20
  expression: Cov($close/Ref($close,1)-1, $volume, 20)
  category: volume
  ic_mean: -0.0327
- id: 009
  name: pv_corr_times_vol
  expression: Mul(Corr($close, $volume, 10), Std($close/Ref($close,1)-1, 10))
  category: volume
  ic_mean: -0.0521
- id: '010'
  name: hhi_volume_20
  expression: HHI($volume, 20)
  category: volume
  ic_mean: -0.0341
- id: '012'
  name: up_day_count_20
  expression: Div(Count(Greater($close, Ref($close,1)), 20), 20)
  category: momentum
  ic_mean: 0.010694831745259138
- id: '013'
  name: alpha038
  expression: Mul(Mul(Rank(Rank($open, 10), 60), Rank(Div($close, $open), 60)), -1)
  category: candlestick
  ic_mean: 0.035497
- id: '014'
  name: alpha023
  expression: If(Greater($high, Mean($high, 20)), Mul(Delta($high, 2), -1), 0)
  category: momentum
  ic_mean: 0.029621
- id: '015'
  name: alpha053
  expression: Mul(Delta(Div(Sub(Sub($close, $low), Sub($high, $close)), Sub($close,
    $low)), 9), -1)
  category: candlestick
  ic_mean: 0.023441
- id: '016'
  name: alpha010
  expression: Rank(If(Greater(Min(Delta($close, 1), 4), 0), Delta($close, 1), If(Less(Max(Delta($close,
    1), 4), 0), Delta($close, 1), Mul(Delta($close, 1), -1))), 60)
  category: momentum
  ic_mean: 0.017062
- id: '017'
  name: alpha034
  expression: Rank(Sub(Sub(2, Rank(Div(Std($close/Ref($close,1)-1, 2), Std($close/Ref($close,1)-1,
    5)), 60)), Rank(Delta($close, 1), 60)), 60)
  category: volatility
  ic_mean: 0.019405
- id: 018
  name: alpha017
  expression: Mul(Mul(Rank(Rank($close, 10), 60), Rank(Delta(Delta($close, 1), 1),
    60)), Mul(Rank(Rank(Div($volume, Mean($volume, 20)), 5), 60), -1))
  category: momentum
  ic_mean: 0.023129
- id: 019
  name: rank_ret_times_rank_vol
  expression: Mul(Rank($close/Ref($close,1)-1, 20), Rank($volume, 20))
  category: volume
  ic_mean: -0.04101
- id: '020'
  name: intraday_vs_overnight
  expression: Sub(Div(Sub($close, $open), $open), Div(Sub($open, Ref($close, 1)),
    Ref($close, 1)))
  category: momentum
  ic_mean: -0.0376
- id: '021'
  name: alpha024
  expression: If(Less(Div(Delta(Mean($close, 60), 60), Ref($close, 60)), 0.05), Mul(Sub($close,
    Min($close, 60)), -1), Mul(Delta($close, 3), -1))
  category: momentum
  ic_mean: 0.048737
- id: '022'
  name: range_compression_60
  expression: Div(Div(Sub($high, $low), $close), Mean(Div(Sub($high, $low), $close),
    60))
  category: candlestick
  ic_mean: -0.04223
- id: '023'
  name: signed_sqrt_return
  expression: SignedPower($close/Ref($close,1)-1, 0.5)
  category: momentum
  ic_mean: -0.03178
- id: '024'
  name: atr_like_14
  expression: Mean(If(Greater(Sub($high,$low), Abs(Sub($high,Ref($close,1)))), If(Greater(Sub($high,$low),
    Abs(Sub($low,Ref($close,1)))), Sub($high,$low), Abs(Sub($low,Ref($close,1)))),
    If(Greater(Abs(Sub($high,Ref($close,1))), Abs(Sub($low,Ref($close,1)))), Abs(Sub($high,Ref($close,1))),
    Abs(Sub($low,Ref($close,1))))), 14)
  category: volatility
  ic_mean: -0.0443
- id: '011'
  name: williams_r_variant
  expression: Div(Sub(Mul(2, $close), $low), Sub($high, $low))
  category: candlestick
  ic_mean: 0.06952
- id: '025'
  name: vol_confirmed_reversal_5
  expression: Mean(Mul(Sign(Delta($volume, 1)), Mul(Delta($close, 1), -1)), 5)
  category: volume
  ic_mean: 0.0363
- id: '026'
  name: pv_corr_times_vol_5
  expression: Mul(Corr($close, $volume, 5), Std($close/Ref($close,1)-1, 5))
  category: volume
  ic_mean: -0.0388
- id: '027'
  name: turnover_vol_10
  expression: Std($turnover_rate, 10)
  category: liquidity
  ic_mean: -0.04709097901924844
  source: dsl
- id: 028
  name: inverse_pb
  expression: Div(1, $pb_ratio)
  category: valuation
  ic_mean: 0.0278
  source: dsl
- id: 029
  name: mean_turnover_20
  expression: Mean($turnover_rate, 20)
  category: liquidity
  ic_mean: -0.0379
- id: '030'
  name: turnover_change_5
  expression: Delta(Mean($turnover_rate, 5), 5)
  category: liquidity
  ic_mean: -0.0216
- id: '031'
  name: turnover_vol_20
  expression: Std($turnover_rate, 20)
  category: liquidity
  ic_mean: -0.0436
- id: '032'
  name: turnover_vol_60
  expression: Std($turnover_rate, 60)
  category: liquidity
  ic_mean: -0.0351
- id: '033'
  name: mean_turnover_5
  expression: Mean($turnover_rate, 5)
  category: liquidity
  ic_mean: -0.0455
- id: '034'
  name: pb_ratio_rank_60
  expression: Rank($pb_ratio, 60)
  category: valuation
  ic_mean: -0.0379
- id: '035'
  name: pb_x_reversal_10
  expression: Mul(Div(1, Add($pb_ratio, 0.001)), Mul(Sub(Div($close,Ref($close,10)),1),
    -1))
  category: valuation
  ic_mean: 0.0331
  source: dsl
- id: '036'
  name: turnover_level_x_reversal_20
  expression: Mul($turnover_rate, Mul(Sub(Div($close,Ref($close,20)),1), -1))
  category: liquidity
  ic_mean: 0.0286
  source: dsl
