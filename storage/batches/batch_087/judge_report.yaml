      thesis_update: |
        L011 (Return Distribution Higher Moments) first batch results are informative but negative.
        120d unconditional kurtosis produces near-zero IC — the mechanism is style-clean but signal-free.
        60d skewness produces a significant reversal signal (IC=-0.023, ls_tstat=-3.05) — but this is
