      failure_boundary: |
        L011 higher-moments mechanism is NOT working at 60-120d windows.
        Kurtosis at 120d is signal-free. Skewness at 60d is a reversal signal absorbed by turnover.
        The next probes (if any) should be at MUCH longer windows (240d+) or conditioned on
        something orthogonal to turnover (e.g., fundamental rank changes).

      open_questions:
        - "Would 240d kurtosis capture structural tail risk that affects returns?"
        - "Would conditioning skewness on fundamental changes (e.g., PE rank delta) produce independent signal?"
        - "Is there a skewness of volume/turnover (not returns) that works?"

      next_best_probes:
        - expr: "TsKurt($close, 240)"
          why: "240d may capture structural tail risk that 120d misses"
        - expr: "TsSkew($close, 120) × CsRank($amount)"
          why: "Skewness conditioned on liquidity level at longer window"
