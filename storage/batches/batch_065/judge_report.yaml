  logic_recommendations:
    L007:
      logic_id: L007
      recommended_status: parked
      reason: |
        L007 (聪明钱流量持续性 × 估值过滤) tested TsAutoCorr($amount) × PE/PS conditioning
        as a novel mechanism. The hypothesis was that amount autocorrelation (smart money
        persistence) conditioned by PE/PS fundamental rank would break the turnover regime
        trap and produce Barra-independent alpha.

        Result: FULL FAILURE. All 6 candidates rejected.
        - TsAutoCorr($amount) solo collapses to turnover_20d (C001: max_lib_corr=1.0=F001)
        - TsAutoCorr($amount) × PE collapses to ep_ratio — PE is absorbing not orthogonalizing
        - TsAutoCorr($amount) × PS collapses to str_1m — same pattern as PE
        - All candidates show POSITIVE or near-zero Barra residual IC (style absorption)
        - alpha_survival_ratio range: 0.09-0.46 (all poor)

        Key insight: TsAutoCorr($amount) is the same mechanism as TsAutoCorr($volume).
        batch_050 (NM_001) confirmed amount autocorrelation is novel class, but that
        was solo TsAutoCorr($amount, 20) without fundamental conditioning. When
        conditioning is applied, it collapses to styles just like volume variants.

        The critical contrast: batch_047 found PE/PS conditioning BREAKS the turnover
        trap for pv_corr (dominant_style flips from turnover_20d to str_1m/log_circ_cap).
        But the same conditioning FAILS for TsAutoCorr($amount). This suggests:
        1. Amount autocorrelation is fundamentally different from price-volume correlation
        2. PE/PS conditioning doesn't orthogonalize amount autocorrelation to Barra styles
        3. The smart money flow thesis is not validated by these results

        Decision: L007 should be PARKED. The mechanism is absorbed by Barra regardless
        of fundamental conditioning. Do not continue TsAutoCorr($amount) × PE/PS direction.
        Future directions should explore genuinely different mechanisms for amount field
        (not autocorrelation-based).
      direction_quota: 3
      candidate_quota: 6

  logic_diagnostics:
    L007:
      thesis_update: |
        TsAutoCorr($amount) × PE/PS conditioning FAILS to produce Barra-independent alpha.
        The smart money flow thesis is NOT validated by this batch. Amount autocorrelation
        collapses to Barra styles (turnover_20d, ep_ratio, vol_20d, str_1m) regardless of
        fundamental conditioning. The positive Barra residual IC across all candidates confirms
        systematic absorption.

        Critical contrast with batch_047: PE/PS conditioning BREAKS the turnover trap for
        pv_corr (dominant_style flips from turnover_20d to str_1m), but the SAME conditioning
        FAILS to break the trap for TsAutoCorr($amount). This is a genuine mechanism
        differentiation: amount autocorrelation ≠ price-volume correlation.

        Key finding: amount autocorrelation and volume autocorrelation are the same
        mechanism class when fundamentals are involved. Solo TsAutoCorr($amount) is
        novel (batch_050), but TsAutoCorr($amount) × PE/PS is not.

      evidence_for:
        - "All 6 candidates pass execution gate with good feasibility (coverage>99%, turnover<13%)"
        - "C001: max_lib_corr=1.0 vs F001 confirms TsAutoCorr($amount) = TsAutoCorr($volume) at expression level"
        - "C003/C005: ep_ratio dominant (0.227-0.284) confirms PE is absorbed, not orthogonal"
        - "C006: str_1m dominant (0.151) with PS confirms same pattern as PE"
        - "C004: vol_20d dominant (0.140) shows no Barra independence at 10d"

      evidence_against:
        - "All 6 candidates: Barra_residual_IC near zero or positive (0.007 to -0.009)"
        - "alpha_survival_ratio: 0.089-0.464 (all poor, none above 0.5)"
        - "Positive residual IC means signal is absorbed by Barra styles, not orthogonal"
        - "C001 max_lib_corr=1.0 is exact F001 duplicate (volume autocorrelation proxy)"
        - "PE conditioning works for pv_corr (batch_047) but NOT for amount autocorrelation — different mechanisms"

      failure_boundary: |
        TsAutoCorr($amount) × PE/PS conditioning is now confirmed as a style trap.
        L007 threads T001 (solo TsAutoCorr baseline) and T002 (PE conditioning) are both
        bounded by this failure. Do NOT continue:
        - TsAutoCorr($amount) solo at any window (C001/C002 collapse to F001 or turnover_20d)
        - TsAutoCorr($amount) × PE/PS at any window (C003-C006 collapse to ep_ratio/str_1m)
        - Any expression combining TsAutoCorr($amount) with fundamental conditioning

      open_questions:
        - "Is solo TsAutoCorr($amount) genuinely novel, or is batch_050's positive result an artifact?"
        - "Why does PE conditioning break the turnover trap for pv_corr but NOT for TsAutoCorr($amount)?"
        - "What mechanism could make amount autocorrelation Barra-independent?"
        - "Should L007 redirect to non-autocorrelation approaches for the amount field?"

      next_best_probes:
        - expr: "TsAutoCorr($close, 20)"
          why: "Pure price autocorrelation (not amount) to test if amount dimension is the source of style absorption"
        - expr: "Mul(Corr($close, $amount, 20), CsRank($pe_ratio))"
          why: "Price-amount correlation (cross-asset flow) × PE — different from autocorr-based approach"
        - expr: "Cov($amount, $turnover_rate, 20)"
          why: "Amount-turnover co-movement (not autocorrelation) — tests if co-movement is different mechanism from autocorr"

