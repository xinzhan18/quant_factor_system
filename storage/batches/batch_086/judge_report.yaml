  logic_diagnostics:
    L010:
      thesis_update: |
        L010 (regime-adaptive cross-sectional signals) has now produced 19 candidates across 6 batches.
        The evidence is overwhelming: ALL cross-sectional short-window signals get absorbed by str_1m
        or turnover_20d, regardless of regime conditioning. Even "clean" mechanisms like kurtosis
        (style_r2=0.08) produce near-zero IC. The market-regime flip (high-vol→short) that worked
        in batch_084 (IC=+0.039) cannot be improved — every attempt to add quality gates or
        remove the flip makes it WORSE. The fundamental issue is that regime classification at
        the market level is too coarse — it doesn't create genuinely independent signals.

      evidence_for:
        - "batch_084 C002: IC=+0.039, IR=+0.311 (only positive IC in campaign)"
        - "batch_085 C002: style_r2=0.411 (no flip), still str_1m absorbed"
        - "batch_086 C001: kurtosis style_r2=0.08 (cleanest in campaign), IC=-0.003 (useless)"
        - "batch_086 C002: autocorrelation, IC_val=+0.0004, holdout decay=50×"

      evidence_against:
        - "14 cross-sectional regime candidates (batch_082-085): ALL show str_1m or turnover_20d dominance"
        - "Amount mid-range (20-80pct) IS str_1m mechanism — batch_085 C001 style_r2=0.719 (worst)"
        - "Kurtsosis (C001): Barra_residual_IC=0.007, effectively zero"
        - "Autocorrelation (C002): decay_ratio=50×, catastrophic OOS collapse"

      failure_boundary: |
        L010 is NOT a productive logic direction. 6 batches, 19 candidates, 0 admits.
        The regime-adaptive cross-sectional mechanism is fundamentally limited:
        (1) Cross-sectional short-window signals are universally absorbed by str_1m
        (2) Adding regime conditioning doesn't help — makes it worse
        (3) Adding quality gates doesn't help — makes it worse
        (4) Removing conditioning (pure time-series) gives clean style but zero IC
        The problem is NOT the specific implementation — it's the entire mechanism class.

      open_questions:
        - "Could intertemporal signals at MUCH longer windows (120d+) avoid str_1m absorption?"
        - "Is there a fundamentally different regime classification (not market-level vol) that creates genuine independent signals?"
        - "Could sector-relative regime avoid the market-level coarse classification problem?"

