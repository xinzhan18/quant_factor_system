  logic_diagnostics:
    L009:
      thesis_update: |
        Technical blocker identified: $turnover_rate and $pe_ratio/$ps_ratio have
        different instrument sets in the Qlib data provider. Probe CLI masks this by
        using a smaller train-only universe and different NaN handling. Full pipeline
        (validation + risk review) exposes the alignment mismatch.
        The probe results for turnover-based Corr × PE rank (IR=-0.4121 for 10d)
        suggest the mechanism is real — but cannot be evaluated in the current system.
        Amount-based Corr ($close, $amount) does NOT have this problem (confirmed in batch_073).

      evidence_for:
        - "C002 probe: IR=-0.4121 (strongest in L009 series)"
        - "C001 probe: IR=-0.3502 (PASS)"
        - "Amount-based Corr × PE rank: Barra_res=-0.0104 (clean) from batch_073 C003"

      evidence_against:
        - "All 5 candidates: compute_error:ValueError in full pipeline"
        - "2674 instruments (Corr) vs 2620 instruments (CsRank(PE))"
        - "The field alignment mismatch is systematic across all windows (5d/10d/20d)"

      failure_boundary: |
        Turnover-based Corr with PE/PS conditioning cannot be evaluated in current system.
        The field alignment issue ($turnover_rate vs $pe_ratio) is a data provider constraint.
        Amount-based Corr is confirmed working. Do NOT retry turnover-based Corr × fundamental rank.

      open_questions:
        - "Could CsRank on turnover itself (e.g., Div(Corr, 1+CsRank($turnover_rate))) avoid the alignment issue?"
        - "Is the field alignment fixable at the data provider level?"
        - "Does amount-based Corr × PE rank have lower redundancy than current library?"

      next_best_probes:
        - expr: "Mul(Corr($close,$amount,10),CsRank($pe_ratio))"
          why: "Amount-based 10d × PE rank — tests if 10d window improves on 5d C003"
        - expr: "Mul(Corr($close,$amount,10),CsRank($ps_ratio))"
          why: "Amount-based 10d × PS rank — tests PS vs PE conditioning on amount"
        - expr: "Mul(Corr($close,$amount,10),CsRank($turnover_rate))"
          why: "Amount-based 10d × turnover rank — turnover_rank not turnover_rate (different field)"

