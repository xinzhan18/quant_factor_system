  logic_diagnostics:
    L008:
      thesis_update: |
        rel_tur × amount × PE triple conditioning does NOT replicate batch_039 success.
        Perfect validation monotonicity (-1.0) collapses to near-zero on holdout for ALL variants.
        PE is NOT the essential third field. The amount field helps (decay_ratio better than
        pure rel-tur × PE from batch_066) but is not sufficient alone.
        batch_039's alpha_surv=0.496 was likely regime-specific and not replicable.

      evidence_for:
        - "C003 decay_ratio=0.689 better than batch_066's 0.55-0.59 — amount dimension genuinely helps"
        - "All candidates: Barra_residual clean (-0.035 to -0.041), dominant_style=str_1m (low)"
        - "All candidates: expanding_window_pass=True — signal not spurious in-sample"
        - "C001/C002: max_lib_corr=0.38-0.39 vs F005 — genuinely novel vs existing factors"

      evidence_against:
        - "ALL 3 candidates: mono_val=-1.0 but mono_ho=-0.1 to -0.3 (NEAR-ZERO collapse)"
        - "ALL 5 holdout quintiles positive — ranking preserved but spread compressed to ~0.001/month"
        - "alpha_surv=0.47-0.49 — less than 50% of validation alpha survives"
        - "C003 (no PE) more compressed than C001/C002 (with PE) — PE adds marginal signal not noise"
        - "batch_039 success NOT replicable: same expression pattern but alpha_surv=0.47 vs 0.496"

      failure_boundary: |
        Triple conditioning with PE is CONFIRMED insufficient. Do not probe rel-tur × amount × PE
        further. The rel-tur × amount WITHOUT PE (C003) also fails — confirming that amount alone
        is not the missing third field from batch_039. The batch_039 success may have been
        data-regime specific or required different market conditions.

      open_questions:
        - "Is batch_039's success reproducible with different conditioning partners (PB, PS)?"
        - "Is there a scale effect? Should test 5d and 10d windows instead of 20d cross-sectional?"
        - "Could market_cap or circ_market_cap be the essential third field?"
        - "Does the success come from specific rebalancing frequency or holding period?"

      next_best_probes:
        - expr: "Mul(Div(CsRank($turnover_rate), CsRank($volume)), CsRank($pb_ratio))"
          why: "PB (price-to-book) is a different fundamental dimension than PE. Tests if value anchoring is the key, not earnings."
        - expr: "Mul(Div(CsRank($turnover_rate), CsRank($volume)), Rank($market_cap))"
          why: "Market cap conditioning tests if size orthogonalization is the missing element from batch_039."
        - expr: "Mul(Mul(Div(CsRank($turnover_rate), CsRank($volume)), CsRank($amount)), Rank(Mul($close, $volume)))"
          why: "Amount × close (monetary flow) as third field instead of PE. Tests if monetary flow dimension is essential."

