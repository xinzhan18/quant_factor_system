      - 'All 4 batches: no admission, consistent str_1m or turnover_20d dominance'
      failure_boundary: '不再用amount mid-range作为质量过滤（已证伪：它是str_1m，不是质量）。

        不再用个股级market-regime分类产生正交alpha（已证伪：regime=str_1m）。

        不再用任何基于percentile排序的横截面过滤作为独立机制。

        这些是设计空间层面的边界，不是参数问题。'
      open_questions:
