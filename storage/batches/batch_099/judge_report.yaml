discovery_flags:
  - anomaly_type: positive_direction_barra_sign_flip_cluster
    description: |
      All 4 L015 variants (PE 20d, PB 20d, PE×amount 20d, PE 60d) show consistent barra_res_icir
      sign flip: raw IC is positive (+0.024-0.043) but barra_res_icir is negative (-0.161 to -0.308).
      The 60d variant has the smallest flip magnitude (-0.184). This cluster suggests the positive-
      direction fundamental divergence signal is absorbed by Barra value/momentum factors at all
      tested windows but to a lesser degree at 60d.
    likely_mechanism: |
      PE ratio change has two drivers: (1) earnings improvement (GOOD signal) and (2) price decline
      making PE look cheaper (value trap). The DSL signal cannot separate these. After Barra value
      style removal, the price-decline component (value trap) dominates → negative residual IC.
      The 60d window has smaller flip because longer fundamental cycles better capture true earnings
      improvement vs price-driven PE changes.
    style_repackaging_risk: medium
    explainable_by_existing_logic: partial
    escalation_status: watch
    first_seen_batch: batch_099

logic_diagnostics:
  L014:
    thesis_update: |
      L014 thesis falsified: TsAutoCorr($turnover_rate) is essentially TsAutoCorr($amount) at 20d
      (max_lib=0.970). The turnover_rate and amount fields are too correlated for autocorrelation
      purposes — both measure trading activity persistence. The mechanism insight (different Barra
      structure for velocity vs dollar flow) is NOT confirmed — at 20d, they produce identical signals.
      At 10d, structural separation exists (max_lib=0.413) but style contamination persists.
      L014 should be parked — the mechanism is a subset of L012 with no viable differentiation.

    evidence_for:
      - "C002 (10d): max_lib=0.413 — some structural separation at shorter windows"
      - "Both 10d and 20d pass probe and validation IC"

    evidence_against:
      - "C001 (20d): max_lib=0.970 = clone of F001. No differentiation at 20d."
      - "Both variants: positive barra_res_icir — same style contamination as L012"
      - "C002 extreme decay=2.35 — validation uniquely bad, signal unstable"
      - "Same pattern as L012: all windows show style contamination. L014 is L012 variant."

    failure_boundary: |
      DO NOT probe TsAutoCorr($turnover_rate,N) for any window — it maps to F001/L012 subspace.
      The mechanism is equivalent to amount autocorrelation at DSL level.

    open_questions: []
    next_best_probes: []

  L015:
    thesis_update: |
      L015 thesis partially confirmed: fundamental-price divergence IS a novel signal class
      (max_lib=0.32-0.40 vs library). The mechanism exists and has consistent IC.
      But the barra_res sign flip reveals the positive IC comes primarily from Barra value
      factor loading, not from pure alpha. The 60d window (risk=borderline, smaller sign flip)
      is the most promising direction.

      Key insight: PE ratio change conflates earnings improvement (pure alpha) with price-driven
      cheapening (value trap). The DSL CsRank approach cannot separate these.

      Next direction: can we isolate the earnings improvement component?
      - Pure earnings proxy: `Div(Div($close,$pe_ratio),Div(Ref($close,20),Ref($pe_ratio,20)))` = EPS ratio change
      - This equals EPS_today/EPS_20d_ago = pure earnings change, no price contamination
      - If this has positive direction and positive barra_res_icir, it's pure alpha

    evidence_for:
      - "All variants pass validation+holdout with consistent positive direction IC"
      - "max_lib=0.32-0.40 vs library — genuinely novel mechanism class"
      - "C006 (60d): risk=borderline, smaller barra_res sign flip (-0.184)"
      - "mono_ho=+1.0 for C006 — perfect holdout quintile ordering"

    evidence_against:
      - "barra_res_icir consistently negative (sign flip) — positive IC from Barra value loading"
      - "C005 amount conditioning WORSENS alpha_surv — no synergy with liquidity filter"
      - "C004 (PB 20d): alpha_surv=0.721 BUT barra_res_icir=-0.308 (severe sign flip)"
      - "Current signal cannot separate earnings improvement from price-driven PE cheapening"

    failure_boundary: |
      DO NOT use: relative amount conditioning (worsens alpha_surv, C005 confirmed)
      DO NOT use: 20d price momentum as denominator (overlaps with str_1m Barra factor)
      DO NOT repeat PE/PB divergence with same structure without addressing value trap issue

    open_questions:
      - "Can pure earnings proxy (EPS change) produce positive barra_res_icir?"
      - "Is the 60d window's smaller sign flip due to lower str_1m overlap or different earnings dynamics?"
      - "Can PS ratio change (less correlated with market momentum) produce better barra_res?"
      - "Would conditioning on LOW existing PE (already cheap stocks) reduce value trap contamination?"

    next_best_probes:
      - expr: "CsRank(Div(Div($close,$pe_ratio),Div(Ref($close,20),Ref($pe_ratio,20))))"
        why: "Pure EPS change proxy: EPS_today/EPS_20d_ago. No price contamination — earnings momentum. If this has positive direction + positive barra_res_icir, confirms the earnings improvement mechanism."
      - expr: "Sub(CsRank(Div(Ref($ps_ratio,20),$ps_ratio)),CsRank(Div($close,Ref($close,20))))"
        why: "PS ratio (revenue/price) divergence. PS changes more slowly than PE (revenue less volatile than EPS). May have different Barra loading and smaller sign flip."
      - expr: "Mul(Sub(CsRank(Div(Ref($pe_ratio,60),$pe_ratio)),CsRank(Div($close,Ref($close,60)))),If(Lt($pe_ratio,CsRank($pe_ratio)),1,0))"
        why: "PE divergence 60d conditioned on ALREADY LOW PE (percentile-based filter). Reduces value trap by only selecting stocks that are fundamentally cheap AND improving."
      - expr: "Corr(Div(Ref($pe_ratio,5),$pe_ratio),Div($close,Ref($close,5)),20)"
        why: "Rolling 20d correlation between 5d PE change rate and 5d price change rate. High correlation = PE moves with price (not independent). Low correlation = PE moves independently of price = pure earnings signal."
