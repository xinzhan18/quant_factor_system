        Corr($close, $amount) captures directional co-movement which has genuine residual alpha
        (Barra_res=-0.002 for C004).
        This is a fundamental distinction: directional co-movement (Corr) has independent
        information; magnitude co-movement (Cov) does not.
        The 5d window (C004) remains optimal: decay_ratio=1.611, mono=-1.0/-1.0.
        The 10d window (C001) shows good metrics but positive Barra_res disqualifies it.
        The 20d window (C003) shows decay_ratio<1.0 (signal weakens on holdout).

      evidence_for:
        - "C004 (Corr 5d): Barra_res=-0.002 (only negative residual in batch)"
        - "C004: decay_ratio=1.611 (IC STRENGTHENS significantly on holdout)"
        - "C001/C002/C003 (all Cov): Barra_res=+0.016 to +0.020 (all POSITIVE)"
        - "C001: mono=-1.0/-1.0 val/ho but positive Barra_res = style trap"
        - "All Cov variants show vol_20d or str_1m as dominant style"

      evidence_against:
        - "C004: alpha_surv=0.063 (VERY LOW — lowest in L009 series)"
        - "C004: max_lib_corr=0.886 vs F006 (HIGH redundancy)"
        - "C005 (Cov × vol_rank): mono decays from -0.7 to -0.3 (SEVERE)"
        - "C003: decay_ratio=0.926 (<1.0, IC WEAKENS on holdout)"
        - "All Cov variants: high Barra_residual indicates style absorption"

      failure_boundary: |
        Cov mechanism is DEAD for L009. All 3 Cov variants show positive Barra residual.
        Volume conditioning on Cov does NOT help — C005 mono collapses.
        The Corr mechanism remains viable but is highly redundant with existing factors.
        5d window is optimal; 10d and 20d Cov windows fail on Barra residual or decay.

      open_questions:
        - "What is the minimum redundancy threshold for L009 Corr admission?"
        - "Could Cov with a DIFFERENT conditioning partner (not volume) work?"
        - "Is there a Cov variant that produces NEGATIVE Barra residual?"
        - "Could decorrelate step on Corr reduce redundancy vs F006?"

