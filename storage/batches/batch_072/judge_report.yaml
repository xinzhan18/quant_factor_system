  logic_diagnostics:
    L009:
      thesis_update: |
        Cov vs Corr question RESOLVED: Corr is the correct measure for L009.
        Cov($close, $amount) captures magnitude co-movement which is highly correlated with
        volatility regimes (vol_20d dominant style). The POSITIVE Barra residual (+0.016 to +0.020)
