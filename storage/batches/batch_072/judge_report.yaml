        - expr: "Corr($close, $amount, 5) - Cov($close, $amount, 5)"
          why: "Subtract Cov component from Corr to isolate DIRECTIONAL component — tests if residual is cleaner"
        - expr: "Div(Corr($close, $amount, 5), (1+TsStd($volume, 20)))"
          why: "Volume volatility conditioning — divide by volume stability instead of TsRank (different from C005)"
        - expr: "Corr($close, $amount, 5) x Decay($amount, 10)"
          why: "Weight recent amount by time — tests if recent co-movement matters more"

