discovery_flags:
  - anomaly_type: internal_decorr_alpha_surv_gt1_cluster
    description: |
      Three internal-decorr variants (coeff 0.3, 0.5, 0.7) all produce alpha_surv>1.0
      (1.031, 1.067, 1.110). Signal is amplified by Barra removal. This cluster confirms
      a consistent pattern: the internal-decorr structure has deep Barra orthogonality but
      insufficient raw IC. The alpha_surv>1.0 cluster (3+ observations) represents a stable
      anomaly — the signal type is consistently "amplified after style removal" which is
      unusual and worth tracking for future Python-level approaches.
    likely_mechanism: |
      Vol_20d Barra factor negatively correlates with range-amount signals (high-vol days
      also have high range, creating spurious negative correlation with vol Barra). Removing
      vol_20d and other style factors AMPLIFIES the pure alpha. The internal-decorr structure
      maximizes this Barra orthogonality at the cost of raw IC.
