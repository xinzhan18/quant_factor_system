        - "C004: alpha_surv=0.042 (VERY LOW)"
        - "C005: decay_ratio=0.926 (<1.0 — weakens on holdout)"
        - "All candidates show str_1m exposure (0.188-0.247)"

      failure_boundary: |
        Cov - Corr is dead. Cov component dominates and creates style trap.
        Volume normalization is dead. Kills alpha (alpha_surv=0.042).
        20d windows are too slow (decay_ratio<1.0).
        PE rank conditioning is the only viable remaining path.
        But PE rank alone still has high redundancy (0.806).

