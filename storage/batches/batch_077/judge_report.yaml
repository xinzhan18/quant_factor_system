        This removes the tur_rank contamination while preserving the PE-conditioned Corr signal.
        PB conditioning (Div approach) does NOT improve redundancy — redundancy stays 0.83-0.85.
        The Div approach (batch_076) reduced redundancy to 0.70-0.74 but at cost of alpha_surv=0.21-0.28.
