        Pure Corr×PE without decorrelation: redundancy 0.78-0.81 (too high).
        Div normalization: redundancy 0.70-0.74 but alpha_surv=0.21-0.28 (too low).
        Soft subtraction (Sub with 0.05-0.1 coefficient): redundancy 0.74-0.76, alpha_surv=0.37-0.38 (ACCEPTABLE).
        The sweet spot: 10% subtraction coefficient achieves lowest redundancy with best alpha_surv.

      open_questions:
