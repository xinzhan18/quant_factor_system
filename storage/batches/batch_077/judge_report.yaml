        L009 CORR MECHANISM IS VALIDATED — FIRST ADMISSION ACHIEVED.
        F015 (corr_amount_10d_x_pe_minus_tur10): max_lib=0.740, alpha_surv=0.383, Barra_res=-0.0115.
        The breakthrough: soft decorrelation via SUBTRACTION (not Division).
