      - "Does revenue change × small cap (low market cap) produce better mono_ho?"
      - "Can multi-metric (EPS + Revenue together) reduce the validation-holdout decay?"
      - "What is the minimum ICIRho needed with mono_ho > 0.6 to trigger acceptable risk bucket?"

