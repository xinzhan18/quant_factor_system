new_lessons:
  - id: NM-L015-value-catalyst-barra-clean-breakthrough
    type: NM
    lesson: |
      Fundamental improvement × low valuation (value catalyst) achieves POSITIVE barra_res_icir across
      ALL variants: EPS absolute×PE (-0.284), EPS ratio×PE (+0.239), Revenue×PE (+0.220), BV×PB (+0.078).
      The sign flip is fully resolved by removing the price component from the fundamental change measure.
      Pure earnings/revenue change + value conditioning is barra-clean. max_lib < 0.16 for all — novel.
      Style loading: ep_ratio dominant for PE-conditioned variants (style_r2=0.18-0.29). Threshold for
      acceptable risk: style_r2 < 0.15 (all variants are borderline at style_r2 = 0.18-0.29).
      Key finding: C003 (base absolute EPS, no conditioning) has alpha_surv=4.563 — Barra value factors
      strongly DETRACT from pure earnings momentum, making it the most novel signal possible.
    evidence_batches: [batch_101]

  - id: FP-L015-low-pe-conditioning-adds-ep-ratio-style
    type: FP
    lesson: |
      CsRank(Mul($pe_ratio,-1)) = low PE conditioning adds ep_ratio style exposure to earnings momentum
      signals. Style_r2 increases: 0.025 (base C003) → 0.187-0.287 (conditioned variants).
      The ep_ratio Barra factor has NEGATIVE exposure to earnings momentum (value stocks don't have
      earnings momentum in CSI1000 universe). Low PE conditioning partially fights the earnings signal.
      The amplification in raw IC (0.071→0.265) is smaller than the style_r2 increase (0.025→0.187).
      Trade-off: conditioning improves raw IC but increases style exposure.
      Next: explore conditioning that amplifies IC without adding ep_ratio style — use size/volume/other
      conditioners instead of PE-based value conditioners.
    evidence_batches: [batch_101]

  - id: FP-L015-bv-catalyst-dominated-by-barra
    type: FP
    lesson: |
      BV change × low PB (C005): alpha_surv=0.212 — Barra book_to_price absorbs 79% of IC.
      Book value change IS essentially the book_to_price dynamic: BV improving → P/B improving.
      Do NOT use PB-based fundamental change × low PB as an earnings catalyst signal.
      This is structurally equivalent to book_to_price style with a slight momentum overlay.
      Revenue change (PS-based) and EPS change (PE-based) are more independent from Barra value factors.
    evidence_batches: [batch_101]

