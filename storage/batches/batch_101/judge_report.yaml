      - Sub(CsRank(fundamental_change), CsRank(price_change)): str_1m trap
      - PE-price independence filter: adds str_1m
      - Relative amount conditioning: worsens alpha_surv (C005 batch_099)
      - BV change × low PB: dominated by book_to_price Barra
