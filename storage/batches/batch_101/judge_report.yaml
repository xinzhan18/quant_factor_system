    likely_mechanism: |
      In CSI1000 universe, earnings improvement correlates with GROWTH stocks (high PE, improving EPS).
      Barra ep_ratio factor captures value stocks (cheap PE). These are OPPOSED:
      high ep_ratio → low PE → often declining earnings
      low ep_ratio → high PE → often improving earnings
      Pure EPS change = earnings momentum = growth signal that Barra value factors SUBTRACT from.
      After Barra removal, the growth momentum signal amplifies. This is a clean growth/quality mechanism.
    style_repackaging_risk: low
    explainable_by_existing_logic: partial
