        15% subtraction coefficient: kills mono stability despite better alpha_surv and redundancy.
        5d window: too short for PE conditioning to be effective.
        20d window: too slow — decay_ratio<1 means signal weakens on holdout.
        Pure Corr×PE without decorrelation: redundancy 0.78-0.81 (too high).
        Div normalization: redundancy 0.70-0.74 but alpha_surv=0.21-0.28 (too low).
        10% subtraction + 10d window is the confirmed optimal configuration.

