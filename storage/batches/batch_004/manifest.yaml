  - name: idxmax_amount_20
    candidate_id: C004_01
    logic_id: L001
    route_id: R1
    family_id: PF_pv_timing
    route_type: decorrelate
    experiment_lineage_tag: ELT_L001_decorrelate_pv_timing_v2
    source_type: dsl
    expression: "IdxMax($amount, 20)"
    direction: short
    rationale: >
      成交量峰值出现时机（20日窗口内第几天最大量），但用 amount 替代 volume。
      amount 包含价格×成交量信息，IdxMax(amount) 捕捉高热度股票的峰值时机，
      不同于 IdxMax(volume)。预期与 R005 低相关（不同量纲）
    probe_ic: -0.0269

  - name: idxmax_turnover_20
    candidate_id: C004_02
    logic_id: L001
    route_id: R1
    family_id: PF_pv_timing
    route_type: decorrelate
    experiment_lineage_tag: ELT_L001_decorrelate_pv_timing_v2
    source_type: dsl
    expression: "IdxMax($turnover_rate, 20)"
    direction: short
    rationale: >
      换手率峰值时机（20日内第几天最高换手）。高换手率峰值时机反映
      机构调仓或流动性耗竭的时序模式，与 IdxMax(volume) 不同但可能相关。
      测试换手率峰值的预测能力
    probe_ic: -0.0241

  - name: amount_cv_20_60
    candidate_id: C004_03
    logic_id: L002
    route_id: R2
    family_id: PF_amount_concentration
    route_type: mutate
    experiment_lineage_tag: ELT_L002_genesis_amount_cv_v2
    source_type: dsl
    expression: "Div(Std($amount, 20), Mean($amount, 60))"
    direction: short
    rationale: >
      Amount 变异系数（20日标准差/60日均值）。与 R002 类似但窗口更长。
      超长周期 amount 波动率反映资金容量约束和机构持仓调整压力
    probe_ic: -0.0531

  - name: amount_turnover_corr_20
    candidate_id: C004_04
    logic_id: L002
    route_id: R2
    family_id: PF_liquidity_asymmetry
    route_type: mutate
    experiment_lineage_tag: ELT_L002_genesis_liq_asymmetry_v2
    source_type: dsl
    expression: "Corr($amount, $turnover_rate, 20)"
    direction: short
    rationale: >
      Amount 与换手率的20日相关性。高相关等于资金流入流出与换手率同步，
      低相关等于资金流向与换手率背离（可能反映主力托盘或派发）
    probe_ic: 0.0090

  - name: price_position_range
    candidate_id: C004_05
    logic_id: L003
    route_id: R3
    family_id: PF_intraday_range
    route_type: decorrelate
    experiment_lineage_tag: ELT_L003_decorrelate_candlestick_v1
    source_type: dsl
    expression: "Div(Sub($close, $low), Sub($high, $low))"
    direction: short
    rationale: >
      收盘价在日内高低点间的相对位置（0等于最低价，1等于最高价）。
      低值等于收盘接近低点等于盘中反弹失败等于空头信号。
      是 ATR（高低 range）的补充，捕捉收盘位置而非振幅
    probe_ic: -0.0179

  - name: lower_shadow_ratio_20
    candidate_id: C004_06
    logic_id: L003
    route_id: R3
    family_id: PF_intraday_range
    route_type: decorrelate
    experiment_lineage_tag: ELT_L003_decorrelate_candlestick_v1
    source_type: dsl
    expression: "Mean(Div(Sub($low, If(Lt($open,$close),$open,$close)), Sub($high, $low)), 20)"
    direction: short
    rationale: >
      下影线比例（下影除以高减低）的20日均值。
      与 upper_shadow（已证实 regime 不稳定）不同，
      下影线反映下方支撑强度。低下影等于收盘接近低点等于空头信号
    probe_ic: -0.0209
