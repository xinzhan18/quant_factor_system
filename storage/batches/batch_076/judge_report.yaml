        L009 has rounds_without_admit=4. PE rank conditioning with Div decorrelation is the most promising path.
        direction_quota: 3
        candidate_quota: 6

  logic_diagnostics:
    L009:
      thesis_update: |
        The Div normalization (Div(Corr×PE, 1+tur_rank)) successfully reduces redundancy to 0.70-0.74.
        This is the KEY finding: the decorrelate mechanism IS validated.
        But the cost is alpha_surv: Div normalization strips alpha to 0.21-0.28.
        The mechanism: Div normalization removes the tur_rank influence from Corr×PE,
        leaving only the PE-conditioned Corr signal stripped of tur_rank contamination.
        The redundancy reduction confirms that tur_rank was adding redundant variance.
        But Div may be over-stripping — removing both the style component AND part of the alpha.

      evidence_for:
        - "C001: max_lib=0.7015 (LOWEST in L009), Barra_res=-0.0078, mono IMPROVES -0.7→-0.9"
        - "C002: max_lib=0.7393, mono PERFECT -0.7/-0.7, decay=1.27 (best)"
        - "All 5 candidates: NEGATIVE Barra residual (clean)"
        - "All Div candidates: lower redundancy (0.70-0.74) vs Mul candidates (0.78-1.0)"
        - "C005: self-normalization preserves IR (-0.547) but NOT redundancy (0.994)"

      evidence_against:
        - "C001 alpha_surv=0.275, C002 alpha_surv=0.208 (critically low)"
        - "Div normalization strips Barra_res to near-zero (C002: -0.0049)"
        - "C003/C005: near-duplicate of F005/F007 (max_lib=1.0/0.994)"
        - "C004: 20d PE — mono decays and decay<1.0 (same as batch_075)"
        - "style_r2=0.075-0.249 (all candidates have style contamination)"

      failure_boundary: |
        Div normalization reduces redundancy but over-strips alpha.
        Self-normalization (C005) preserves signal but not redundancy.
        20d windows fail for PE conditioning (confirmed across 2 batches).
        tur_rank conditioning with Mul (no Div) is near-duplicate of F007.
        The trade-off is clear: Div = low redundancy + low alpha | Mul = high redundancy + high alpha.

      open_questions:
        - "Is alpha_surv=0.21-0.28 acceptable for admission given best-in-class redundancy?"
        - "Could a softer decorrelate (e.g., Sub(Corr×PE, tur_rank_component)) preserve more alpha?"
        - "Does the Div normalization strip legitimate alpha or just style variance?"
        - "Is there a conditioning partner OTHER than PE/tur that preserves more alpha?"

      next_best_probes:
        - expr: "Sub(Mul(Corr($close,$amount,10),CsRank($pe_ratio)),Mul(CsRank($turnover_rate),0.1))"
          why: "Partial subtraction of tur_rank component — softer decorrelate than Div"
        - expr: "Mul(Corr($close,$amount,10),CsRank($pe_ratio),0.9)"
          why: "Scale down Corr×PE by 0.9 — tests if weaker signal has better redundancy"
        - expr: "Mul(Corr($close,$amount,10),CsRank($pb_ratio))"
          why: "PB rank conditioning instead of PE — different fundamental, same rank approach"

