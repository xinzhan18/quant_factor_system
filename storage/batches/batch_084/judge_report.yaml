    severity: medium
  discovery_flags: []
  logic_diagnostics:
    L010:
      thesis_update: 'L010 Python因子探索路径结果（9个因子，3个batch）：

        batch_082（str_1m主导）：regime-adaptive EWM、quintile spread、market residual

        batch_083（str_1m主导）：conditional CsRank、DVW return、rolling beta residual

        batch_084（mixed）：return percentile（str_1m）、market-regime momentum（str_1m+turnover）、quality-cov（turnover_20d）


        关键发现：C002（market-regime momentum）是L010 campaign首个正IC信号（IC=+0.039，IR=+0.311）。这证明market-level
        vol regime（全市场波动率）与stock-level vol regime（个股波动率）的效果完全不同。个股低波动→ momentum；市场高波动→
        risk-off（反转）。


        失败模式总结：个股级regime分类全部塌缩为str_1m（6/6）；金额/质量过滤对Cov的改善有限（仍被turnover_20d吸收）。唯一突破：market-level
        regime产生了真正的方向性信号。'
      evidence_for:
      - 'C002: IC=+0.039, IR=+0.311, ls_tstat_ho=+1.91 — FIRST positive IC in L010'
      - 'C001: alpha_surv=2.68 — highest in campaign, though IC weak'
      - 'C003: Barra_res=0.016 (clean), alpha_surv=0.572 (acceptable)'
      evidence_against:
      - 'All 9: str_1m or turnover_20d dominant style in 8/9 cases'
      - 'C001: decay=2.86 (severe overfitting), IC=-0.008 (weak) — alpha_surv is deceptive'
      - 'C002: style_r2=0.390, risk_bucket=poor — good stats but style contamination'
      - 'C003: mono_val=0.1 (near-zero ranking power)'
      failure_boundary: '不再用个股级volatility regime（已证伪6次）：个股vol percentile分类全部塌缩为str_1m。

        不再单独用金额分层作为质量门（已证伪）：不能去除turnover_20d污染。

        不再依赖alpha_surv作为唯一标准：C001证明高alpha_surv+弱IC+差decay是陷阱。

        需要组合过滤：market-level regime + explicit turnover/PE过滤。'
      open_questions:
      - Market-level regime + PE + turnover 三重过滤能否产生clean residual?
      - 为什么个股级regime塌缩但市场级regime产生正IC？
      - 正IC是否来自risk-off机制的short-side（市场高波动时做空高波动股票）？
      - 反转（str_1m）和动量（low-vol momentum）能否组合为中性策略？
      next_best_probes:
      - expr: 'Python: Market-regime momentum + PE quality gate + turnover filter'
        why: C002的market-level regime产生正IC，但被str_1m吸收。加上PE低 + turnover低的双重过滤，可能产生干净信号。Python才能表达三层条件过滤。
      - expr: 'Python: Positive momentum only in low-vol regime, no short side'
        why: C002的正向信号可能主要来自long端（低波动时做多）。去掉short side，只保留long momentum in low vol
          regime，可能避开str_1m吸收。
      factor_roles:
      - candidate_id: C002
        role: positive_ic_breakthrough
        summary: L010 campaign首个正IC因子（IC=+0.039），证明market-level regime机制有效。但 Barra_res=-0.014,
          style_r2=0.39, 需进一步去污染。
      - candidate_id: C001
        role: alpha_surv_trap
        summary: alpha_surv=2.68（最高）但IC=-0.008（极弱）+ decay=2.86（崩塌）。证明高alpha_surv不等于有效信号。
