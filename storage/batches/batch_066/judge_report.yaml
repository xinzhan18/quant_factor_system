  logic_diagnostics:
    L008:
      thesis_update: |
        rel_tur × PE conditioning VALIDATES the mechanism: dominant_style flips from
        turnover_20d to str_1m. But the validation signal is too weak economically.
        All candidates show severe mono_val→mono_ho sign flip (or collapse to zero).
        The critical insight: batch_039's success (alpha_surv=0.496) used rel-tur × amount,
        not pure rel-tur. The amount field provided essential signal diversification.
        Pure rel-tur × PE/close loses the amount dimension's orthogonalizing power.

      evidence_for:
        - "C001/C002/C003: Barra_residual=-0.044 to -0.048 (genuine alpha, not style-only)"
        - "C001: dominant_style=str_1m=0.097 (LOW) — PE conditioning successfully changed dominant style"
        - "C004/C005: TsAutoCorr(rel-tur) shows turnover_20d and ep_ratio dominance — confirms mechanism boundary"
        - "All candidates: expanding_window_pass=True — signal is not spurious in-sample"

      evidence_against:
        - "ALL 5 pass candidates: mono_val=-1.0 to -0.9 but mono_ho=+0.4 to 0.0 (SIGN FLIP)"
        - "Quintile spreads on holdout compress to 0.001-0.002/month — too weak to trade after costs"
        - "C004: Barra_residual=+0.003 (POSITIVE = completely absorbed by turnover_20d)"
        - "C005: Barra_residual=-0.006 (MARGINAL — 94% absorbed by ep_ratio)"
        - "C006: IC_val=+0.0014 NEAR ZERO — no signal even in-sample"

      failure_boundary: |
        TsAutoCorr(rel-tur) time-series variants (C004/C005) are confirmed style traps.
        Do NOT probe TsAutoCorr(rel-tur) at any window with any conditioning.
        Pure rel-tur × PE (C001/C002) shows mechanism is valid but economic magnitude is insufficient.
        The rel-tur encoding requires an additional orthogonalizing field (like amount from batch_039)
        to be tradeable. Pure rel-tur × PE is a necessary but not sufficient condition.

      open_questions:
        - "Why does rel-tur × amount (batch_039) succeed where rel-tur × PE (batch_066) fails?"
        - "Can rel-tur × amount × PE triple conditioning work?"
        - "Is 20d window too long for rel-tur encoding? Should try 5-10d?"
        - "Does str_1m dominance mean the signal is just short-term reversal in disguise?"

      next_best_probes:
        - expr: "Mul(Mul(Div(CsRank($turnover_rate), CsRank($volume)), CsRank($amount)), CsRank($pe_ratio))"
          why: "Triple conditioning: rel-tur × amount × PE. batch_039's success used amount as the third field. This combination has the best prior evidence (alpha_surv=0.496)."
        - expr: "Mul(Div(CsRank($turnover_rate), CsRank($volume)), CsRank($amount))"
          why: "rel-tur × amount without PE. Confirms batch_039's result is replicable with current data."
        - expr: "Mul(Div(CsRank($turnover_rate), CsRank($volume)), CsRank($pe_ratio)) with 5d window"
          why: "Shorter window (5d) for rel-tur × PE to avoid style absorption. Different from C001-C003 which all use cross-sectional ranking."

      factor_roles:
        - candidate_id: C001
          role: mechanism_validated_economic_weakness
          summary: "PE changes dominant_style successfully but quintile spread too weak. Sign flip on holdout."
        - candidate_id: C002
