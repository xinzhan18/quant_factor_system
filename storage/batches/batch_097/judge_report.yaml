      C001 (decorr-inside-Corr, max_lib=0.504) achieves structural differentiation from F017
      while maintaining alpha_surv=1.031. This is the first time a range-amount variant has
      broken below max_lib=0.70. The "pre-normalize amount argument" approach deserves further
      systematic exploration — may be a new family-level signal type.
    likely_mechanism: |
      External conditioning multiplies a correlation by a rank (two separate operations).
      Internal conditioning normalizes the correlation input directly, fundamentally changing
      what the correlation measures: "how correlated is range with momentum-adjusted amount"
      vs "correlation of range with amount, multiplied by relative-amount rank". These capture
      different aspects of institutional activity. The internal approach is more data-efficient
      (single computation) and may capture a different kind of amount-range relationship.
    style_repackaging_risk: low
    explainable_by_existing_logic: partial
    escalation_status: watch
    first_seen_batch: batch_097

logic_diagnostics:
  L013:
    thesis_update: |
      Two signal structures now confirmed for L013:
      1. External conditioning (F017 anchor): Corr(range,amount,5) × CsRank(softdecorr-amount)
         → max_lib=0.85-0.99 within family (all variants are near-duplicates of F017)
      2. Internal conditioning (new): Corr(range, normalized-amount, 5)
         → max_lib=0.504 vs F017 (structurally distinct!)

      The internal structure shows excellent Barra orthogonality (alpha_surv=1.031) but
      weak IC (ICIR_ho=-0.160). This mirrors the known internal-normalization family pattern
      but with lower max_lib — it's a genuinely different calculation, not just parameter tuning.

      The 3d window failure (mono_ho=-0.1) establishes 5d as the minimum viable window.

      Current bottleneck: the internal-conditioning structure needs IC amplification.
      The question is: can a stronger normalization (higher coefficient? different proxy?
      compositing with external?) reach ICIR_ho > -0.25 while keeping max_lib < 0.6?

    evidence_for:
      - "C001 max_lib=0.504 — first time any L013 variant breaks below 0.70 vs F017"
      - "C001 alpha_surv=1.031 — exceptional Barra orthogonality confirms clean mechanism"
      - "F017 (5d×40d, 0.3 coeff) remains optimal external conditioning anchor"
      - "Decay>1 pattern holds across all F017-family variants"

    evidence_against:
      - "C001 ICIR_ho=-0.160 — too weak for admission (F017 is -0.322)"
      - "C002 (3d window) mono_ho=-0.1 — fatal collapse, confirms 5d minimum"
      - "All external conditioning variants max_lib>0.85 — subspace saturated"
      - "Internal structure so far produces alpha_surv>>1 but too-weak IC"

    failure_boundary: |
      DO NOT retry:
      - 3d or shorter correlation windows (fatal mono_ho collapse confirmed)
      - Coefficient tuning for 5d×40d external conditioning (exhausted in batch_096)
      - 7d×30d (mono_ho degradation confirmed in batch_096)
      - Additional CsRank conditioning variants (all within soft-decorr subspace)

      The external conditioning subspace is saturated. All further external variants
      will show max_lib>0.85 vs F017. Only the "internal conditioning" axis offers
      structural diversification. Next focus: strengthen internal-conditioning IC.

    open_questions:
      - "Can higher coefficient (0.5, 0.7) in decorr-inside-Corr improve ICIR_ho while maintaining max_lib<0.6?"
      - "Can a different str_1m proxy (5d/22d MA deviation instead of Ref close) strengthen the internal-decorr signal?"
      - "Can compositing external (F017) + internal (C001-type) produce a portfolio signal with max_lib<0.60 AND ICIR_ho>-0.25?"
      - "Is the alpha_surv>1.0 in internal-decorr variants exploitable — does the signal genuinely amplify after style removal?"

    next_best_probes:
      - expr: "Corr(Div(Sub($high,$low),$close),Sub(Div($amount,Mean($amount,40)),Mul(Div($close,Ref($close,22)),0.5)),5)"
        why: "Higher coefficient (0.5 vs 0.3) in internal decorr. More aggressive str_1m removal may strengthen the residual signal and push ICIR_ho toward -0.25."
      - expr: "Corr(Div(Sub($high,$low),$close),Sub(Div($amount,Mean($amount,40)),Mul(Div($close,Ref($close,22)),0.7)),5)"
        why: "Even higher coefficient (0.7). Test if there's a threshold where internal-decorr IC strengthens."
      - expr: "Corr(Div(Sub($high,$low),$close),Sub(Div($amount,Mean($amount,40)),Mul(Sub(Div($close,Mean($close,5)),Div($close,Mean($close,22))),0.5)),5)"
        why: "Replace Ref-close proxy with 5d/22d MA deviation proxy. Different str_1m characterization may produce different signal quality."
      - expr: "Mul(Corr(Div(Sub($high,$low),$close),$amount,5),Sub(CsRank(Div($amount,Mean($amount,40))),Mul(CsRank(Sub(Div($close,Mean($close,5)),Div($close,Mean($close,22)))),0.3)))"
        why: "External conditioning but with 5d/22d MA deviation as str_1m proxy. Different proxy for external conditioning family — may produce a variant distinct enough from F017."

  L012:
    thesis_update: |
      Window scan (batch_097) combined with all prior testing (batch_089) confirms:
      TsAutoCorr($amount,N) at all windows [5d, 10d, 20d, 40d] produces positive
      barra_res_icir or risk=poor. The mechanism is fundamentally style-contaminated at
      DSL level.

      Key pattern: barra_res_icir becomes LESS negative (more positive) as window shortens
      (40d: +0.087, 5d: +0.124). The shorter the TsAutoCorr window, the MORE the signal
      is dominated by style factors (likely str_1m for short windows, mom_12_1 for longer).

      DSL conditioning attempts (PE multiplier, soft-decorr turnover subtraction) all failed
      in batch_089. Window scan in batch_097 confirms window tuning is equally ineffective.

    evidence_for:
      - "C004 (40d): ICIR_ho=-0.319, mono_ho=-0.9 — good holdout IC structure exists"
      - "C004 val_ho_decay=1.579 — signal holds up on holdout (not validation artifact)"
      - "There IS a real signal in 40d TsAutoCorr — just deeply style-contaminated"

    evidence_against:
      - "ALL windows [5d,10d,20d,40d]: positive barra_res_icir or risk=poor"
      - "C003 (5d): ICIRval=-0.056 near-zero, wrong direction mono_val=+0.3"
      - "5d and 40d: barra_res_icir positive (signal IS style, not alpha)"
      - "DSL conditioning (PE, soft-decorr) failed in batch_089"
      - "Window scan now exhausted — no window escape available at DSL level"

    failure_boundary: |
      DO NOT probe further TsAutoCorr window variants (5d, 10d, 20d, 40d all exhausted).
      DO NOT attempt PE conditioning (batch_089 fatal: ep_ratio dominant).
      DO NOT attempt soft-decorr turnover subtraction (batch_089: wrong direction barra_res).
      DSL-level approach is confirmed exhausted for L012.
      Only viable path: Python-level factor residualization against Barra style exposures.
      If that's not available, L012 should remain parked.

    open_questions:
      - "Can Python-level style residualization rescue the 40d TsAutoCorr signal?"
      - "Is the contamination from turnover_20d (batch_089) or from a different style at 40d?"
      - "Is there a non-DSL conditioning approach (conditional IC regime model) for TsAutoCorr?"

    next_best_probes:
      - expr: "Python: Sub(TsAutoCorr($amount,40), BetaFit(TsAutoCorr($amount,40), [turnover_20d_barra, str_1m_barra]))"
        why: "Python-level multi-style residualization. If 40d TsAutoCorr is purely style exposure, residual will be noise. If there's alpha, this reveals it."
