judge_report:
  batch_id: batch_102
  judged_at: '2026-04-10T05:45:00+00:00'
  logic_ids_in_batch:
    - L015

  batch_summary:
    total_candidates: 6
    admitted_count: 2
    reserved_count: 3
    rejected_count: 1
    new_factor_ids:
      - F018
      - F019
    key_finding: >
      Batch_102 resolves the L015 conditioner style question. PB conditioning (C001)
      achieves style_r2=0.100 (acceptable), down from 0.257 with PE conditioning.
      PS conditioning in pure revenue signal (C005) achieves style_r2=0.049 (cleanest
      in entire L015 series). Two admits: F018 = EPS abs change x low PB,
      F019 = Revenue change x low PS. Both are barra-clean value catalysts.

  candidate_verdicts:
    - candidate_id: C001
      verdict: admit
      factor_id: F018
      reason_codes:
        - mechanism_aligned
        - risk_model_acceptable
        - feasibility_ok
        - statistical_strength_sufficient
      detail: >
        ICIRval=0.338, mono_val=1.0, expanding_window_pass=True, split_stability=good.
        Risk=acceptable: style_r2=0.100, alpha_surv=0.691, crowd=low. barra_res_icir=+0.251
        confirms mechanism survives Barra removal. Holdout decay=0.819 (<1) confirms
        out-of-sample durability. PB conditioning reduces ep_ratio style loading vs
        PE conditioning (batch_101 C001: style_r2=0.257 → now 0.100).
      admission_payload:
        factor_id: F018
        candidate_id: C001_102
        name: eps_abs_change_60d_x_low_pb
        expression: 'Mul(CsRank(Sub(Div($close,$pe_ratio),Div(Ref($close,60),Ref($pe_ratio,60)))),CsRank(Mul($pb_ratio,-1)))'
        direction: long
        batch_id: batch_102
        logic_id: L015
        route_id: R001
        route_type: mutate
        family_id: PF_fundamental_price_divergence
        experiment_lineage_tag: ELT_L015_mutate_pb_ps_conditioning_v1
        rationale: >
          Absolute EPS change 60d conditioned on low PB. EPS_today - EPS_60d_ago (using
          close/pe_ratio as proxy) captures fundamental earnings improvement in absolute
          terms. Low PB conditioning selects stocks cheap on book assets. PB is less correlated
          with ep_ratio Barra factor than PE, reducing style contamination. This is the
          primary value catalyst admission: cheap assets + improving earnings = re-rating potential.
        ic_mean_train: 0.041253
        ic_mean_validation: 0.046075
        ic_ir_train: 0.453154
        ic_ir_validation: 0.338022
        monotonicity_validation: 1.0
        ls_tstat: 3.8936
        alpha_survival_ratio: 0.6906
        barra_residual_ic: 0.031819
        max_lib_corr: 0.0759
        holdout_ic_mean: 0.037716
        holdout_ic_ir: 0.242097
        holdout_decay_ratio: 0.8186

    - candidate_id: C002
      verdict: reserve
      reason_codes:
        - moderate_style_exposure
        - feasibility_ok
        - mechanism_aligned
      detail: >
        ICIRval=0.366 (highest in batch), mono_val=1.0, risk=borderline. Borderline
        driven by alpha_surv=0.503 (below 0.6 threshold): dom=book_to_price, PB conditioning
        creates direct overlap. style_r2=0.066 is actually clean, but low alpha_surv
        means Barra style is anti-correlated with the factor. mono_ho=0.5 borderline.
        Reserve: mechanism works but alpha_surv needs monitoring. Potential upgrade if
        holdout confirms stability.

    - candidate_id: C003
      verdict: reserve
      reason_codes:
        - moderate_style_exposure
        - mechanism_aligned
        - feasibility_ok
      detail: >
        ICIRval=0.255, mono_val=0.9, ICIRho=0.201, decay=0.967 (stable). barra_res_icir=+0.276
        and style_r2=0.105. Risk=borderline because crowd=medium. EPS abs × low PS is
        structurally clean (PS most orthogonal to Barra value factors), but medium crowding
        risk elevates bucket. Novel expression: max_lib_corr=0.052 (most novel in R001).
        Reserve: if crowding eases in future windows, potential upgrade.

    - candidate_id: C004
      verdict: reserve
      reason_codes:
        - moderate_style_exposure
        - mechanism_aligned
        - feasibility_ok
      detail: >
        ICIRval=0.352, mono_val=1.0, ICIRho=0.292 (HIGHEST in batch). Probe ICIR=0.393
        was the strongest in entire L015 series. Risk=borderline due to crowd=medium.
        Triple-product structure (EPS × Revenue × low PB) concentrates into a very specific
        universe, creating crowding risk even though style_r2=0.105 is acceptable.
        alpha_surv=0.807 is good. Reserve: most promising reserve candidate — if crowding
        risk drops or universe expands, C004 is the next admission target.

    - candidate_id: C005
      verdict: admit
      factor_id: F019
      reason_codes:
        - mechanism_aligned
        - risk_model_acceptable
        - feasibility_ok
        - statistical_strength_sufficient
      detail: >
        ICIRval=0.266, mono_val=1.0, expanding_window_pass=True, split_stability=good.
        Risk=acceptable: style_r2=0.049 (CLEANEST in entire L015 series), alpha_surv=0.662,
        crowd=low. barra_res_icir=+0.212 confirms barra-clean alpha. PS conditioning for
        both change metric and valuation anchor — pure self-consistent revenue catalyst.
        Decay=0.911 (<1) confirms holdout durability. This is the most style-orthogonal
        signal in the fundamental_price_divergence family.
      admission_payload:
        factor_id: F019
        candidate_id: C005_102
        name: revenue_change_60d_x_low_ps
        expression: 'Mul(CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,60),Ref($ps_ratio,60)))),CsRank(Mul($ps_ratio,-1)))'
        direction: long
        batch_id: batch_102
        logic_id: L015
        route_id: R002
        route_type: mutate
        family_id: PF_fundamental_price_divergence
        experiment_lineage_tag: ELT_L015_mutate_multimetric_catalyst_v1
        rationale: >
          Revenue change 60d (PS-based) conditioned on low PS. Revenue_today/Revenue_60d_ago
          captures improvement in revenue efficiency. CsRank(-ps_ratio) selects stocks cheapest
          relative to their revenue base. Pure single-metric PS catalyst: "cheap revenue stock
          with growing revenue." PS is orthogonal to all standard Barra value factors (ep_ratio
          is earnings-based, book_to_price is asset-based; PS is revenue-based). Achieves
          style_r2=0.049 — cleanest Barra profile in the entire L015 series.
        ic_mean_train: 0.030488
        ic_mean_validation: 0.030567
        ic_ir_train: 0.382577
        ic_ir_validation: 0.265975
        monotonicity_validation: 1.0
        ls_tstat: 3.3763
        alpha_survival_ratio: 0.662
        barra_residual_ic: 0.020234
        max_lib_corr: 0.056
        holdout_ic_mean: 0.027839
        holdout_ic_ir: 0.212942
        holdout_decay_ratio: 0.9107

    - candidate_id: C006
      verdict: reject
      reason_codes:
        - weak_validation_effect
      detail: >
        ICIRval=0.083 (WEAK, search_adjusted_strength_bucket=weak), ls_tstat=1.748
        (barely above 1.65 threshold). holdout_decay_ratio=2.228 means holdout (2024+)
        ICIR is 2.2x validation ICIR — anomalous reversal suggesting validation period
        was unusually weak. No reliable inference can be drawn from a signal that performs
        poorly in validation but better in holdout. The dual-metric EPS×Revenue base
        (without conditioning) lacks the amplification that conditioning provides, as
        probe ICIR=0.231 (same as single-metric base). Mechanism control confirmed:
        value conditioning IS necessary for acceptable IC.

  route_verdicts:
    - route_id: R001
      experiment_lineage_tag: ELT_L015_mutate_pb_ps_conditioning_v1
      verdict: continue
      reason: >
        C001 admitted (F018). C002 and C003 reserved with positive mechanisms.
        PB conditioning (style_r2=0.100) proved cleanest vs PE conditioning (0.257).
        PS conditioning (C003, style_r2=0.105) also viable but crowding limits admission.
        Next: explore reducing crowding in C003/C004 variants.

    - route_id: R002
      experiment_lineage_tag: ELT_L015_mutate_multimetric_catalyst_v1
      verdict: continue
      reason: >
        C005 admitted (F019). C004 reserved as highest-potential candidate in batch.
        C006 rejected confirms conditioning is essential (no-conditioning baseline = weak).
        Multi-metric direction (C004) needs crowding resolution before admission.
        Revenue×PS self-consistent mechanism (C005) is the cleanest alpha in this family.

  logic_recommendations:
    L015:
      recommended_status: productive
      reason: >
        First admits from L015: F018 (EPS abs × low PB) and F019 (Revenue × low PS).
        Cross-batch series (batch_099 → batch_102) systematically resolved the barra sign-flip
        root cause and demonstrated two viable value catalyst mechanisms. Mechanism is confirmed:
        pure fundamental ratio change + orthogonal valuation conditioning = barra-clean alpha.
        L015 should be marked productive to enable continued yield extraction from the
        remaining reserve candidates and multi-metric direction (C004).

  new_lessons:
    - id: NM-L015-pb-conditioning-reduces-ep-ratio
      type: NM
      content: >
        PB conditioning (CsRank(-pb_ratio)) on EPS abs change reduces ep_ratio style loading
        from 0.257 (PE conditioned, batch_101) to 0.100 (PB conditioned, batch_102).
        The key mechanism: PB = price/book, which uses book equity (balance sheet) vs
        PE = price/earnings (income statement). Different accounting line = lower cross-correlation
        with ep_ratio Barra factor. PB conditioning is the preferred conditioner when
        EP-based conditioners add excessive ep_ratio style.
      applicable_families: [PF_fundamental_price_divergence]
      evidence_batch: batch_102

    - id: NM-L015-ps-conditioning-lowest-barra-loading
      type: NM
      content: >
        PS conditioning achieves style_r2=0.049 — the lowest in entire L015 series.
        PS (price/sales) uses revenue (top of income statement) which is structurally
        uncorrelated with all standard Barra value factors (ep_ratio=earnings yield,
        book_to_price=asset ratio, mom=price momentum). PS-conditioned signals are
        the most orthogonal to Barra style framework. Preferred when maximum Barra
        cleanness is required.
      applicable_families: [PF_fundamental_price_divergence]
      evidence_batch: batch_102

    - id: NM-L015-dual-metric-amplifies-but-adds-crowding
      type: NM
      content: >
        Triple-product (EPS change × Revenue change × low PB) amplifies probe ICIR from
        0.332 to 0.393 (+18%) but adds medium crowding risk. The triple constraint concentrates
        signal into a small universe of stocks meeting ALL three criteria simultaneously.
        While ICIRval=0.352 and barra_res_icir=0.322 are strong, crowding risk prevents
        admission. Multi-metric signals require careful crowding assessment before use.
      applicable_families: [PF_fundamental_price_divergence]
      evidence_batch: batch_102

  discovery_flags:
    - anomaly_type: fundamental_catalyst_ps_cleanness
      batch_id: batch_102
      description: >
        PS-conditioned signals achieve systematically lower Barra style_r2 than PE or PB
        conditioned variants. C005 style_r2=0.049 vs C001 style_r2=0.100 vs batch_101
        C001 style_r2=0.257 (PE). The PS orthogonality pattern appears robust across
        both change metrics (EPS-based C003 also shows style_r2=0.105, lower than PE variants).
      escalation_status: watch
      likely_mechanism: >
        Revenue (PS denominator) is not a standard Barra value factor input. Barra models
        typically use earnings (ep_ratio), book value (book_to_price), dividends (div_yield),
        and various momentum measures. Revenue appears in neither the value nor the quality
        cluster of standard Barra factors, explaining the orthogonality.
      style_repackaging_risk: low

  logic_diagnostics:
    L015:
      thesis_update: |
        L015 mechanism is confirmed and production-quality: fundamental improvement (EPS or Revenue
        via ratio-change proxy) conditioned on cheap valuation (low PB or low PS) produces
        barra-clean positive alpha in CSI1000. The sign-flip problem (batches 099-100) was caused
        entirely by price component contamination in the expression. Once the pure fundamental
        ratio change was isolated (batch_100: barra_res_icir=+0.394), conditioning on orthogonal
        value metrics amplifies the signal while keeping style loading low.

        Key hierarchy of conditioners by Barra cleanliness:
        1. PS conditioning: style_r2=0.049 (cleanest)
        2. PB conditioning: style_r2=0.100 (acceptable)
        3. PE conditioning: style_r2=0.190-0.287 (borderline/too high)

        Both admitted factors use this clean architecture. The remaining reserve candidates
        (C002: Revenue×PB, C003: EPS×PS) are borderline due to alpha_surv or crowding,
        not due to mechanism failure.

      evidence_for:
        - "C001: ICIRval=0.338, mono_val=1.0, barra_res_icir=+0.251, style_r2=0.100 (acceptable)"
        - "C005: ICIRval=0.266, mono_val=1.0, barra_res_icir=+0.212, style_r2=0.049 (cleanest)"
        - "Holdout decay <1.0 for both admits: C001=0.819, C005=0.911 — signals strengthen post-validation"
        - "C004 (triple product): ICIRval=0.352, barra_res_icir=+0.322 confirms multi-metric amplification"
        - "All 6 batch_102 candidates maintain positive barra_res_icir — mechanism structurally clean"

      evidence_against:
        - "C002: alpha_surv=0.503 below threshold despite style_r2=0.066 — PB conditioning creates book_to_price anti-correlation"
        - "C004: crowding_risk=medium limits admission despite strong ICIRval and holdout metrics"
        - "C003: ep_ratio style exposure 0.222 is elevated; PS conditioner doesn't fully escape ep_ratio in EPS-based change"
        - "mono_ho in 0.5-0.8 range — none achieve perfect 1.0 holdout monotonicity"
        - "ls_tstat on holdout is weak (0.39-1.16) — long-short profitability not confirmed in holdout"

      failure_boundary: |
        PE conditioning is permanently excluded: adds ep_ratio style regardless of change metric.
        Sub(CsRank(fundamental), CsRank(price)) form is excluded: price term adds str_1m.
        Book value change (PB-based Sub) in batch_101 showed alpha_surv=0.212 (dominated by
        book_to_price style) — PB as CHANGE metric fails, only PB as CONDITIONER works.
        Soft-decorrelation approach (sub turnover_rate) from batch_099 failed to help L015.
        Direct PE independence filter (batch_100 R002) adds str_1m — completely excluded.

      open_questions:
        - "Can C004 (triple product) be reformulated to reduce crowding risk? E.g., use 80d lookback instead of 60d to spread the universe"
        - "Does C002 (Revenue × low PB) have higher alpha_surv in specific sub-periods? The 0.503 overall may mask temporal variation"
        - "PS conditioning reduces ep_ratio style in revenue signals (C005: dom=str_1m, style_r2=0.049). What drives the str_1m residual dominance in C005 at such low style_r2?"
        - "Are F018 and F019 sufficiently decorrelated for portfolio combination? max_lib_corr between C001 and C005 was not measured directly"

      next_best_probes:
        - expr: "Mul(Mul(CsRank(Sub(Div($close,$pe_ratio),Div(Ref($close,80),Ref($pe_ratio,80)))),CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,80),Ref($ps_ratio,80))))),CsRank(Mul($pb_ratio,-1)))"
          why: "C004 triple product with 80d lookback instead of 60d — longer window spreads universe selection and may reduce crowding risk"
        - expr: "Mul(CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,120),Ref($ps_ratio,120)))),CsRank(Mul($ps_ratio,-1)))"
          why: "Revenue change × low PS at 120d — tests whether PS catalyst has better half-life with longer lookback (F019 at 60d, F020 candidate at 120d)"
        - expr: "Mul(CsRank(Sub(Div($close,$pe_ratio),Div(Ref($close,60),Ref($pe_ratio,60)))),CsRank(Mul($ps_ratio,-1)))"
          why: "C003 EPS abs × low PS — re-examine crowding risk; if crowding reduces in a future window, this is the third potential admit"

      factor_roles:
        - factor_id: F018
          role: core_positive_anchor
          summary: "EPS abs change 60d × low PB. Primary earnings catalyst admit. style_r2=0.100, risk=acceptable."
        - factor_id: F019
          role: core_positive_anchor
          summary: "Revenue change 60d × low PS. Cleanest Barra profile in family. style_r2=0.049, risk=acceptable."
        - candidate_id: C004_102
          role: high_potential_reserve
          summary: "Triple product (EPS×Revenue×low PB). Highest ICIRval of reserves (0.352) and barra_res_icir=0.322. Blocked by crowding."
        - candidate_id: C002_102
          role: borderline_reserve
          summary: "Revenue×low PB. Strong ICIRval=0.366 but alpha_surv=0.503 borderline. Book_to_price anti-correlation."
        - candidate_id: C003_102
          role: borderline_reserve
          summary: "EPS abs × low PS. Novel (max_lib=0.052), barra_res=+0.276, but ep_ratio exposure still present."
