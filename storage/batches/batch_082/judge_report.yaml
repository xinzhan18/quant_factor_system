  logic_diagnostics:
    L010:
      thesis_update: 'L010 hypothesis: "Python因子能表达DSL无法实现的复杂机制：regime-adaptive参数变化、cross-sectional
        regression residuals、conditional logic。"

        本批验证结果：regime-adaptive momentum（高vol用快decay，低vol用慢decay）的IC=-0.026（validation）、-0.032（holdout），统计强度够，但
        Barra_residual_IC=-0.0025、alpha_surv=0.095，说明信号被 str_1m 吸收，不是独立alpha。

        Cross-sectional residual（去除market component） Barra_residual_IC=0.003、style_r2=0.434、str_1m=0.719（极高），同样完全被风格吸收。

        Quintile spread 机制：validation monotonicity=0.0（完全无单调性），机制根本不成立。

        结论：Python技术路径可行（管道跑通），但这三个具体实现都塌缩为风格信号，不是真正的机制创新。'
      evidence_for:
      - 'C001: IC_val=-0.026, IR_val=-0.221, expanding_window_pass=True, 3个support
        window sign consistent'
      - 'C003: IC_val=-0.034, IR_val=-0.287, 统计强度强于C001'
      - 'All 3: pipeline execution successful — Python factor infrastructure works'
      evidence_against:
      - 'C001: Barra_residual_IC=-0.0025 (≈0), alpha_surv=0.095 (临界失败), str_1m=0.563
        (dominant)'
      - 'C003: Barra_residual_IC=0.003 (≈0), style_r2=0.434, str_1m=0.719 (extremely
        high)'
      - 'C002: mono_val=0.0, mono_ho=0.0 — 完全没有单调性，机制不成立'
      - 'All: ls_tstat_ho<|1| (C001=-0.95, C003=-0.61)，没有净alpha'
      failure_boundary: '不再用EWM+regime classification组合做动量/反转——已被证明塌缩为str_1m。

        不再用quintile spread范式——本批证明无单调性。

        Cross-sectional residual（等权market return假设）过于简化，不产生独立alpha。

        这些边界是机制层面的，不只是参数调优问题。'
      open_questions:
      - 是否有其他Python机制能真正产生DSL无法表达的独立alpha？
      - Regime classification用volatility percentile是否是最优方式？
      - Cross-sectional residual能否用beta-adjusted（而非等权）产生真正残差？
      - Python的真正优势是否在于多步条件逻辑而非单步变换？
      next_best_probes:
      - expr: 'Conditional CsRank: If(vol_pct>0.6, Rank(ret_fast), If(vol_pct<0.4,
          Rank(ret_slow), Rank(ret)))'
        why: 纯粹的if-else条件逻辑，DSL完全无法表达（需要嵌套If+跨截面Rank）。用rank而非EWM避免str_1m吸收。
      - expr: 'Cross-sectional dollar volume weighted return (DVW return): ret * amount
          / mean(amount over universe)'
        why: 金额加权收益是smart money代理，DSL无法直接表达金额加权操作。这是机制层面的创新，不只是参数变化。
      - expr: Residual of ret on market_excess using rolling beta (not equal-weighted)
        why: 当前cross_sectional_residual用等权market return（beta=1简化假设）。Rolling beta调整可能产生真正残差——但这需要Python，DSL无法做滚动回归。
      factor_roles: []
