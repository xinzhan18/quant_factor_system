      description: |
        PB conditioning (C001) produces dominant_style=log_circ_cap=0.107. market_cap conditioning
        (C003) produces log_circ_cap=0.101. Both are essentially size factors with extra steps.
        They are not orthogonalizing rel-tur — they are adding size exposure to it.
        PB and market_cap are not viable conditioning partners for rel-tur encoding.
      style_repackaging_risk: high
      implication: "Do not probe rel-tur × size conditioning (PB, market_cap, log_circ_cap) — confirmed size proxies."

