        This is different from traditional sign flip: the factor ranks stocks correctly but
        cannot differentiate Q1 from Q5 economically.
        PB conditioning (C001) and market_cap conditioning (C003) are both in size/style space.
        monetary_flow (C002) is the most interesting but still shows complete quintuple compression.
