      experiment_lineage_tag: ELT_L008_genesis_rel_tur_pb_monetary_flow_v1
      verdict: pause
      reason: |
        All 3 candidates show the SAME FAILURE MODE as batch_067: perfect validation
        monotonicity (-1.0) collapsing to near-zero holdout spread. Critically, ALL 5 quintiles
        are POSITIVE on holdout for every candidate. The ranking direction is preserved but
