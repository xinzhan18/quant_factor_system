      style_repackaging_risk: medium
      implication: "The rel-tur × cross-sectional conditioning paradigm produces genuine signal but zero economic spread."

    - lesson_id: NM_L008_pb_market_cap_are_size_proxies
      classification: NM
      batch_ids:
