        factor is a LONG-ONLY signal, not a spread signal. For A-shares where shorting is
        not feasible, a long-only signal with all quintiles positive means the factor cannot
        generate a long-short spread.
        ALL 5 holdout quintiles are positive (q1=0.0039 to q5=0.0049). Spread=0.0010/month.
        alpha_surv=0.6289 (best survival ratio in L008 history), Barra_res=-0.0413 (clean).
        dominant_style=log_circ_cap=0.107 — PB conditioning introduces size exposure.
        PB is not orthogonalizing — it's just another form of value conditioning.
        The sign flip from negative (validation) to positive (holdout) for ls_tstat means
        the direction of the trading signal reversed.
      research_result_metrics:
        ic_mean_validation: -0.0657
        ic_ir_validation: -0.3280
        ic_ir_holdout: -0.1735
        monotonicity_validation: -1.0
