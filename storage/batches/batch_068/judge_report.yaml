  logic_recommendations:
    L008:
      logic_id: L008
      recommended_status: active
      reason: |
        L008 rel_tur encoding family has now failed across 4 batches (066-068) with 12 candidates.
        Key finding: The factor mechanism is VALID (Barra residuals are consistently clean,
        expanding_window_pass=True, dominant_style changes from turnover_20d) but the economic
        magnitude is ALWAYS insufficient.
        ALL quintiles are positive on holdout — this is the critical pattern.
        batch_039 remains the only success (alpha_surv=0.496) and we cannot explain why.
        The rel_tur × amount signal space appears to have a fundamental ceiling:
        the cross-sectional ranking preserves direction but cannot economically differentiate.
        Recommendation: L008 should pivot away from cross-sectional multiplicative conditioning
        and explore: (1) time-series measures of rel-tur persistence (but TsAutoCorr already
        failed in batch_066), (2) sector-relative rel-tur, (3) event-driven rel-tur spikes.
        The family is not exhausted but the current paradigm is.
      direction_quota: 3
      candidate_quota: 6

  logic_diagnostics:
    L008:
      thesis_update: |
        rel_tur encoding × conditioning consistently VALIDATES mechanism but NEVER produces
        economic alpha. 12 candidates tested across 4 batches. The critical pattern: ALL quintiles
        are positive on holdout. This is not a sign flip (direction is preserved) — it's that
        the factor has near-zero discriminatory power: Q1 and Q5 earn almost identical returns.
        batch_039 (alpha_surv=0.496) remains the ONLY success and we cannot replicate it.

      evidence_for:
        - "C002: best validation IC_IR=-0.561, ls_tstat=-7.0 (strongest in L008 history)"
        - "C002: decay_ratio=0.6952 best in batch, better than batch_067's best 0.689"
        - "All candidates: Barra_residual clean (-0.036 to -0.045)"
        - "All candidates: expanding_window_pass=True — signal not spurious in-sample"
        - "All candidates: dominant_style NOT turnover_20d — conditioning successfully changes style"

      evidence_against:
        - "ALL 3 candidates: ALL 5 holdout quintiles POSITIVE — complete ranking compression"
        - "C001: ls_tstat_holdout=+0.65 (SIGN FLIP from negative to positive)"
        - "C002: ls_tstat_holdout=-0.43 (not statistically significant)"
        - "C003: mono_ho=0.0 (complete collapse)"
        - "The spread compresses to 0.001/month — economically meaningless"
        - "PB and market_cap both introduce size style — wrong conditioning partner"

      failure_boundary: |
        PB conditioning (C001) and market_cap conditioning (C003) are confirmed as size proxies.
        Do not probe rel_tur × size variants further. monetary_flow (C002) is more interesting
        but the 4-field multiplication amplifies redundancy rather than adding orthogonal info.
        The rel_tur × cross-sectional multiplicative conditioning paradigm is at its ceiling.
        batch_039's success remains unexplained — the same expression pattern fails now.

      open_questions:
        - "Why does batch_039 succeed (alpha_surv=0.496) while identical patterns fail now?"
        - "Is the rel-tur signal time-series rather than cross-sectional?"
        - "Could sector-relative rel-tur break the quintuple compression?"
        - "Is there a rebalancing frequency effect? batch_039 may have used different holding period"

      next_best_probes:
        - expr: "Div(CsRank($turnover_rate), CsRank($volume))"
          why: "Pure rel-tur without any conditioning partner. Confirms if the base signal itself has any economic value before adding conditioning noise."
        - expr: "Mul(Div(CsRank($turnover_rate), CsRank($volume)), Div(CsRank($volume), CsRank($amount)))"
          why: "rel-tur × (volume/amount) = tur_rank × inverse_money_flow. Tests if the inverse monetary dimension provides orthogonalization."
        - expr: "Sub(Div(CsRank($turnover_rate), CsRank($volume)), Rank($close))"
          why: "rel-tur minus price rank. Tests if price-level anchor removes style contamination differently than fundamental ratios."

      factor_roles:
        - candidate_id: C001
          role: pb_conditioning_size_proxy
          summary: "PB introduces size exposure (log_circ_cap=0.107). Wrong conditioning partner. Sign flip confirmed."
        - candidate_id: C002
          role: monetary_flow_quadruple_multiply
          summary: "Strongest validation metrics but 4-field multiplication amplifies redundancy. Turnover regime re-emerges."
        - candidate_id: C003
          role: market_cap_size_proxy
          summary: "Complete mono collapse. Market cap is pure size proxy, not orthogonalizing field."

