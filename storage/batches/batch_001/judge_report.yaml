candidate_verdicts:
  - candidate_id: C001
    name: lower_shadow_ratio_20d_x_turnover_vol_20d
    logic_id: L001
    verdict: reserve
    reason_codes:
      - style_dominance_detected
      - mechanism_aligned
      - feasibility_ok
    detail: |
      Strong validation signal (ICIR=-0.583, Mono=-1.0) and decent holdout (ICIR=-0.347, Mono=-0.7).
      However, turnover_20d exposure=0.478, style R²=0.445 — nearly half the signal is explained by
      style factors. Alpha survival ratio=0.19 means only 19% survives Barra neutralization.
      Holdout LS Sharpe=-1.10 is moderate. Reserve for repair route to reduce turnover dependence.

  - candidate_id: C002
    name: lower_shadow_ratio_10d_x_turnover_vol_10d
    logic_id: L001
    verdict: reject
    reason_codes:
      - weak_validation_effect
      - style_dominance_detected
    detail: |
      Despite strong in-sample ICIR (-0.605/-0.581), holdout monotonicity collapses to 0.0.
      Holdout quintile returns: Q1-Q4 all similar (5.0-5.4%), only Q5 drops (2.8%).
      No monotonic sorting power OOS. Combined with poor risk profile (turnover 0.34, alpha_surv=0.13).
      Shorter window (10d) makes this more noise-prone than C001.

  - candidate_id: C003
    name: upper_shadow_ratio_20d_x_turnover_rank
    logic_id: L001
    verdict: reject
    reason_codes:
      - weak_validation_effect
      - style_dominance_detected
    detail: |
      Holdout LS Sharpe=-0.04 (near zero — signal is dead OOS). Holdout Mono=0.0.
      Highest turnover style exposure in batch (0.61), style crowding risk=HIGH.
      Val→Holdout decay=0.73. Upper shadow interaction with CsRank(turnover) is
      essentially a repackaged turnover factor.

  - candidate_id: C004
    name: cov_turnover_pe_60
    logic_id: L002
    verdict: reject
    reason_codes:
      - weak_validation_effect
    detail: |
      Severe holdout decay (ratio 0.45). Holdout ICIR=-0.126, Mono=0.0.
      Critically, alpha_survival_ratio=1.14 with Barra residual IC=+0.034 (positive!) —
      after removing style factors, the "alpha" flips direction. The raw negative IC
      is just the shadow of Barra risk factors, not independent alpha.
      Holdout LS: t=-0.44, Sharpe=-0.32 (economically insignificant).

  - candidate_id: C005
    name: cov_turnover_pe_120
    logic_id: L002
    verdict: reject
    reason_codes:
      - sign_flip_detected
      - weak_validation_effect
    detail: |
      Signal direction FLIPS in holdout: validation Mono=-0.6 → holdout Mono=+0.6.
      Holdout LS mean is POSITIVE (+0.000402) despite negative train/validation — sign inconsistency.
      Alpha_survival_ratio=1.51, Barra residual flips sign. Severe holdout decay (0.42).
      This is a disguised Barra risk factor with no stable independent alpha.

  - candidate_id: C006
    name: amount_autocorr_20
    logic_id: L003
    verdict: admit
    admitted_as: F001
    reason_codes:
      - mechanism_aligned
      - feasibility_ok
    detail: |
      EXCEPTIONAL candidate. Perfect holdout monotonicity (-1.0) with IMPROVING OOS performance
      (decay ratio 1.52). Holdout ICIR=-0.439 beats both train (-0.304) and validation (-0.304).
      Holdout LS: t-stat=-6.34 (highly significant), Sharpe=-4.56.
      Holdout quintile cascade: Q1(6.26%) > Q2(5.36%) > Q3(5.13%) > Q4(4.16%) > Q5(2.66%).
      Strong long-side alpha (Q1=6.26%), A-share compatible.
      Style R²=0.14 (86% unexplained by Barra), novel signal (max_lib_corr=0.0).
      Risk concern: alpha_survival=0.28 and turnover_20d exposure=0.30 — but residual
      alpha remains economically significant given the extreme holdout LS strength.

  - candidate_id: C007
    name: amount_autocorr_60
    logic_id: L003
    verdict: reserve
    reason_codes:
      - moderate_style_exposure
      - mechanism_aligned
      - feasibility_ok
    detail: |
      Decent holdout (Mono=-0.8, ICIR=-0.224, LS t=-1.83) with improving decay ratio (1.51).
      However, strictly inferior to C006 across all metrics. Validation ICIR drops to -0.174
