logic_diagnostics:
  L001:
    thesis_update: |
      Shadow signal survives ONLY with non-style liquidity conditioning (Amihud = amount/volume).
      Batch_002 shadow×vol (C002) had alpha_surv=0.093 (style trap). C001 shadow×Amihud
      achieves alpha_surv=0.377 — 4× improvement. This confirms the bottleneck: shadow must be
      conditioned on fundamental cost-of-trading, not price-dispersion proxies. Vol is a style
      index; Amihud is a microstructure cost measure.

    evidence_for:
      - "C001 alpha_surv=0.377 vs batch_002 C002 alpha_surv=0.093 — 4× improvement with Amihud conditioning"
      - "C001 Barra_residual_ICIR=-0.176 (borderline) — partial style absorption but acceptable for admit"
      - "C001 max_lib_corr=0.059 — near-orthogonal to library despite shadow microstructure"

    evidence_against:
      - "C001 holdout monotonicity=-0.3 — Q1≈Q2, signal concentrated in tail"
      - "C002 rejected with alpha_surv=0.079 — 5d shadow × vol is still a style trap"

    failure_boundary: |
      Shadow × vol/turnover/stddev variants all collapse (alpha_surv<0.10).
      Shadow at windows <20d amplifies style absorption. Do not retry shadow×[vol,turnover,range].
      Only shadow×Amihud variants are viable for L001.

    open_questions:
      - "Does longer shadow window (40d, 60d) + Amihud reduce style absorption further?"
      - "Is Amihud conditioning capturing cost-of-trading or amount's own autocorrelation?"
      - "Can shadow×Imbalance (buy/sell pressure) survive?"

    next_best_probes:
      - expr: "Mul(Mean(Div(Sub(Less($open,$close),$low),Sub($high,$low)),40),Div($amount,Mean($volume,40)))"
        why: "Test 40d shadow × 40d Amihud — longer window may reduce noise and improve monotonicity"
      - expr: "Div($amount,Mean($volume,20))"
        why: "Pure Amihud control — isolate whether shadow adds incremental value or is redundant"

  L002:
    thesis_update: |
      Cov(amt,tur,60) is absorbed by turnover_20d regime. Barra_residual_ICIR=0.178 is the
      highest of the batch — 7.8× worse than C001's -0.176. The Cov is not capturing
      intra-liquidity covariance; it is a complex way to proxy short-term turnover reversal.
      L002's fundamental covariance hypothesis is not confirmed.

    evidence_for:
      - "C005 val ICIR=-0.481 (very strong), train ICIR=-0.471 — high signal strength"
      - "C005 max_lib_corr=0.151 — orthogonal to existing factors"

    evidence_against:
      - "C005 Barra_residual_ICIR=0.178 (highest of batch) — 7.8× worse than admitted candidates"
      - "C005 alpha_surv=0.243 — 24% of IC survives to holdout, style dominates"
      - "style_r2=0.26, turnover_20d dominant — Cov is absorbed by style"
      - "L002 prior attempts: Cov(turnover,range)=kill, Corr(amount,pb)=kill"

    failure_boundary: |
      Any Cov/Corr between amount and turnover/turnover_rate will be absorbed by turnover_20d.
      Do not retry Cov variants involving turnover or turnover_rate without orthogonal conditioning.
      Need fundamentally different mechanism than pairwise Cov for L002.

    open_questions:
      - "Can Cov(amount,fundamental) survive Barra residual?"
      - "Is the problem the amount field itself or the Cov operator?"

    next_best_probes:
      - expr: "Cov($amount,$book_to_price,60)"
        why: "Test amount × fundamental rather than amount × turnover — if Barra residual improves, confirms turnover is the contaminating field"

  L003:
    thesis_update: |
      TsAutoCorr family is field-degenerate: amount, volume, and turnover at 20d/30d/40d windows
      all reproduce F001 (corr=0.46-0.62). The residual_survival of 0.38-0.53 means <53% of IC is
      independent of F001. No variant achieved genuine decorrelation. The TsAutoCorr mechanism
      works for amount specifically (F001 admitted), but volume and turnover at longer windows
      do not add independent information.

    evidence_for:
      - "C004 residual_survival=0.534 — 53% of IC survives F001 control (best of L003 variants)"
      - "C004 Barra_residual_ICIR=0.047 — Barra-neutral component marginally positive"

    evidence_against:
      - "C003 corr(F001)=0.618, residual_survival=0.382 — 62% of IC is F001's signal"
      - "C008 corr(F001)=0.455 — still significant overlap despite 40d window"
      - "All 3 variants (amount 30d, vol 40d, tur 40d) show similar pattern"
      - "L003 has 0 admits from batch_002 and batch_003 combined (1 admit is F001, different batch)"

    failure_boundary: |
      TsAutoCorr on volume or turnover at any window ≤40d does not decorrelate from F001.
      The TsAutoCorr mechanism is specific to amount field, not a general property of autocorrelated fields.
      Do not retry TsAutoCorr on volume or turnover. The family should pivot to amount-focused variants.

    open_questions:
      - "Does amount TsAutoCorr at 60d or 120d decorrelate from F001 at 20d?"
      - "Is the TsAutoCorr mechanism encoding amount's microstructure properties (smart money, order flow)?"

    next_best_probes:
      - expr: "TsAutoCorr($amount,60)"
        why: "60d window on amount — may decorrelate further from F001's 20d if the mechanism is multi-scale"
      - expr: "Mul(TsAutoCorr($amount,20),TsStd($amount,20))"
        why: "Strength × Volatility combination — if amount TsAutoCorr is smart money signal, amount vol should condition it"

  L004:
    thesis_update: |
      量价背离 conditioned on turnover rank is a genuine orthogonal signal. C006 proves the
      mechanism: when controlling for turnover rank, price-volume correlation captures true
      divergence, not style. ICIR=-0.427 holdout with clean Barra_residual_ICIR=-0.288.
      C007 (change rate) is contaminated by short-term reversal, not pv divergence change.

    evidence_for:
      - "C006 ICIR=-0.530 probe → -0.523 val → -0.427 holdout (consistent)"
      - "C006 Barra_residual_ICIR=-0.288 (clean, 2nd best of admitted)"
      - "C006 alpha_surv=0.393 — survives holdout despite being new"
      - "C006 val_decay_ratio=1.05 — almost no decay, most stable candidate in batch"
      - "C006 Mono_val=-0.9, Mono_holdout=-0.7 — consistent directionality"

    evidence_against:
      - "C007 alpha_surv=0.125 — change rate is reversal, not divergence change"
      - "C007 Barra_residual_ICIR=-0.032 — Barra-neutral component is negligible"

    failure_boundary: |
      Pv_corr change rate (Sub(Corr(pv,20),Ref(Corr(pv,20),20))) is not a divergence change
      mechanism; it is a short-term reversal signal. Do not continue C007-type probes.

    open_questions:
      - "Does percentile rank of turnover (CsRank) vs raw turnover provide different conditioning?"
      - "Does multi-scale divergence (5d, 10d, 20d) provide independent signals?"

    next_best_probes:
      - expr: "Mul(Corr($close,$volume,20),CsRank($turnover_rate))"
        why: "Admit confirmed; replicate with different lookback windows (10d, 40d) to test robustness"
      - expr: "Mul(Corr($close,$volume,10),CsRank($turnover_rate))"
        why: "10d lookback — if mechanism is scale-invariant, should also perform"
      - expr: "Mul(Corr($close,$amount,20),CsRank($turnover_rate))"
        why: "Replace $volume with $amount — if amount captures order flow, may strengthen signal"

