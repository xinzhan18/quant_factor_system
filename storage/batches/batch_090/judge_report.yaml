        C003 (batch_090, 5d×amount_rank): ICIR_ho=-0.396, mono_ho=-1.0, barra_res_icir=-0.331.
        C004 (batch_090, 5d raw): alpha_surv=1.024, decay=1.066.
        The mechanism is clearly real and consistent. The blocks are:
        (1) Raw: IC ceiling at ~-0.15 holdout
        (2) Conditioned: book_to_price from CsRank($amount)
        Both blocks have identified solutions. High probability of admission in next 1-2 batches.
      likely_mechanism: "Institutional aggression signal captured by range-amount correlation. CsRank($amount) amplification path identified."
      style_repackaging_risk: low
      explainable_by_existing_logic: no
      escalation_status: watch

