logic_diagnostics:
  L015:
    thesis_update: |
      L015 thesis refined by batch_100: the sign flip in PE/PB/PS divergence signals comes from the PRICE CHANGE
      COMPONENT, not the fundamental change component. Sub(CsRank(fundamental_change), CsRank(price_change))
      = CsRank(earnings_momentum) - CsRank(price_momentum_reversal).

      The CsRank(price_change) component directly loads on str_1m Barra factor (positive direction = reversal
      after price DECLINE, but str_1m positive means recent price increase = opposite direction loading).
      This is the root cause of the sign flip: the subtraction creates a negative loading on str_1m.

      C003 (pure EPS change 60d) PROVES the earnings component alone is barra-clean (barra_res_icir=+0.394,
      alpha_surv=3.017). The mechanism exists and is orthogonal to ALL library factors (max_lib=0.025).
      The ONLY problem is signal weakness (ICIRval=0.123).

      Path forward is clear: amplify pure earnings momentum. Options:
      1. Longer lookback (120d): captures 2 quarterly earnings cycles — should strengthen signal
      2. EPS acceleration: compare EPS_today to Mean(EPS, 60d) — amplifies stocks with ACCELERATING earnings
      3. Revenue change proxy: CsRank(Div(Div($close,$ps_ratio), Div(Ref($close,120),Ref($ps_ratio,120)))) — revenue momentum at 120d
      4. Multi-metric earnings momentum: Mul(CsRank(EPS_change), CsRank(Revenue_change)) — both improving

    evidence_for:
      - "C003: barra_res_icir=+0.394 (POSITIVE!) — earnings momentum IS barra-clean"
      - "C003: alpha_surv=3.017 — Barra removal AMPLIFIES signal (not degrades)"
      - "C003: max_lib=0.025 — virtually uncorrelated with any library factor"
      - "C003: ep_ratio Barra has NEGATIVE exposure — confirms orthogonality to value factors"
      - "C002 (PS 60d): alpha_surv=0.841 (highest) with mono_ho=+1.0"

    evidence_against:
      - "C003: ICIRval=+0.123 too weak (threshold ~0.25)"
      - "C003: decay_tv=0.435 (large train-val decay — earnings changes sparse within 60d)"
      - "All PS variants: same str_1m contamination as PE variants"
      - "Independence filter (C004/C006): does NOT reduce sign flip, adds str_1m"
      - "PS 20d (C001): style_r2=0.766 (76%!) — fundamental/price divergence dominated by price"

    failure_boundary: |
      CONFIRMED DEAD ENDS:
      - Sub(CsRank(fundamental_change), CsRank(price_change)): ALL variants (PE/PB/PS at any window) = sign flip
      - PE-price independence filter (1 - rolling correlation): ADDS str_1m, does not remove it
      - Relative amount conditioning: worsens alpha_surv (C005 in batch_099)
      - 20d price momentum component: unavoidable str_1m loading

      VIABLE PATH:
      - Pure fundamental change WITHOUT price component: EPS/Revenue/EPS_acceleration

    open_questions:
      - "Can EPS change at 120d produce ICIRval>0.25 (capturing 2 quarterly cycles)?"
      - "Does EPS acceleration (EPS_today vs Mean(EPS,60d)) provide stronger signal than point-to-point change?"
      - "Can revenue change proxy (PS-based EPS equivalent) at 120d strengthen the C003 signal?"
      - "Would multi-metric confirmation (EPS change × Revenue change) improve signal quality?"

    next_best_probes:
      - expr: "CsRank(Div(Div($close,$pe_ratio),Div(Ref($close,120),Ref($pe_ratio,120))))"
        why: "EPS change at 120d (2 quarterly cycles). Captures more earnings revision momentum. If ICIRval>0.20 with barra_res_icir positive, this is the admission candidate."
      - expr: "CsRank(Div(Div($close,$pe_ratio),Mean(Div($close,$pe_ratio),60)))"
        why: "EPS acceleration: EPS_today vs 60d-average EPS. Amplifies stocks with recent EPS breakout above their own 3-month average. More sensitive to quarterly earnings beats."
      - expr: "CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,120),Ref($ps_ratio,120))))"
        why: "Revenue change at 120d. Revenue grows more smoothly than EPS (less quarterly noise). May be stronger signal than EPS at same horizon."
      - expr: "Mul(CsRank(Div(Div($close,$pe_ratio),Div(Ref($close,120),Ref($pe_ratio,120)))),CsRank(Div(Div($close,$ps_ratio),Div(Ref($close,120),Ref($ps_ratio,120)))))"
        why: "Multi-metric confirmation: EPS_change × Revenue_change at 120d. Stocks with BOTH improving earnings and revenue have stronger signal than either alone."
