        - "alpha_surv=0.356-0.391 (borderline, below 0.4 threshold)"
        - "dominant_style=str_1m=0.244-0.276 (moderate exposure)"
        - "Corr($close, $turnover_rate) fails with shape mismatch — turnover field problematic"
        - "TsRank($volume) also fails — volume field has same issue"

