        Corr($close, $turnover_rate) should NOT be probed further — shape mismatch
        is intrinsic to the share-count based turnover field in cross-sectional Corr.
        Amount-based Corr is the only viable variant found so far.
        High redundancy vs existing factors is the primary concern — need to
        determine if amount-based Corr provides genuine incremental information
        or is just a monetary variant of existing pv_corr pathway.

