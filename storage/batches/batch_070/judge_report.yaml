        - expr: "Corr($close, $amount, 10)"
          why: "Pure Corr without conditioning — tests if PE conditioning is necessary or adding noise"
        - expr: "Mul(Corr($close, $amount, 10), CsRank($ps_ratio))"
          why: "PS conditioning as alternative to PE — tests if different fundamental conditions reduce redundancy"
        - expr: "Corr($close, $amount, 5)"
