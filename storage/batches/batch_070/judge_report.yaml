        L009 mechanism (Corr(close, amount) × PE) is VIABLE.
        Amount field ($amount = price × volume) solves the shape mismatch problem
        that plagued turnover-based Corr. The monetary co-movement signal captures
        genuinely different information than rel-tur's competition intensity.
        Key evidence: C005 shows decay_ratio=1.09 (IC strengthens on holdout),
        mono stable at -0.7, ls_tstat=-4.80.
        The mechanism difference from L008: rel-tur produces LONG-ONLY signals
