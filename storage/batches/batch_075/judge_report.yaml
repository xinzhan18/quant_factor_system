  logic_diagnostics:
    L009:
      thesis_update: |
        Rank conditioning (PE/PS/tur_rank) on amount-based Corr produces NEGATIVE Barra residual.
        This confirms the mechanism: pure Corr captures co-movement with some style contamination.
        Conditioning by rank REMOVES the style influence — rank strips magnitude, leaving only relative position.
        batch_073 showed PE rank on amount-based Corr (C003): Barra_res=-0.0104.
        batch_075 PE rank (C001): Barra_res=-0.0137 (cleaner than batch_073 C003).
        batch_075 tur_rank (C005): Barra_res=-0.0245 (cleanest in L009 history).
        The conditioning mechanism is validated — the question is now redundancy vs existing factors.

      evidence_for:
        - "C001: Barra_res=-0.0137, mono=-0.7/-0.7 (STABLE), decay=1.09, max_lib=0.78"
        - "C005: Barra_res=-0.0245 (cleanest in L009), ICIR_ho=-0.469, mono=-0.9/-0.7 (stable)"
        - "C003: Barra_res=-0.0132, decay=1.20 (best decay ratio in batch_075)"
        - "All 5 candidates: NEGATIVE Barra residual (clean)"
        - "All 5 candidates: decay_ratio > 1.0 except C002 (0.78)"
        - "All 5 candidates: holdout ICIR consistent with validation ICIR"

      evidence_against:
        - "C004/C005: max_lib_corr=1.0 vs F009/F007 (near-duplicates)"
        - "C001/C002/C003: max_lib_corr=0.78-0.81 (HIGH redundancy)"
        - "C002/C003/C004: mono decays on holdout (-0.9→-0.5/-0.6)"
        - "C002: decay_ratio=0.78 < 1.0 (IC WEAKENS on holdout)"
        - "All candidates show str_1m exposure (0.24-0.35) — intrinsic to mechanism"
        - "alpha_surv=0.30-0.39 (borderline)"

      failure_boundary: |
        PE rank conditioning is validated — no more pure Corr × fundamental value needed.
        PS rank conditioning works but mono decays and alpha_surv is lowest.
        Tur_rank conditioning produces cleanest Barra_res but near-duplicate of F007/F009.
        20d windows are too slow (C002: decay<1.0).
        Redundancy threshold is the primary admission blocker — all candidates exceed 0.78.
        The key question: can Corr × PE rank (C001) with max_lib=0.78 be admitted?

      open_questions:
        - "What is the actual redundancy threshold for admission? 0.75? 0.80?"
        - "Is C005 (near-F007) truly redundant or is the tur_rank mechanism genuinely novel?"
        - "Could a decorrelate step reduce C005's redundancy below 0.80?"
        - "Is alpha_surv=0.30-0.39 acceptable or does it indicate style contamination?"
        - "Could PE rank × amount be decorrelated from F004 to below 0.75?"

      next_best_probes:
        - expr: "Div(Mul(Corr($close,$amount,10),CsRank($pe_ratio)),F009)"
          why: "Decorrelate C001 (PE rank) by dividing by F009 — tests if residual survives"
        - expr: "Sub(Mul(Corr($close,$amount,10),CsRank($pe_ratio)),Mul(F006,0.5))"
          why: "Partial decorrelation — subtract half of F006's contribution"
        - expr: "Mul(Corr($close,$amount,10),CsRank($pe_ratio),CsRank($turnover_rate))"
          why: "Double conditioning: PE rank + turnover rank — test if dual conditioning reduces redundancy"

