        - "C005: decay_ratio=1.611 (IC STRENGTHENS significantly on holdout)"
        - "C001: Barra_res=-0.006 (cleanest in batch_071)"
        - "Pure Corr outperforms PE/PS/PB conditioning on all strength metrics"
        - "All 5 candidates: expanding_window_pass=True, sign_consistency=True"

      evidence_against:
