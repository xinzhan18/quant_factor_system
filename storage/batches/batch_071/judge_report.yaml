        - "alpha_surv 0.15-0.30 (LOW) — style trap concern"
        - "str_1m exposure 0.26-0.32 (moderate) — partial style absorption"
        - "5d window (C005): lower win_rate (29.5%) vs longer windows"
        - "C003/C004 (conditioned): mono decays on holdout"

      failure_boundary: |
        Conditioning (PE/PS/PB) does NOT improve Corr signals — confirmed in batch_071.
        Pure Corr is the correct form. Redundancy vs existing factors is the primary blocker.
        All variants show str_1m moderate exposure (0.26-0.32) — intrinsic to the mechanism.

      open_questions:
