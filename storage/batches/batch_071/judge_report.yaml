      thesis_update: |
        Pure Corr(close, amount) WITHOUT conditioning is STRONGER than any conditioned version.
        This is a fundamental finding. PE/PS/PB conditioning adds NOISE to the Corr signal.
        The mechanism captures genuine price-volume co-movement that is degraded by conditioning.
