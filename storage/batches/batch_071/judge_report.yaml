        but the CLEAN Barra residuals (-0.006 to -0.016) confirm residual alpha exists.
        The discrepancy (low alpha_surv but clean Barra_res) means the signal earns returns
        but through a style-correlated mechanism that gets partially neutralized.

      evidence_for:
