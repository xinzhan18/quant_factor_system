# Research system configuration — single source of truth
# All skills / CLI / pipeline read from here.
# Edited by hand (rare). Phase 5 consolidation may touch thresholds.

qlib_data_dir: ~/.qlib/qlib_data/cn_data_1d

# 日内 primitive MVP 配置。
# - minute_parquet: 清洗后的分钟 parquet 文件或目录，schema 至少包含
#   time, symbol, open, high, low, close, volume, amount。
# - qlib_data_dir: 可选实验 Qlib 目录；若设置，必须能同时读取基础日频字段
#   和导出的 primitive 字段。默认写入并读取 qlib_data_dir。
primitive:
  minute_parquet:
  qlib_data_dir:

sample_policy:
  train_range: [2015-01-01, 2021-12-31]
  validation_range: [2022-01-01, 2023-12-31]
  holdout_range: [2024-01-01, 2024-12-31]   # Phase 2/3 never see this

universes:
  primary: all_tradable             # CP01–CP06 run on full-market tradable stock-days
  secondary:                        # Basic metrics only — context for cross-universe robustness
    - csi300
    - csi1000

evaluation:
  primary_horizon: 1                # t+1 to t+5 cumulative return
  decay_horizons: [1, 3, 5, 10, 20] # IC decay curve
  quintile_bins: 5

preprocess:
  winsorize_mad_k: 5                # k-MAD clipping
  winsorize_mad_scale: 1.4826       # normal-distribution MAD → std
  zscore: true
  neutralize: false                 # keep off — CP04 Barra residual does post-hoc check

tradability:
  filter_suspend: true
  filter_limit: true
  filter_st: true
  filter_newly_listed: true
  volume_zero_means_suspended: true
  amount_zero_means_suspended: true
  limit_up_tolerance: 0.999
  limit_down_tolerance: 1.001
  min_listing_days: 60

thresholds:
  # CP01 Hard Gates
  hard_gates:
    min_coverage: 0.80
    min_oos_decay: 0.20        # OOS IC / IS IC ratio — below = total signal collapse
    min_ic_oos: 0.008          # |IC_OOS| minimum — below = noise
    mono_flip_min_magnitude: 0.5  # 2026-04-20: only hard-fail mono_sign_flip when both |train|,|val| ≥ 0.5; shallow flips (±0.1~0.3) are noise, not regime change (batches 010/011 post-mortem)
  # CP03 Statistical Strength
  icir_strong: 0.30
  icir_weak: 0.15
  # CP04 Risk Cleanness
  style_r2_acceptable: 0.08
  style_r2_poor: 0.12
  # alpha_surv_min is direction-aware: different direction families have
  # structurally different tolerance for Barra-style absorption.
  # - barra_residual_alpha: residual IS the alpha signal → survival ≥ 1.0
  #   (Barra_residual_IC ≥ raw_IC is a tautological admission criterion)
  # - value_liquidity / amount_volatility: direction hypothesis is that
  #   value/liquidity/turnover crossovers carry partial style exposure
  #   AND independent alpha; 0.25–0.30 matches empirical regime
  # - default 0.40: generic factor, must retain majority of alpha after
  #   risk-model strip (relaxed 2026-04-19 from 0.60)
  alpha_surv_min:
    default: 0.40
    barra_residual_alpha: 1.00
    amount_volatility_signal: 0.25
    value_liquidity_interaction: 0.30
  # CP05 Redundancy
  max_lib_corr_low: 0.30
  max_lib_corr_high: 0.70
  # §7.MT Multiple Testing Budget (placeholder constants; re-calibrated in P2 after backfit on batch_001..102)
  mt_budget:
    family_log_base: 600            # clip(log1p(cumulative_candidates) / log(600), 0, 1)
    direction_log_base: 80          # clip(log1p(direction_candidates)  / log(80),  0, 1)
    exposure_divisor: 40            # clip(validation_exposure / 40, 0, 1)
    weights:                        # 0.50 / 0.30 / 0.20 sum = 1
      family: 0.50
      direction: 0.30
      exposure: 0.20
    bucket_low: 0.40                # score < 0.40 → low
    bucket_high: 0.70               # score > 0.70 → high (else medium)
    adjusted_strength_discount: 0.50  # adjusted = raw * (1 - 0.5 * mt_score)

consolidation:
  auto_triggers:
    rounds_since_last: 10
    lessons_max_lines: 400
    direction_max_lines: 500
    total_active_directions: 20
  parallelism:
    max_concurrent_subagents: 6

backtest:
  defaults:
    universe: csi1000
    initial_capital: 10000000
    signal_recompute: true

    rebalance:
      freq_days: 5
      anchor: monday

    portfolio:
      holdings_n: 50
      weight_scheme: equal
      max_single_weight: 0.05

    matching:
      match_price: open
      price_adjust: hfq

    cost:
      stamp_schedule:
        - {from: 2015-01-01, to: 2023-08-27, sell_bps: 10}
        - {from: 2023-08-28, to: 9999-12-31, sell_bps: 5}
      commission_bps: 3
      slippage_bps: 5
      min_commission_cny: 5

    capital:
      allow_intraday_netting: false

    filters:
      block_st: true
      block_suspended: true
      block_limit_up_at_buy: true
      block_limit_down_at_sell: true
      cooldown_days_after_unsuspend: 1
      newly_listed_days: 60
      stale_position_days_max: 5

    periods:
      train: [2015-01-01, 2021-12-31]
      val: [2022-01-01, 2023-12-31]
      holdout: [2024-01-01, 2024-12-31]
      run: [train, val, holdout]

    benchmark:
      kind: csi1000_total_return

    output:
      save_trades: true
      save_positions: true
      figs: [equity, drawdown, monthly_heatmap, layer_decomp, cost_drag, blocked_trades]
