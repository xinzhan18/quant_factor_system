# Per-factor backtest override for F017 — used during the smoke test before
# the hfq + ST + lifecycle data syncs have run. Disables filters that depend
# on tables not yet populated, and points the engine at the existing qfq
# parquet via price_adjust override.
matching:
  price_adjust: qfq
filters:
  block_st: false
  block_suspended: true
  block_limit_up_at_buy: false
  block_limit_down_at_sell: false
  cooldown_days_after_unsuspend: 0
  newly_listed_days: 0
  stale_position_days_max: 5
periods:
  run: [val]
