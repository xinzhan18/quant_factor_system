batch_goal: 'Round 92 — reserve revival pool #2 (asset-driven, calibration finding/013).
  Target = revive b076/C005 TsRank((h+l)/2/close,60) midprice/close. b076 实测
  alpha_surv=1.43 + ls_t=+4.84 + mono=+0.90 + incr_ic=+0.042 (4 项 CP top) 仅 max_corr=0.449@F008
  cluster 阻断 (距 0.40 阈值仅 0.049 over). direction status=saturated, 本批显式 asset-driven 复活 —
  finding/013 给出 3 revival path: (1) Python residualize on (F008, F026) — DSL 表达不出
  的 cross-section OLS 残差化; (2) RHS swap close→Mean(close,5) 切 F008 close-position 几何耦合;
  (3) window sweep + rank-diff form. 本批 6 候选覆盖所有 path + P008 third-ratio probe (intentional
  high-collision 测 F024 monotonic envelope).

  Round-92 Phase 1 generator self-check 新增 4 hard rule (P030 / P004-deep / Cov-equiv / reciprocal
  duplicate). 全候选自检:
  - P030 (alpha_surv>1.0 unilateral form 单独 ≠ admit 充分): 本批每候选必带 multi-CP rationale,
    不依赖 alpha_surv 单边. C001 expected incr_ic POS+max_corr<0.40, C002 expected
    max_corr<0.40, C003-C005 expected incr_ic+ls_t multi-CP, C006 known-near-dup probe;
  - P004-deep (N-day path-integral 累积形式 default reject): TsRank(x,N) 是 rank-of-current-value-in-window-N,
    非 cumulative sum/aggregation — 全候选 pass; Python C001 内部用 vectorized
    单步 cross-section OLS 残差化, 不是 N-day path-integral;
  - Cov-equiv (Cov(.,.)/Cov-of-zero-mean-series 已知 cross-field bug): 全候选无 Cov form,
    无 Corr 跨字段; pass;
  - Reciprocal monotonic-invariant duplicate (round 92 新发现): TsRank((h+l)/2/close, N)
    与 TsRank(close/(h+l)/2, N) 在 monotonic 函数 (Div + 单调 RHS) 下 cross-section TsRank
    rank 几何 ≈ N+1-TsRank 单调反向 — 不另设 reciprocal probe (b091/C005 已实证 sign-flip 等价).

  Cockpit hint round 91 P008 finding update: TsRank window>=60d on ratio 是 escape path,
  但 b091 实测 window>90d alpha_surv 反单调下降, 上界 ~90d. F024 anchor basin 宽度>=90d —
  long-window TsRank ratio [30,120d] 全在 F024 引力盆地内. 本批 C003 window=30d 在 60d 阈值
  以下, C002/C005 维持 60d, 不试 120d (P008 上界).

  Anti-recapitulation (b076/b077 已 disproven 不重试):
  - 不重试 raw TsRank((h+l)/2/close,60) — 那是被复活的 reserve 本身, 直接重计算 = 重复 b076/C005;
  - 不重试 b077 三层 nested Div/Mul / Std×TsRank 双量纲化 / cross-product CsRank-Mul / 分母替换 (H-L)/(C+O);
  - 不重试 b076 hard_gate body_ratio TsRank60 / raw upper_shadow TsRank60.

  Hard targets: ≥1 admit 验证 reserve revival 真红利; 关键 H1 = Python residualize (F008,F026)
  能否把 max_corr 从 0.449 降至 <0.30 同时维持 alpha_surv≥1.0 + incr_ic≥+0.02 (finding/013
  expected_outcome). 若 C001 admit + max_corr<0.30 → 升格"Python residualize 是 reserve cluster
  突破真路径"律 (library_gap/013 验证). H2 = RHS swap close→Mean(close,5) 是否切 F008 同根
  (C002 expected max_corr<0.40). H3 = 30d 短窗是否比 60d 更脱 F008 cluster (C003).
  H4 = rank-diff 跨窗 form (C004) 是否独立. H5 = open-close 中点 (C005) 是否避 F008 close-position
  耦合. Fail (6/6 reject) → tsrank_candlestick_ratio direction 彻底 dead, 升格 ''family-level
  Python residualize 失败律'' + 切下一 direction.'
