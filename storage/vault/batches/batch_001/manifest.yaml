batch_id: batch_001
direction: candlestick_liquidity
batch_goal: First exploration of candlestick microstructure x liquidity interactions
  on csi1000 — test shadow ratios, body ratios, and range compression signals with
  and without turnover conditioner
sample_policy_version: v3
candidates:
- candidate_id: C001
  source_type: dsl
  expression: Mul(Div(Sub($high, If(Gt($close, $open), $close, $open)), Sub($high,
    $low)), $turnover_rate)
  canonical: Mul($turnover_rate,Div(Sub($high,If(Gt($close,$open),$close,$open)),Sub($high,$low)))
  rationale: Upper shadow ratio x turnover — tests if intraday selling pressure +
    high liquidity predicts short-term returns
- candidate_id: C002
  source_type: dsl
  expression: Mul(Div(Sub(If(Lt($close, $open), $close, $open), $low), Sub($high,
    $low)), $turnover_rate)
  canonical: Mul($turnover_rate,Div(Sub(If(Lt($close,$open),$close,$open),$low),Sub($high,$low)))
  rationale: Lower shadow ratio x turnover — tests if intraday buying support + high
    liquidity is a long signal
- candidate_id: C003
  source_type: dsl
  expression: Mul(Mul(Div(Sub($high, $low), $close), Div(Sub($high, $low), $close)),
    $turnover_rate)
  canonical: Mul($turnover_rate,Mul(Div(Sub($high,$low),$close),Div(Sub($high,$low),$close)))
  rationale: Squared range ratio x turnover — amplifies extreme intraday ranges when
    liquidity is high
- candidate_id: C004
  source_type: dsl
  expression: Mul(Sub($high, If(Gt($close, $open), $close, $open)), Sub(If(Lt($close,
    $open), $close, $open), $low))
  canonical: Mul(Sub($high,If(Gt($close,$open),$close,$open)),Sub(If(Lt($close,$open),$close,$open),$low))
  rationale: Shadow product (upper_shadow x lower_shadow) — pure price structure signal
    without liquidity conditioner
- candidate_id: C005
  source_type: dsl
  expression: Mean(Div(Abs(Sub($close, $open)), Sub($high, $low)), 20)
  canonical: Mean(Div(Abs(Sub($close,$open)),Sub($high,$low)),20)
  rationale: 20-day mean body ratio — stable candlestick structure measure, tests
    if persistent body patterns predict returns
- candidate_id: C006
  source_type: dsl
  expression: Std(Div(Abs(Sub($close, $open)), Sub($high, $low)), 20)
  canonical: Std(Div(Abs(Sub($close,$open)),Sub($high,$low)),20)
  rationale: 20-day body ratio volatility — tests if regime change in candlestick
    structure predicts price moves
- candidate_id: C007
  source_type: dsl
  expression: Div(Mean(Div(Sub($high, $low), $close), 5), Mean(Div(Sub($high, $low),
    $close), 60))
  canonical: Div(Mean(Div(Sub($high,$low),$close),5),Mean(Div(Sub($high,$low),$close),60))
  rationale: Short/long range ratio (5d/60d) — range compression/expansion as volatility
    regime indicator
- candidate_id: C008
  source_type: dsl
  expression: Mul(Div(Sub($high, $low), $close), Mean($turnover_rate, 5))
  canonical: Mul(Div(Sub($high,$low),$close),Mean($turnover_rate,5))
  rationale: Daily range x 5d avg turnover — cross of price volatility with recent
    liquidity
