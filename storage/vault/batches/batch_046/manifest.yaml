- candidate_id: C006
  source_type: dsl
  expression: Mean(Div(Delta($turnover_rate, 1), Mul($turnover_rate, $turnover_rate)),
    20)
  canonical: Mean(Div(Delta($turnover_rate,1),Mul($turnover_rate,$turnover_rate)),20)
  rationale: T005 novel signed illiquidity proxy — Mean(Δturnover / turnover²), 即
    -Δ(1/turnover)/turnover。类比 Kyle-lambda 风格的 signed impact：Δturnover 上升 = 流动性改善，下降
    = 恶化。除以 turnover² 保持 1/amount 的 Amihud 量纲味道。与 F012 (|return| / amount) 不同源：F012
    用 price-magnitude，本候选用 turnover-change-signed。 若通过 hard_gate 且 max_corr@F012 <
    0.5 说明 illiquidity 空间 存在 signed sister 信号；若 reject 则证实"symmetric magnitude 是 illiquidity
    alpha 的唯一形式"硬结论。
