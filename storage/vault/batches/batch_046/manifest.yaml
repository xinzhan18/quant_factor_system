- candidate_id: C004
  source_type: dsl
  expression: Sub(CsRank(Std($amount, 20)), CsRank(Mean(Div(Abs(Div(Delta($close,
    1), Ref($close, 1))), $amount), 20)))
  canonical: Sub(CsRank(Std($amount,20)),CsRank(Mean(Div(Abs(Div(Delta($close,1),Ref($close,1))),$amount),20)))
  rationale: T006 rank-diff symmetric interaction — CsRank(amount Std 20d) 减 CsRank(Amihud
    20d)。替代结构：同 C003 思路但分母端用 Std($amount, 20) 代替 CV (Std/Mean)。Std 是 amount dispersion
