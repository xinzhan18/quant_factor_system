  canonical: Sub(CsRank(Mean(Div(Abs(Div(Delta($close,1),Ref($close,1))),$amount),20)),CsRank(Div(Std($amount,10),Mean($amount,10))))
  rationale: T006 rank-diff symmetric interaction — CsRank(Amihud 20d) 减 CsRank(F001
