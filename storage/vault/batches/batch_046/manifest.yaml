  canonical: SignedPower(Mean(Div(Abs(Div(Delta($close,1),Ref($close,1))),$amount),20),0.5)
  rationale: T005 tail-compressed non-linear monotonic Amihud — 对 F012 (Amihud 20d)
    开 0.5 次方（保持符号，压缩右尾极值）。假设： F012 的 max_corr=0.754@F002 是因 Amihud 右尾极值与 F002 (pb/amount)
