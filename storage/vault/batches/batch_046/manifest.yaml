  canonical: Mean(Div(If(Gt(Delta($close,1),0),Div(Delta($close,1),Ref($close,1)),0),$amount),20)
  rationale: T005 sign-conditional (up-day) Amihud — 用 positive return-only 的 return/amount
    平均值（down-day 置 0），捕捉"上涨日的价格冲击成本"。 与 F012 (Abs Amihud) 区分：F012 对称合并 up/down impact，本候选只测
