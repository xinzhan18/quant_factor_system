- candidate_id: C005
  source_type: dsl
  expression: Mul(Sign(Sub($close, Ref($close, 5))), Skew(Div(Sub($high, $low), $close),
    60))
  canonical: Mul(Sign(Sub($close,Ref($close,5))),Skew(Div(Sub($high,$low),$close),60))
  rationale: Sign-gated Skew — 将 60d Skew 乘上近 5d 方向（sign of close - close_ref_5）。破除纯
    shape 的方向对称性：正偏度 × 上涨 5d = 事件股在上升途中（潜在延续），正偏度 × 下跌 5d = 事件股在回调（潜在反转）。若 shape 与
    momentum 交互有独立 alpha，会体现为 Skew 单用之外的增量。风险：sign interaction 在 csi1000 有 regime
    flip 先例（gap_acceptance_structure batch_035 pure sign 被证伪），但本候选不是 pure sign——Skew
    是 magnitude-bearing shape 量，5d ret Sign 仅作 gate 不丢 magnitude。与 C001/C004 机制区分明确。
- candidate_id: C006
  source_type: dsl
  expression: Div(Sub(Quantile(Div(Sub($high, $low), $close), 60, 0.8), Quantile(Div(Sub($high,
    $low), $close), 60, 0.2)), Med(Div(Sub($high, $low), $close), 60))
  canonical: Div(Sub(Quantile(Div(Sub($high,$low),$close),60,0.8),Quantile(Div(Sub($high,$low),$close),60,0.2)),Med(Div(Sub($high,$low),$close),60))
  rationale: (Q80 - Q20) / Median — 60d window 内 robust IQR 相对中位值的 scale-free 比值。**不是
    T002 DISPROVEN 的 short/long ratio**（T002 测的是 Mean(5) / Mean(60) 的时间窗 ratio，本候选是
    **within-window** 的 quantile spread 归一化）。机制：测 range 分布的 relative dispersion —
    当 IQR/Med 高时，股票在事件日 vs 平静日差异大（shape-sensitive）；低时 range 分布均匀（近 log-normal）。Scale-free
    属性应降低 vol_20d 吸收。与 F012 amihud（流动性冲击）不同；与 F001 amount_cv（amount CV）维度正交（本候选测 range
    不测 amount）。
