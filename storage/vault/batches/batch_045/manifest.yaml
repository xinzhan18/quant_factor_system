- candidate_id: C001
  source_type: dsl
  expression: Kurt(Div(Sub($high, $low), $close), 60)
  canonical: Kurt(Div(Sub($high,$low),$close),60)
  rationale: 'Kurt = 60d (H-L)/C 的 4 阶中心矩（超额峰度）。与 batch_043 C004 Skew 同为 shape 统计但测尾部厚度（不区分左右偏）。经济直觉：极端
    range 日频率 / 正常日 range 平静度的''事件集中强度''。与 vol_20d（二阶矩）数学上正交（shape vs magnitude）。Adjacent
    scan: return_distribution_signals dead 但测的是 return 的 Kurt 非 range 的 Kurt；stochastic_position
