  expression: Skew(Div(Sub($high, $low), $close), 120)
  canonical: Skew(Div(Sub($high,$low),$close),120)
  rationale: 延续 batch_043 C004 (60d Skew) 的 120d 长窗变体。paradox 诊断为 mono_is 弱（0.30）+
