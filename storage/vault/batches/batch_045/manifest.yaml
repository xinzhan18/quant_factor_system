- candidate_id: C002
  source_type: dsl
  expression: Quantile(Div(Sub($high, $low), $close), 60, 0.9)
  canonical: Quantile(Div(Sub($high,$low),$close),60,0.9)
  rationale: 90 分位 (H-L)/C — 60d 窗口内 range 分布的上尾代表值。与 mean/std（vol_20d 吸收）不同的 robust
    高分位估计量，捕获'最极端 10% 日的 range 幅度典型值'。虽仍是 scale 测度但 non-linear robust，信息不等价于 std。风险：可能与
    vol_20d corr 偏高；mitigation 是 quantile 对整体分布尾部更敏感（std 对均值偏离平方根）。首次测试 Quantile 算子在本方向的适用性。
- candidate_id: C003
  source_type: dsl
  expression: Sub(Quantile(Div(Sub($high, $low), $close), 60, 0.9), Med(Div(Sub($high,
    $low), $close), 60))
  canonical: Sub(Quantile(Div(Sub($high,$low),$close),60,0.9),Med(Div(Sub($high,$low),$close),60))
  rationale: Q90 - Median 的 (H-L)/C — 尾部极值 vs 中位值的 asymmetric spread，robust 非对称性指标。机制：测量'少数极端
    range 日 - 典型 range 日'的绝对差，与 Skew 同向信息但基于 quantile 而非 moment（对 outlier 稳健）。与 C001(Kurt)/C002(Q90)
    形成三角对照：C001 测 tail 厚度，C002 测 tail 典型值，C003 测 tail 相对 center 偏离。Expected 与 F001
    amount_cv 正交（F001 是 amount CV 非 range 量）。
- candidate_id: C004
