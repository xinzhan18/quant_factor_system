  (e) T004 distance-from-MA60 z-score — 测 z-score 几何是否绕过 P008 specific atom 限制;
  (f) T004 PTA 250d × CsRank-wrapper baseline-first variant.
  全候选避 F025/F026/F018/F021/F022/F009 cluster, 严守 P019 数据契约（Corr 仅 OHLCV+amount+num_trades,
  本批无 Corr 算子使用）+ P021（无 Mul wrapper 跨字段）+ rate-form forbidden（no Delta/Sub of PTA）.
