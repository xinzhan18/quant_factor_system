  position/ratio 几何，新候选必须 max_corr<0.40 vs F025/F026/F018/F021/F022/F009.
  本批 6 候选探索 (a) T004 PTA 250d 长窗口 envelope（论文标定窗口，60d/120d 均失败 vol_20d 撑大）;
  (b) T002 PTA × past-winner 嵌套维度（CsRank-rank-diff form 而非 Mul wrapper, 避 P021）;
  (c) T005 wick-asymmetry ratio (upper/lower wick) — daily-resolution dim-less ratio
