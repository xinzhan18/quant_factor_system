direction: conditional_operator_truncation
batch_goal: |
  Round 97 — structural gap exploration: conditional operator family (Gt / Lt / If)
  under-utilized in library (28 admit: 1 conditional F028 + 27 linear-arithmetic).
  6 候选覆盖 6 子族 (T001 上影主导日占比, T002 gap-up 事件率, T003 high-turnover-rank
  conditional flow, T004 上涨日占比, T005 低振幅日占比, T006 PV-corr-gated momentum) —
  全部使用 Gt/Lt 把信号离散化为 {0,1} 事件 + Mean aggregate 成 Bernoulli rate,
  或用 If 做 conditional observation。

  Qlib op note: Qlib runtime 提供 Gt/Lt (返回 bool) 与 Greater/Less (返回 element-wise
  max/min) 是不同语义算子; 本批用 Gt/Lt 做 boolean event count, 用 If(cond, left, right)
  做 conditional select (Qlib 用 If 而非 IfElse 名).

  **核心 hypothesis**: conditional truncation 在 cross-section 上产生 geometric distinct
  ordering — 与 27 个线性算术 admit max_corr 应 < 0.40, 同时离散事件率 aggregate 不构成
  path-integral path-memory (因二值化丢弃了连续 ε 信号).

  **Self-check 5 hard rule (round 73 + round 91 升格)**:
  - **P030** (alpha_surv>1.0 单边 ≠ admit 充分): 全 6 候选 multi-CP rationale, 不依赖
    alpha_surv 单边; 即使 truncation 几何独特, admit 仍需 incr_ic + max_corr + ls_t 至少 2/3
  - **P004-deep path-integral borderline** (round 91 升格): T002/T004/T005 是 Sum/Mean of
    `Greater(.,.)` 或 `IfElse(.,1,0)` 离散事件 — 在二值化 truncate 后, path-memory β-shift
    机制理论上消失 (path-integral 危险源是 `Σ(ε_t-i)` 内层连续 ε, 二值化把它降到 {0,1}
    离散概率, 等价于 Bernoulli rate). **borderline 标注**: 本批显式 case-by-case 进入,
    Phase 3 judge 若发现 vol_20d_exp > 15 或 alpha_surv < 0.4 触发 P004-deep 类失败模式,
    则该子族证伪
  - **F028 anchor precheck**: F028 = `Div(Sum(Lt × Greater, 12), ...)` 是 DMI 双计数比值;
    本批 6 候选无 Lt×Greater 双 condition 复合 (T001-T005 单 Greater/Lt, T006 IfElse 选择);
    几何 distinct 概率高, 但 Phase 2 必跑 max_corr_F028 实测
  - **Reciprocal monotonic-invariant**: `Greater(x, 0)` ≠ `Less(-x, 0)` 同 cross-section
    rank (sign-flip 但 cross-section 上 truncate 方向同, 不等价); 本批避免 Greater/Less
    互补对偶 (无 `Greater(x,c) + Less(x,c)` 配对覆盖全空间)
  - **Cross-section OLS sign-flip / Cov-equiv (P028)**: 无 Cov atom; 无 cross-section
    OLS residualize (DSL only)

  **Anchor avoidance**:
  - F028 (DMI down-ratio): 双 condition 复合 (Lt × Greater), 本批 6 候选无此结构 → distinct
  - F021 (upper_shadow_disp_range_compress_rd): T001 上影占比走 truncation+aggregate 路径,
    与 F021 走 dispersion+rank-diff 路径几何不同 (truncation 是离散二值, dispersion 是连续 Std)
  - F012 (Amihud 反转簇): T002/T004 是 cross-day return 事件率, 与 Amihud `Mean(|ret|/$amount)`
    level 信号不同 (truncate 后 magnitude 信息丢失, 只剩计数)
  - F019/F020 (gap-related rank-diff): T002 gap event rate 走 truncation+Mean 路径, 与 F020
    `gap_vol_body_ratio_rank_diff_20` 走 ratio+rank-diff 几何不同

  **Baseline-first 守则 explicit skip**: 15 untouched TTM fields 与 conditional truncation
  几何 (cross-day return event / shadow ratio threshold / turnover-rank gating) 完全不相关 —
  conditional truncation 依赖 daily price/volume 频率离散事件, TTM 财务字段是季度更新无法支撑
  daily event counting. 显式 skip baseline-first, 本批纯 OHLCV/microstructure structural 探索.

  **avoid-this-batch rank-diff axis**: 8 batches 累积零 admit 进入 dead-spiral, 本批显式不
  用 Sub(TsRank, TsRank) 形式; conditional operator 是正交几何。

  Target: ≥1 admit (ls_t ≥ 3.0 + max_corr < 0.40 + alpha_surv ≥ 0.5) OR ≥2 子族 validated
  (P004-deep 离散事件 aggregate 不触发 vol_20d 吸收, alpha_surv ≥ 0.5 + ls_t > 2.0).
  Calibration trigger 已 true from b095/b096; 本批是首个结构性新方向探索, 若 0 admit 不加深
  dead-spiral 因子, 而是检验 conditional family 路径可行性。

