candidates:
  - candidate_id: C001
    source_type: dsl
    expression: Mean(Gt(Div(Sub($high,$close),Sub($high,$low)),0.5),20)
    rationale: |
      T001 上影占比 truncation. 上影长度 = $high-$close, 当日 range = $high-$low,
      上影占比 = (H-C)/(H-L). Gt(.,0.5) 返回 bool: 大于 0.5 时为 1 (上影主导日)
      否则 0. 20d Mean = "上影主导日"占比 (Bernoulli rate).
      expected_sign: negative (上影主导 = 抛压 = 反转).

      Self-check:
        - P030: multi-CP rationale (incr_ic + max_corr + ls_t)
        - P004-deep BORDERLINE: Mean of Gt(.) 是离散 {0,1} 事件率 Bernoulli aggregate,
          二值化丢 path-memory β-shift (path-integral 危险源是连续 ε 累积, 此处事件计数
          离散无 β coefficient 传递)
        - F028 anchor: F028 是 Lt×Greater 双 condition 比值, 本候选单 Gt + Mean rate,
          几何 distinct
        - F021 (shadow_disp): F021 是 Std/dispersion 连续, 本候选是 truncate+rate 离散,
          几何不同
        - reciprocal duplicate: Gt(x,0.5) ≠ Lt(x,0.5) cross-section 不等价
          (Lt 是 lower-shadow 主导日是独立子族, 本批不覆盖)
    expected_sign: negative
    primary_cps: [CP03, CP04, CP05]

  - candidate_id: C002
    source_type: dsl
    expression: Mean(Gt(Div($open,Ref($close,1)),1.005),60)
    rationale: |
      T002 gap-up 事件率. $open/Ref($close,1) > 1.005 即 overnight gap-up > 0.5%
      为 1 否则 0. 60d Mean = "强 gap-up 事件率" Bernoulli rate.
      expected_sign: negative (频繁强 gap-up = 过度乐观 / disposition effect 反转).

      Self-check:
        - P030: multi-CP rationale
        - P004-deep BORDERLINE: gap event rate, 二值化离散; gap 是 cross-day 单步差分
          非累积, aggregate 是 Bernoulli rate 无 path-memory β-shift
        - F028 anchor: 单 Gt threshold, F028 双 condition, distinct
        - F018 (overnight_sign_freq_amount_rank_diff_20): F018 是 sign-freq × amount
          rank-diff 走 rank-diff 路径; 本候选是 gap-up rate 单字段走 truncation 路径
        - F020 (gap_vol_body_ratio_rank_diff): rank-diff form, 几何不同
        - reciprocal duplicate: Gt(x,1.005) ≠ Lt(x,0.995); gap-down 是独立子族 (本批不覆盖)
    expected_sign: negative
    primary_cps: [CP03, CP04, CP05]

  - candidate_id: C003
    source_type: dsl
    expression: Mean(Mul(Gt(TsRank($turnover_rate,60),0.8),$turnover_rate),20)
    rationale: |
      T003 high-turnover-rank conditional flow. Gt(TsRank,0.8) 选出 TsRank 前 20% 的天,
      乘以 raw turnover (mask 应用), 否则归零. 20d Mean = "高 rank 期间的 turnover 强度
      平均". expected_sign: negative (high turnover rank 期间的高 turnover = 极致 crowding =
      反转, 区别于 raw turnover mean 因为加了 rank-gated 选择).

      Self-check:
        - P030: multi-CP rationale
        - P004-deep BORDERLINE: Mean of (mask × raw turnover); mask 离散 {0,1} 但 raw
          turnover 是连续 — 这是 partial-truncation, 不是 full discretization. **风险更高**:
          高 rank 内的 turnover magnitude 信息保留, 可能撞 F012 amihud/F015 amihud_cv_rank_diff
          cluster (max_corr 风险 > C001/C002). Phase 2 precheck F012/F015 max_corr 优先
        - F028 anchor: F028 用 Greater(|ΔH|,|ΔL|) 是绝对差比较, 本候选用 Gt(TsRank, 0.8)
          是 rank 阈值, distinct
        - F024 (trade_density_tsrank_60): F024 是单 TsRank ratio, 本候选是 TsRank 触发的
          mask × raw — 几何不同 (F024 用 rank value, 本候选用 rank threshold gate)
        - reciprocal duplicate: Gt(TsRank,0.8) ≠ Lt(TsRank,0.2) (low-rank gating 是独立子族)
    expected_sign: negative
    primary_cps: [CP03, CP04, CP05]

  - candidate_id: C004
    source_type: dsl
    expression: Mean(Gt(Div($close,Ref($close,1)),1.0),20)
    rationale: |
      T004 上涨日占比. close/prev_close > 1 即 1 日 return > 0 为 1 否则 0.
      20d Mean = 上涨日占比 (win rate Bernoulli aggregate).
      expected_sign: negative (高 win rate = 过度乐观/连涨 = 反转, 类 short-term reversal).

      Self-check:
        - P030: multi-CP rationale
        - P004-deep BORDERLINE 关键: Sum/20 of {0,1} 是离散概率 (Bernoulli rate), 而非
          连续 path-integral. **理论上 path-memory β-shift 不存在** 因为二值化把每天 ε 降到
          {0,1}, t-i 时刻的 β coefficient 在 sign 函数下被丢弃 (只剩 +/− 0 信息).
          Phase 3 必检验 vol_20d_exp — 若 >15 触发 P004-deep 类失败模式则证伪
        - F028 anchor: 单 Gt on return, F028 用 Lt×Greater 双 condition, distinct
        - F001 amount_cv 反转簇: F001 是 amount CV (连续 std/mean), 本候选是 return sign
          rate (离散计数), 几何不同
        - reciprocal duplicate: Gt(ratio,1.0) ≠ Lt(ratio,1.0); 下跌日占比是独立子族
        - 1日 return 是基本 building block; close-position cluster (F006-F008-F026) 用
          (C-L)/(H-L) intraday position; 本候选用 cross-day 涨跌方向, 几何不同
    expected_sign: negative
    primary_cps: [CP03, CP04, CP05]

  - candidate_id: C005
    source_type: dsl
    expression: Mean(Lt(Div(Sub($high,$low),$close),0.03),60)
    rationale: |
      T005 低振幅日占比. (H-L)/$close = 日内相对振幅; < 0.03 (3%) 为 1 否则 0.
      60d Mean = "低振幅日占比" = "压缩期 regime indicator".
      expected_sign: positive (高占比 = 压缩期 = 后续 breakout 偏 long).

      Self-check:
        - P030: multi-CP rationale
        - P004-deep BORDERLINE: 离散事件率, 二值化丢 magnitude 信息; vol_20d basis 是
          continuous std, 本候选是 discrete amplitude threshold rate — 几何应 distinct
          (Phase 2 实测 vol_20d_exp 验证)
        - F028 anchor: distinct (F028 是趋势计数, 本候选是振幅 regime 计数)
        - F022 (range_compression_60): F022 是 compression measure 走 dispersion 路径,
          本候选走 truncation 路径. **max_corr 高风险** — Phase 2 优先 precheck max_corr_F022
        - reciprocal duplicate: Lt(x,0.03) ≠ Gt(x,0.03); 高振幅日占比是独立子族
    expected_sign: positive
    primary_cps: [CP03, CP04, CP05]

  - candidate_id: C006
    source_type: dsl
    expression: If(Gt(Corr($close,$volume,10),0),Sub(Div($close,Ref($close,20)),1),0)
    rationale: |
      T006 conditional momentum (PV-corr gated). 仅在过去 10d $close-$volume Corr > 0 时
      取 20d momentum (close/Ref(close,20)-1) 否则归零. 这是 mask × admit-factor 类型 —
      把 F009-style PV-corr 当 gate, 把 20d momentum 当 signal.
      expected_sign: negative (PV 正相关期 = 量价齐升 = 过热 → 后续 20d momentum 反转).

      Self-check:
        - P030: multi-CP rationale
        - P004-deep BORDERLINE: If(cond, momentum, 0) — momentum 本身是 single-step
          ratio (20d return) NOT cumulative; gate 是离散二值. 关键差别: 这不是
          aggregate of {0,1} events, 而是 raw momentum * {0,1} gate — 等价于 conditional
          observation. Phase 3 需检验 vol_20d_exp
        - F028 anchor: F028 用 H+L vs prev H+L 趋势计数, 本候选用 PV corr gate, distinct
        - F009 (pv_corr_times_vol): F009 是 PV-corr × vol product (corr 作连续因子);
          本候选是 PV-corr 触发的 momentum gate (corr sign 作 gate) — 几何不同.
          **max_corr 风险** — Phase 2 precheck F009 max_corr
        - reciprocal duplicate: If(Gt(corr,0),mom,0) ≠ If(Lt(corr,0),mom,0)
          (negative-corr-gated momentum 是独立子族, 本批不覆盖)
    expected_sign: negative
    primary_cps: [CP03, CP04, CP05]
