direction: conditional_operator_truncation
batch_goal: |
  Round 98 — data-driven extension of b097/C001 binarize-axis success.
  b097/C001 上影主导日占比 alpha_surv=1.07 (Barra-clean reserve) — 全 6 中唯一 binarize
  内容 ⊥ Barra basis 的几何; 其余 5 子族 binarized content 同构 vol_20d / str_1m basis
  → 100% absorption.

  **核心律 (b097 实证)**: full binarize + Mean aggregate 仅在 binarized 内容
  ⊥ Barra style basis 时产生 distinct geometry; binarize 形式独特不够, 内容必须 distinct.

  **本批 hypothesis**: candle-geometry content (上/下/中-body 占比, range-position 高/低位)
  都属于 candle-geometry derivative, 应与 9-style Barra basis (size/vol_20d/momentum/value/
  quality/turnover/leverage/eps/str_1m) 均不同构 → 期望多数 candidate 达到 alpha_surv ≥ 0.5
  + ls_t ≥ 2.0 borderline, ≥1 admit (max_corr<0.40, ls_t≥3.0, alpha_surv≥0.5, incr_ic≥0.005).

  Qlib runtime op 实测可用: Gt/Lt (boolean), Mean, Sub, Div, Abs, Mul, Ref. **不用 If/IfElse**
  (b097 C006 中 If × continuous → str_1m 100% 吸收, 已 disprove). 全 6 候选走 full binarize
  + Mean rate aggregate 路径.

  **6 候选覆盖**:
  - C001 下影主导日占比 20d (T001 sign-flip镜像 / reciprocal duplicate 风险, 必精测)
  - C002 small-body 主导日占比 20d (candle geometry 新维度, |close-open|/range < 0.3)
  - C003 range-position 高位主导日占比 20d ((close-low)/range > 0.8)
  - C004 range-position 低位主导日占比 20d ((close-low)/range < 0.2)
  - C005 60d gap-up event rate (低阈 0.5%) — b097/C002 (阈 0.5%, 60d) sign-flip 不重测; 走
    **强 gap-up 0.5% 60d 已 disprove**, 本批改 60d gap-up event rate 复测但**更高阈 1.5%**
    隔离 cross-day return 同构 vol_20d 风险
  - C006 60d engulfing pattern rate (反向 candlestick reversal: 当日 body 与 前日 body 同号
    + 当日 body 更大) — 复合事件率, 新 geometry

  **Self-check 5 hard rule (P030 + P004-deep升格 + F028 + reciprocal + Cov-equiv)**:
  - **P030**: 全 6 multi-CP rationale, 不依赖 alpha_surv 单边
  - **P004-deep 升格 (b097 round 9 升格)**: long-window aggregate 必然与 style basis 频谱
    共振 IF binarized content 同构 basis. 本批 C001-C004 candle geometry, 已知与 9-style
    不同构; C005 高阈 gap-up 1.5% 走 60d aggregate, 风险**仍可能**与 vol_20d 频谱共振 — 显式
    标注 borderline; C006 engulfing 是 cross-day candlestick pattern, 不是 return 信号, 风险
    较低. Phase 3 judge 若发现 vol_20d_exp > 15 或 alpha_surv < 0.4 则该子族证伪.
  - **F028 anchor**: F028 用 Lt×Greater 双 condition 比值, 本批 6 候选无双 condition 复合
    → distinct
  - **b097/C001 anchor (round 9 新 reserve)**: C001 (本批 下影主导日) 是 b097/C001 (上影主
    导日) 的 sign-flip 镜像 — Gt((C-L)/(H-L), 0.5) 等价于 Lt((H-C)/(H-L), 0.5), 二值化在
    cross-section 上**可能产生互补但不严格 sign-flip** (因 close==(H+L)/2 时两者同时 False
    构成 "middle-body day"). 必跑 Phase 2 max_corr 实测; 预期 |corr|<0.7 但 >0.3.
  - **Reciprocal duplicate**: C001 vs b097/C001 (sign-flip 风险); C003 vs C004 (互补对偶高
    位/低位, 中间 [0.2, 0.8] 是 "middle-position day" 共同 False, 非严格互补). 本批不并列覆
    盖 reciprocal 子族 (单边)
  - **Cov-equiv (P028)**: 无 Cov atom; 无 cross-section OLS residualize (DSL only)

  **Anchor avoidance**:
  - F028 (DMI down-ratio): 双 condition 复合, distinct
  - F021 (shadow_disp): F021 用 Std/dispersion 连续, 本批用 truncate+rate 离散, geometry 不同
  - b097/C001 (reserve, 上影主导日占比): 本批 C001 是 reciprocal 镜像 — 必精测 max_corr
  - F022 (b097/C001 nearest@max_corr=0.41): 同样 candle-position 路径相关, 注意
  - F019/F020 (gap rank-diff): C005 走 truncation+Mean 而非 rank-diff, geometry 不同

  **Baseline-first 守则 explicit skip**: 15 untouched TTM 字段无法支撑 daily candle geometry
  event counting (TTM 季度更新). 显式 skip baseline-first, 本批纯 OHLCV structural extension.

  **avoid-this-batch rank-diff axis**: 9 batches 累积零 admit, 本批不用 Sub(TsRank, TsRank);
  candle-geometry binarize 是正交几何.

  Target: ≥1 admit (ls_t ≥ 3.0 + max_corr < 0.40 + alpha_surv ≥ 0.5 + incr_ic ≥ 0.005)
  OR ≥2 candidates validated borderline (alpha_surv ≥ 0.5 + ls_t > 2.0 confirming binarize
  content ⊥ Barra basis 律). 若 0 admit + 多数 candle-geometry candidate 也被 basis 吸收
  → T001 路径整体证伪, conditional family 该路径 dead.
