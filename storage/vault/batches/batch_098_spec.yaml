candidates:
  - candidate_id: C001
    source_type: dsl
    expression: Mean(Gt(Div(Sub($close,$low),Sub($high,$low)),0.5),20)
    canonical: Mean(Gt(Div(Sub($close,$low),Sub($high,$low)),0.5),20)
    rationale: |
      T001 下影主导日占比 (reciprocal mirror of b097/C001 上影主导日占比). close-position
      = (C-L)/(H-L). Gt(.,0.5) = 1 当 close 在 range 上半段 (下影主导/上行收盘); 20d Mean
      = 下影主导日 Bernoulli rate.
      expected_sign: positive (下影主导日多 = 收盘强势 / 日内反转买盘 = momentum 持续).

      Self-check:
        - P030: multi-CP rationale (incr_ic + max_corr + ls_t)
        - P004-deep BORDERLINE: 20d binarize 离散 {0,1} 事件率, 与 b097/C001 同窗同形式;
          已实证 (b097/C001) candle-geometry 内容 ⊥ Barra basis (alpha_surv=1.07).
          本候选是其 reciprocal 镜像, 期望同等 alpha_survival
        - F028: 双 condition 比值, 本候选单 Gt, distinct
        - b097/C001 anchor (上影主导日占比, Gt((H-C)/(H-L),0.5)): 与本候选 cross-section
          关系是 "close 在 range 上半 vs 下半" — 在 (H-C)/(H-L) > 0.5 时 (C-L)/(H-L) < 0.5,
          反之亦然, 中间 close==(H+L)/2 时两者同时 False. 因此**非严格 sign-flip 镜像**,
          cross-section corr 期望 |corr| ∈ [0.3, 0.7]. Phase 2 max_corr_F022 + max_corr 全
          库实测决定 verdict; 若 >0.7 与 b097/C001 (待 F id) corr 则 near_duplicate reject
        - reciprocal monotonic: Gt(x,0.5) ≠ Lt(x,0.5) (中间值 x=0.5 一致 False), 非严格互补
    expected_sign: positive
  - candidate_id: C002
    source_type: dsl
    expression: Mean(Lt(Div(Abs(Sub($close,$open)),Sub($high,$low)),0.3),20)
    canonical: Mean(Lt(Div(Abs(Sub($close,$open)),Sub($high,$low)),0.3),20)
    rationale: |
      T007 small-body 主导日占比 (doji-like 日 = 实体 < range 30% 占比). body =
      |close-open|, range = high-low. Lt(.,0.3) = 1 当 |body|/range < 0.3 (小实体犹豫日)
      否则 0; 20d Mean = "犹豫日"占比 Bernoulli rate.
      expected_sign: negative (犹豫日多 = 流动性不足/方向不明 = 反转或低未来 return).

      Self-check:
        - P030: multi-CP rationale
        - P004-deep BORDERLINE: 20d 离散事件率 candle geometry, 与 b097/C001 同结构; small-
          body geometry 不在 9-style basis (与 vol_20d 不同构 — vol_20d 是 range 绝对量级,
          本候选是 body/range 比例; 与 momentum/str_1m 不同构 — sign 信息全丢)
        - F028: 单 Lt, distinct
        - b097/C001 anchor: 上影占比走 (H-C)/(H-L), 本候选走 |C-O|/(H-L) — 几何完全不同
          (前者 上半 vs 下半, 后者 实体 vs range)
        - F022 (b097/C001 nearest): F022 是 range_compression_60 dispersion 连续, distinct
        - reciprocal monotonic: Lt(x,0.3) ≠ Gt(x,0.7) (中间 [0.3, 0.7] 共同 False), 非严格
          互补
    expected_sign: negative
  - candidate_id: C003
    source_type: dsl
    expression: Mean(Gt(Div(Sub($close,$low),Sub($high,$low)),0.8),20)
    canonical: Mean(Gt(Div(Sub($close,$low),Sub($high,$low)),0.8),20)
    rationale: |
      T008 range-position 高位主导日占比 (close 在 range 最高 20% 区间天数占比 = 强收盘日).
      (C-L)/(H-L) > 0.8 即 close 在 range 高位 80%+ 为 1 否则 0. 20d Mean = 强收盘日 rate.
      expected_sign: positive (强收盘日多 = 持续买盘 = momentum).

      Self-check:
        - P030: multi-CP rationale
        - P004-deep BORDERLINE: 20d 离散事件率, candle geometry 路径; 与 C001 阈值不同
