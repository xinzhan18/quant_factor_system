  source_type: dsl
  expression: IdxMax(Div(Sub($high, $low), $close), 20)
  canonical: IdxMax(Div(Sub($high,$low),$close),20)
  rationale: T001 timing：过去 20 日最大 range 发生在几天前。离散整数值，结构上不同于 vol_20d 连续 power-mean。经济含义：近端事件（值小）=
    新鲜冲击未消化；远端事件（值大）= 老故事 edge 衰减。
