  rationale: T002 短/长比：5d / 60d range 均值比。>1 近期 range 放大，<1 近期压缩。风险：类似 liquidity_acceleration
    T001 被 F001 吸收的 ratio 形态；但 range 字段与 amount/turnover 不同——实测观察 incremental_ic 符号。
- candidate_id: C006
