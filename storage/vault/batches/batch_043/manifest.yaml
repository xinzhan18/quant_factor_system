  expression: Delta(Mean(Div(Sub($high, $low), $close), 20), 5)
  canonical: Delta(Mean(Div(Sub($high,$low),$close),20),5)
  rationale: T002 变化率：过去 5 日 20d-mean range 的 delta。线性趋势测度，与 C005 ratio 形态互补（ratio
