  canonical: Mean(Gt(Div(Sub($high,$low),$close),Mul(1.5,Mean(Div(Sub($high,$low),$close),60))),20)
  rationale: T001 frequency-high：过去 20 日 range 超过 60d baseline 1.5× 的日数比例。Count-based
    离散聚合，对比连续 power-mean 测试是否逃离 vol_20d。直觉：高频事件日比例反映近期关注度。
- candidate_id: C003
  source_type: dsl
  expression: Mean(Lt(Div(Sub($high, $low), $close), Mul(Mean(Div(Sub($high, $low),
    $close), 60), 0.5)), 20)
  canonical: Mean(Lt(Div(Sub($high,$low),$close),Mul(0.5,Mean(Div(Sub($high,$low),$close),60))),20)
  rationale: T001 frequency-low：过去 20 日 range 低于 60d baseline 一半的日数比例。低 range 频率捕捉
    compression regime；类似 Bollinger squeeze 的频率测量。与 C002 互补：C002 是 expansion、C003
    是 compression。
- candidate_id: C004
  source_type: dsl
  expression: Skew(Div(Sub($high, $low), $close), 60)
  canonical: Skew(Div(Sub($high,$low),$close),60)
  rationale: T001 skew：60d range 分布偏度。少数极大 range 日（正偏）= 事件驱动 universe；均匀分布（接近零偏）=
    噪声驱动；负偏（极小 range 日多）= 横盘整理。return_distribution_signals dead 是对 returns 做 skew，本候选对
    range 做 skew——range 不是 return，不应同构到 vol_20d。
- candidate_id: C005
