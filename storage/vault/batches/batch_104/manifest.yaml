  canonical: TsAutoCorr(Sub(Div($close,Ref($close,1)),1),60)
  rationale: 'T002 TsAutoCorr regime classifier. 60d 窗口 lag-1 autocorr of daily return.

    高 autocorr (>0.1) = 持续动量 regime (散户特征 csi1000); 低/负 autocorr =

    mean-revert regime. 库内 TsAutoCorr 0 admit, 几何完全 untouched. 假说:

    autocorr 本身是 second-order moment, 与 vol_20d (first-order absolute scale)

    正交 — vol 高的股票不必然 autocorr 高 (高 vol + mean-revert 也常见). Expected

    sign: 正 IC (autocorr 高 = 趋势惯性 = forward return 正向). P033 OOS:

    2022-2023 regime drift 风险可控 (autocorr 是结构性时序属性, 非估值水平).

    P030 vol_20d_exp 预期 < 10% (完全不同 order moment basis).

    '
