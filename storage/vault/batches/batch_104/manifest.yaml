  rationale: 'T001 Tanh-envelope. close/MA20-1 (常见 mean-reversion 信号) 经 Tanh 压缩到 (-1,
    1)

    bounded range — heavy tail saturation 假说: linear close/MA-1 信号被 vol_20d

    Barra 吸收因为大偏离样本被 OLS 系数吸收为 vol 风险溢价; Tanh 在 |x|>1.5 进入饱和段,

    cap 极端样本贡献 → 残差 (alpha_surv) 应保留 mean-rev 信号而 vol_20d_exp 降低.

    乘 10 是斜率参数让 ±10% 偏离即进入 Tanh 弯曲段. P030 自检: vol_20d_exp 应 < 15%

    vs raw close/MA-1 形式预期 ≥30%; 若 alpha_surv > 1.0 且 incr_ic > 0.005 →

    非线性破 absorption 律的首例证据.

    '
