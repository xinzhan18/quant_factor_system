thresholds:
  ic_min: 0.03
  correlation_max: 0.5
  replacement_ic_ratio: 1.3
  replacement_ic_min: 0.05
factors:
- id: '001'
  name: std_returns_20
  expression: Std($close/Ref($close,1)-1, 20)
  category: volatility
  ic_mean: -0.0575
- id: '002'
  name: delta_volume_5
  expression: Delta($volume, 5) / Mean($volume, 20)
  category: volume
  ic_mean: -0.0323
- id: '003'
  name: vol_regime_reversal
  expression: If(Greater(Std($close/Ref($close,1)-1, 20), Med(Std($close/Ref($close,1)-1,
    20), 60)), $close/Ref($close,5)-1, Mul($close/Ref($close,5)-1, -1))
  category: regime
  ic_mean: -0.0435
- id: '004'
  name: std_volume_20
  expression: Std($volume, 20)
  category: volume
  ic_mean: -0.0392
