batch_id: "batch_003"
timestamp: "2026-03-24T01:30:00"
candidates:
  - name: "vol_regime_ema_cross"
    expression: "If(Greater(Std($close/Ref($close,1)-1, 20), Med(Std($close/Ref($close,1)-1, 20), 60)), Sub(EMA($close, 5), EMA($close, 20)), Sub(EMA($close, 20), EMA($close, 5)))"
    category: "regime"
    rationale: "Volatility regime switching with EMA crossover payload. High vol → short EMA above long (trend follow), Low vol → contrarian (long above short)."

  - name: "intraday_range_20"
    expression: "Mean(Div(Sub($high, $low), $close), 20)"
    category: "candlestick"
    rationale: "Average daily range normalized by close price over 20 days. Captures intraday volatility which may differ from close-to-close volatility."

  - name: "upper_shadow_ratio"
    expression: "Mean(Div(Sub($high, If(Greater($close, $open), $close, $open)), Sub($high, $low)), 20)"
    category: "candlestick"
    rationale: "Average upper shadow ratio over 20 days. High upper shadow = selling pressure at highs. If/Greater handles max(close,open)."

  - name: "gap_momentum"
    expression: "Mean(Sub($open, Ref($close, 1)), 10)"
    category: "momentum"
    rationale: "Average overnight gap over 10 days. Persistent positive gaps indicate institutional buying; negative gaps indicate distribution."

  - name: "volume_regime_return"
    expression: "If(Greater(Mean($volume, 5), Mean($volume, 20)), $close/Ref($close,5)-1, Mul($close/Ref($close,5)-1, -1))"
    category: "regime"
    rationale: "Volume expansion regime → momentum (5d return); volume contraction regime → reversal. Analogous to vol_regime_reversal but with volume as condition."

  - name: "close_position_20"
    expression: "Mean(Div(Sub($close, $low), Sub($high, $low)), 20)"
    category: "candlestick"
    rationale: "Average close position within daily range over 20 days. High = consistently closing near highs (bullish), Low = closing near lows (bearish)."

  - name: "ema_momentum_diff"
    expression: "Sub(Div(EMA($close, 5), EMA($close, 20)), 1)"
    category: "momentum"
    rationale: "EMA(5)/EMA(20) - 1, measuring short-term vs long-term exponential trend. Classic technical momentum signal."

  - name: "delta_high_low_spread"
    expression: "Sub(Delta($high, 10), Delta($low, 10))"
    category: "volatility"
    rationale: "Difference between 10-day change in high and 10-day change in low. Expanding range = increasing volatility asymmetry."
