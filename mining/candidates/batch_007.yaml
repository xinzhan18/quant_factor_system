batch_id: "batch_007"
timestamp: "2026-03-24T09:50:00"
description: "Post-baseline mining — targeting strongest unregistered signals and missing dimensions"
candidates:
  # Williams %R variant was strongest (IC=0.067) but not in library yet
  # Try variations to find orthogonal angle
  - name: "williams_r_5d"
    expression: "Div(Sub(Mul(2, Mean($close,5)), Min($close,5)), Sub(Max($close,5), Min($close,5)))"
    category: "candlestick"
    rationale: "Williams %R smoothed over 5 days — may decorrelate from single-day version"

  # Intraday range was 2nd strongest (IC=-0.064) — try combining with volume
  - name: "range_volume_interaction"
    expression: "Mul(Mean(Div(Sub($high, $low), $close), 5), Div($volume, Mean($volume, 20)))"
    category: "candlestick"
    rationale: "Range * relative volume — high range + high volume = activity signal"

  # Distribution: IQR was strong but corr with volatility. Try asymmetric tail
  - name: "tail_asymmetry_20"
    expression: "Div(Sub(Quantile($close/Ref($close,1)-1, 20, 0.9), Quantile($close/Ref($close,1)-1, 20, 0.5)), Sub(Quantile($close/Ref($close,1)-1, 20, 0.5), Quantile($close/Ref($close,1)-1, 20, 0.1)))"
    category: "distribution"
    rationale: "Upper tail / lower tail — asymmetry of return distribution, not same as vol"

  # Volume-price alignment — different from existing PV factors
  - name: "obv_momentum_20"
    expression: "Sum(Mul(Sign($close/Ref($close,1)-1), $volume), 20)"
    category: "volume"
    rationale: "On-balance volume over 20 days — directional volume accumulation"

  # Momentum: raw return was weak, try non-linear momentum
  - name: "signed_log_return_10"
    expression: "Log(Div($close, Ref($close, 10)))"
    category: "momentum"
    rationale: "Log return compresses large moves — may capture momentum differently"

  # Regime: PV corr regime with different payloads (asymmetric)
  - name: "pv_regime_vol_vs_range"
    expression: "If(Greater(Corr($close,$volume,20), 0), Std($close/Ref($close,1)-1, 5), Mean(Div(Sub($high,$low),$close), 20))"
    category: "regime"
    rationale: "PV aligned → short vol; PV diverged → long range. Truly asymmetric payloads."

  # Trend: combine regression with volume
  - name: "resi_volume_weighted"
    expression: "Mul(Resi($close, 10), Div($volume, Mean($volume, 20)))"
    category: "trend"
    rationale: "Regression residual * relative volume — conviction-weighted deviation"

  # Custom operator combo: decay-weighted range
  - name: "decay_weighted_range"
    expression: "TsDecay(Div(Sub($high, $low), $close), 10)"
    category: "candlestick"
    rationale: "Decay-weighted intraday range — recent range weighted more"
