description: "Alpha101 translations — ranking, conditional, multi-factor composites"
candidates:
  # Alpha#1: rank(ts_argmax(SignedPower(returns<0?stddev:close, 2), 5))
  - name: "alpha001"
    expression: "Rank(IdxMax(If(Less($close/Ref($close,1)-1, 0), Mul(Std($close/Ref($close,1)-1, 20), Std($close/Ref($close,1)-1, 20)), Mul($close, $close)), 5), 60)"
    category: "volatility"
    rationale: "Alpha101#1: When was max of (neg_return→vol², pos_return→close²)?"

  # Alpha#4: -1 * Ts_Rank(rank(low), 9)
  - name: "alpha004"
    expression: "Mul(Rank(Rank($low, 60), 9), -1)"
    category: "momentum"
    rationale: "Alpha101#4: Rolling rank of ranked low — reversal signal"

  # Alpha#7: (adv20<vol) ? -1*ts_rank(abs(delta(close,7)),60)*sign(delta(close,7)) : -1
  - name: "alpha007"
    expression: "If(Greater($volume, Mean($volume, 20)), Mul(Mul(Rank(Abs(Delta($close, 7)), 60), Sign(Delta($close, 7))), -1), -1)"
    category: "regime"
    rationale: "Alpha101#7: High volume → trend following, else bearish"

  # Alpha#8: -1*rank(sum(open,5)*sum(returns,5) - delay(sum(open,5)*sum(returns,5), 10))
  - name: "alpha008"
    expression: "Mul(Rank(Sub(Mul(Sum($open, 5), Sum($close/Ref($close,1)-1, 5)), Ref(Mul(Sum($open, 5), Sum($close/Ref($close,1)-1, 5)), 10)), 60), -1)"
    category: "momentum"
    rationale: "Alpha101#8: Change in open-weighted cumulative returns"

  # Alpha#10: rank of alpha009 pattern
  - name: "alpha010"
    expression: "Rank(If(Greater(Min(Delta($close, 1), 4), 0), Delta($close, 1), If(Less(Max(Delta($close, 1), 4), 0), Delta($close, 1), Mul(Delta($close, 1), -1))), 60)"
    category: "momentum"
    rationale: "Alpha101#10: Ranked version of trend continuation/reversal"

  # Alpha#13: -1 * rank(covariance(rank(close), rank(volume), 5))
  - name: "alpha013"
    expression: "Mul(Rank(Cov(Rank($close, 60), Rank($volume, 60), 5), 60), -1)"
    category: "volume"
    rationale: "Alpha101#13: Ranked close-volume covariance"

  # Alpha#17: -rank(ts_rank(close,10)) * rank(delta(delta(close,1),1)) * rank(ts_rank(vol/adv20,5))
  - name: "alpha017"
    expression: "Mul(Mul(Rank(Rank($close, 10), 60), Rank(Delta(Delta($close, 1), 1), 60)), Mul(Rank(Rank(Div($volume, Mean($volume, 20)), 5), 60), -1))"
    category: "momentum"
    rationale: "Alpha101#17: Price rank * acceleration * volume rank"

  # Alpha#18: -1*rank(stddev(abs(close-open),5) + (close-open) + corr(close,open,10))
  - name: "alpha018"
    expression: "Mul(Rank(Sub(Sub(Std(Abs(Sub($close,$open)), 5), Sub($close,$open)), Corr($close, $open, 10)), 60), -1)"
    category: "candlestick"
    rationale: "Alpha101#18: Body volatility + body + close-open correlation"

  # Alpha#20: -1*rank(open-delay(high,1))*rank(open-delay(close,1))*rank(open-delay(low,1))
  - name: "alpha020"
    expression: "Mul(Mul(Rank(Sub($open, Ref($high, 1)), 60), Rank(Sub($open, Ref($close, 1)), 60)), Mul(Rank(Sub($open, Ref($low, 1)), 60), -1))"
    category: "candlestick"
    rationale: "Alpha101#20: Open vs previous day's HLC — gap pattern"

  # Alpha#34: rank(2 - rank(stddev(ret,2)/stddev(ret,5)) - rank(delta(close,1)))
  - name: "alpha034"
    expression: "Rank(Sub(Sub(2, Rank(Div(Std($close/Ref($close,1)-1, 2), Std($close/Ref($close,1)-1, 5)), 60)), Rank(Delta($close, 1), 60)), 60)"
    category: "volatility"
    rationale: "Alpha101#34: Vol ratio rank + price change rank composite"

  # Alpha#35: ts_rank(vol,32) * (1-ts_rank(close+high-low,16)) * (1-ts_rank(ret,32))
  - name: "alpha035"
    expression: "Mul(Mul(Rank($volume, 32), Sub(1, Rank(Sub(Sub($close, $high), $low), 16))), Sub(1, Rank($close/Ref($close,1)-1, 32)))"
    category: "volume"
    rationale: "Alpha101#35: Volume rank * inverse range rank * inverse return rank"

  # Alpha#43: ts_rank(vol/adv20, 20) * ts_rank(-1*delta(close,7), 8)
  - name: "alpha043"
    expression: "Mul(Rank(Div($volume, Mean($volume, 20)), 20), Rank(Mul(Delta($close, 7), -1), 8))"
    category: "volume"
    rationale: "Alpha101#43: Relative volume rank * inverse price change rank"
