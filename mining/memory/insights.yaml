  # ===== Engineering Knowledge =====
  - insight: "Custom operator registration requires Operators._ops[name]=cls (direct dict injection). Operators.register() uses cls.__name__ which doesn't match expression names."
    confidence: high
    source: "debugging during baseline eval"

  - insight: "Rolling-based custom ops must override _load_internal() (not _execute()) and provide __init__(self, feature, N) calling super().__init__(feature, N, func_name)"
    confidence: high
    source: "debugging during baseline eval"

  - insight: "NpElemOperator-based custom ops need custom _load_internal() for anything beyond np.{func}(). Simple ones like Tanh can just pass func='tanh'."
    confidence: high
    source: "debugging during baseline eval"

  - insight: "PairOperator/SignedPower must handle numeric second argument — extend NpPairOperator and check isinstance(feature, Expression) before calling .load()"
    confidence: high
    source: "debugging during baseline eval"

  - insight: "C.kernels = 1 required when using custom operators — multiprocessing workers don't inherit Operators._ops registry"
    confidence: high
    source: "debugging during baseline eval"

  - insight: "D.instruments('all') returns dict {'market': 'all'}, not stock codes. Must pass dict to D.features() which resolves it, then extract codes from index."
    confidence: high
    source: "debugging during baseline eval"

  - insight: "OBV ratio Div(Sum(If(Greater(C,Ref(C,1)),V,0),20), Sum(V,20)) returned NaN — likely issue with nested If inside Sum"
    confidence: medium
    source: "baseline_C screening"

