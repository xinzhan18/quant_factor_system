recommended_directions:
  - pattern: "Volatility Regime Switching"
    description: "Use current vs historical volatility as IfElse condition to switch between ASYMMETRIC payloads (not x vs -x)"
    success_rate: high
    example_factors: ["factor_003"]
    note: "Batch 002: IC=-0.044, OOS=-0.056. MUST use asymmetric payloads."

  - pattern: "Volume Volatility"
    description: "Std($volume, N) captures speculative activity and event-driven trading"
    success_rate: high
    example_factors: ["factor_004"]
    note: "Batch 006: IC=-0.039, perfect monotonicity -1.0, low corr with price-vol (0.36)."

  - pattern: "Intraday Range Patterns"
    description: "Mean((H-L)/C, N) and close position Div(C-L, H-L) have strong IC"
    success_rate: high
    example_factors: []
    note: "Baseline: avg_range_5d IC=-0.064, close_position IC=-0.053, upper_shadow IC=0.053. Williams %R variant IC=0.067."

  - pattern: "PV Correlation Regime"
    description: "Use PV corr sign to switch between different range windows"
    success_rate: high
    example_factors: []
    note: "Baseline: pv_corr_regime_range IC=-0.062 — switches short vs long range based on PV correlation."

  - pattern: "Distribution Tails"
    description: "Quantile and IQR of returns capture tail risk"
    success_rate: high
    example_factors: []
    note: "Baseline: IQR IC=-0.058, Q90 IC=-0.056, Q10 IC=0.044. Strong negative IC = stocks with wider distribution underperform."

  - pattern: "Custom Volatility Measures"
    description: "MAD, RealizedVol, AmihudIlliq all capture vol anomaly differently"
    success_rate: high
    example_factors: []
    note: "Baseline: MAD IC=-0.058, RealizedVol IC=-0.055, AmihudIlliq IC=-0.057. Likely correlated with Std(ret,20) — need correlation check."

  - pattern: "Signed Nonlinear Returns"
    description: "SignedPower(ret, 0.5) compresses outliers while preserving sign"
    success_rate: high
    example_factors: []
    note: "Baseline: IC=-0.057. Strong but may be correlated with raw returns."

  - pattern: "Regression Residual"
    description: "Resi($close, N) as mean-reversion signal"
    success_rate: high
    example_factors: []
    note: "Baseline: Resi(close,5) IC=-0.041, normalized_residual IC=-0.035. Short windows stronger."

  - pattern: "Regime-Conditional Signals"
    description: "vol_regime_resi_vs_slope: high vol → residual, low vol → slope"
    success_rate: medium
    example_factors: []
    note: "Baseline: IC=-0.040. Only regime factor beyond PV corr regime that passes threshold."

  - pattern: "Robust Efficiency"
    description: "Use median and other robust statistics to smooth amount efficiency"
    success_rate: high
    example_factors: []
    note: "BLOCKED: $amount field is zero. Cannot test until data fix."

  - pattern: "Intraday Aggregation Features"
    description: "Leverage minute-data aggregated features as inputs for daily factors"
    success_rate: medium
    example_factors: []
    note: "BLOCKED: Need minute-data sync."

  - pattern: "Alpha101 Composites"
    description: "Multi-signal interaction formulas from WorldQuant Alpha101 paper"
    success_rate: high
    example_factors: ["factor_013", "factor_014", "factor_016", "factor_017", "factor_018", "factor_021"]
    note: "21.7% yield rate. Best: alpha024 IC=+0.049. Cross-sectional rank→Rank(x,60)."

  - pattern: "ATR-like Volatility"
    description: "Average True Range using nested If/Greater for max(H-L, |H-prevC|, |L-prevC|)"
    success_rate: high
    example_factors: ["factor_024"]
    note: "atr_like_14 IC=-0.044. Independent from Std(ret,20) at corr<0.7."

  - pattern: "Intraday vs Overnight Decomposition"
    description: "Separate intraday return (C-O)/O from overnight gap (O-prevC)/prevC"
    success_rate: high
    example_factors: ["factor_020"]
    note: "IC=-0.038. Captures different dynamics of intraday vs overnight."

  - pattern: "Range Compression"
    description: "Today's normalized range vs 60d average range ratio"
    success_rate: high
    example_factors: ["factor_022"]
    note: "IC=-0.042. Measures volatility regime relative to recent history."

forbidden_regions:
  # Operator errors
  - direction: "Expressions using Neg, TsRank, TsMax, TsMin, SMA, Correlation"
    reason: "These operators are NOT registered in pyqlib 0.9.7. Use alternatives: Mul(x,-1) for Neg, Rank(x,N) for TsRank."
    correlated_factors: []
    correlation: "N/A"

  # Saturated dimensions
  - direction: "Volatility Window Variants (Std of returns at any window)"
    reason: "All volatility measures (Std, MAD, RealizedVol, AmihudIlliq, IQR, Q90) are likely correlated. Library factor_001 Std(ret,20) IC=-0.058 already captures this."
    correlated_factors: ["factor_001"]
    correlation: "> 0.70"

  - direction: "Symmetric IfElse (x vs Mul(x,-1) or x vs Sub(0,x))"
    reason: "Produces IDENTICAL factor values regardless of condition."
    correlated_factors: ["factor_003"]
    correlation: "1.0"

  # Weak signal families (IC < 0.03)
  - direction: "Simple Slope/Rsquare alone"
    reason: "Baseline: Slope IC=-0.003, Rsquare IC=-0.005"
