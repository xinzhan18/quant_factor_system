candidates:
  # ── Direction 1: size_value_crossover (crossover, L009+L010) ─────────────────
  # Probe: 1/circ_mktcap × 1/PB  IC=+0.037  ICIR=0.458  WinRate=68.6%  ← exceptional
  # Both components are independently admitted: F038 (inverse_circ_mktcap, IC=0.012)
  # and F028 (inverse_pb, IC=0.028). Their product creates a multiplicative interaction:
  # stocks that are BOTH small AND cheap get amplified signal. Non-linear synergy.

  - name: size_x_pb
    expression: "Mul(Div(1, Add($circ_market_cap, 1)), Div(1, Add($pb_ratio, 0.001)))"
    category: other
    logic_id: L010
    direction: size_value_crossover
    rationale: >
      Small-cap × book-value-cheap crossover. Both dimensions independently work:
      F038 (inverse_circ_mktcap, IC=+0.012) and F028 (inverse_pb, IC=+0.028).
      Product amplifies stocks that are BOTH small AND cheap — likely different from
      each component alone. Probe IC=+0.037, ICIR=0.458 (exceptional), WinRate=68.6%.

  - name: size_x_ps
    expression: "Mul(Div(1, Add($circ_market_cap, 1)), Div(1, Add($ps_ratio, 0.001)))"
    category: other
    logic_id: L010
    direction: size_value_crossover
    rationale: >
      Small-cap × sales-value crossover. PS is more stable than PB (revenue vs book).
      F037 (inverse_ps, IC=+0.018) confirmed. Combining with small-cap premium:
      small stocks with low PS = neglected value. Expected similar or stronger signal
      than size_x_pb. Likely low-corr with size_x_pb due to different valuation axis.

  - name: size_x_low_pb_rank
    expression: "Mul(Div(1, Add($circ_market_cap, 1)), Sub(1, Rank($pb_ratio, 60)))"
    category: other
    logic_id: L010
    direction: size_value_crossover
    rationale: >
      Small-cap × time-series-low-PB. Sub(1, Rank(PB,60)) = "how low is current PB
      vs own 60-day history?" — captures stocks that are currently cheap relative to
      their own recent history. Multiplied by small-cap: small stocks that are also
      historically cheap vs themselves. Robust to cross-sectional PB level differences.

  # ── Direction 2: signed_nonlinear_returns (genesis, L001) ────────────────────
  # Probe: SignedPower(ret_5d, 0.5) IC=-0.024. F023 = SignedPower(ret_1d, 0.5) IC=-0.032.
  # Direction has attempts=0; these are the first formal candidates.
  # Hypothesis: compressing multi-day return outliers preserves reversal signal
  # while reducing sensitivity to extreme moves. Different windows → different
  # correlation profiles with F023.

  - name: signed_sqrt_ret5
    expression: "SignedPower(Sub(Div($close, Ref($close, 5)), 1), 0.5)"
    category: momentum
    logic_id: L001
    direction: signed_nonlinear_returns
    rationale: >
      Sign-preserving sqrt of 5-day return. Probe IC=-0.024. F023 uses 1-day return
      (IC=-0.032); 5-day captures medium-term reversal with outlier compression.
      The longer window likely reduces correlation with F023, opening a potential
      complementary slot. Sub(Div($close,Ref($close,5)),1) is the exact 5d return.

  - name: signed_cbrt_ret1
    expression: "SignedPower(Sub(Div($close, Ref($close, 1)), 1), 0.333)"
    category: momentum
    logic_id: L001
    direction: signed_nonlinear_returns
    rationale: >
      Sign-preserving cube root of 1-day return. Uses same 1-day window as F023
      but a weaker compression (power=0.33 vs 0.5 in F023). Cube root compresses
      less than sqrt — retains more of the raw return magnitude. Structurally
      different from F023: different non-linearity in the same direction.
      May have lower corr with F023 than sqrt due to different tail behavior.

  - name: signed_sqrt_ret3
    expression: "SignedPower(Sub(Div($close, Ref($close, 3)), 1), 0.5)"
    category: momentum
    logic_id: L001
    direction: signed_nonlinear_returns
    rationale: >
      Sign-preserving sqrt of 3-day return. Middle ground between F023 (1d) and
      signed_sqrt_ret5 (5d). 3-day captures short-term reversal that's less noisy
      than 1-day but more responsive than 5-day. Different corr profile from both.

  # ── Direction 3: value_x_reversal / ps_x_reversal (mutation, L009) ───────────
  # Probe: 1/PS × neg_ret20 IC=+0.019. F035 = 1/PB × neg_ret10 IC=0.033 (admitted).
  # Long reversal window (10d/20d) should avoid F003 contamination (5d reversal → corr>0.93).
  # PS × reversal extends the crossover from PB to a different valuation axis.

  - name: ps_x_rev20
    expression: "Mul(Div(1, Add($ps_ratio, 0.001)), Mul(Sub(Div($close, Ref($close, 20)), 1), -1))"
    category: valuation
    logic_id: L009
    direction: value_x_reversal
    rationale: >
      Sales yield × negative 20-day return. Cheap on revenue basis + recent price
      decline = deep value opportunity. Probe IC=+0.019, WinRate=56.2%. Structural
      analog of F035 (PB×10d, IC=+0.033) but using PS (more stable than PB) and
      longer 20d window. PS is less contaminated by leverage/buyback effects.

  - name: ps_x_rev10
    expression: "Mul(Div(1, Add($ps_ratio, 0.001)), Mul(Sub(Div($close, Ref($close, 10)), 1), -1))"
    category: valuation
    logic_id: L009
    direction: value_x_reversal
    rationale: >
      Sales yield × negative 10-day return. Same structure as ps_x_rev20 but shorter
      reversal window. F035 (PB×10d) was admitted; PS×10d may also work. The 10d
      window captures faster mean reversion in neglected sales-cheap stocks.
      Different corr from ps_x_rev20 due to different reversal signal.
