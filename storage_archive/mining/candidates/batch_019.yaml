candidates:
  - name: "vol_confirmed_reversal_10"
    expression: "Mean(Mul(Sign(Delta($volume, 1)), Mul(Delta($close, 1), -1)), 10)"
    category: "volume"
    rationale: "Alpha101 #12 variant: sign(delta_volume) * (-delta_close), averaged over 10 days. Volume-confirmed price reversals. Probe IC=+0.039, ICIR=0.386, WinRate=71.9%. Genuinely novel signal dimension in the library."

  - name: "vol_confirmed_reversal_5"
    expression: "Mean(Mul(Sign(Delta($volume, 1)), Mul(Delta($close, 1), -1)), 5)"
    category: "volume"
    rationale: "Same alpha012 logic at 5-day window. Probe IC=+0.036, ICIR=0.385. Shorter window may capture faster reversals and decorrelate from 10d version."

  - name: "vol_confirmed_reversal_3"
    expression: "Mean(Mul(Sign(Delta($volume, 1)), Mul(Delta($close, 1), -1)), 3)"
    category: "volume"
    rationale: "Alpha012 at 3-day window. Probe IC=+0.034, ICIR=0.363. Fastest variant, most responsive to recent volume-price dynamics."

  - name: "smoothed_williams_r_3"
    expression: "Mean(Div(Sub(Mul(2, $close), $low), Sub($high, $low)), 3)"
    category: "candlestick"
    rationale: "3-day smoothed Williams %R variant. Probe IC=+0.037, ICIR=0.221, WinRate=68.2%. Mutation of strongest factor (F011 IC=0.070). Smoothing may decorrelate while preserving signal."

  - name: "smoothed_williams_r_5"
    expression: "Mean(Div(Sub(Mul(2, $close), $low), Sub($high, $low)), 5)"
    category: "candlestick"
    rationale: "5-day smoothed Williams %R. Probe IC=+0.036, ICIR=0.219, WinRate=66.9%. More smoothing than 3d, may capture mean-reversion position patterns."

  - name: "smoothed_williams_r_10"
    expression: "Mean(Div(Sub(Mul(2, $close), $low), Sub($high, $low)), 10)"
    category: "candlestick"
    rationale: "10-day smoothed Williams %R. Probe IC=+0.034, ICIR=0.214, WinRate=63.6%. Longest smoothing window, most differentiated from raw Williams %R."

  - name: "pv_corr_times_vol_5"
    expression: "Mul(Corr($close, $volume, 5), Std($close/Ref($close,1)-1, 5))"
    category: "volume"
    rationale: "Short-window PV correlation x volatility. Probe IC=-0.039, ICIR=-0.278. Window variant of F009 (10d, IC=-0.052). 5d window may capture faster PV regime changes."

  - name: "range_volume_cross_20"
    expression: "Mul(Div(Sub($high, $low), Mean(Sub($high, $low), 20)), Div($volume, Mean($volume, 20)))"
    category: "regime"
    rationale: "Relative range x relative volume. Probe IC=-0.026. Cross-dimension interaction: when BOTH range and volume are elevated simultaneously, stronger regime signal. Below IC threshold but potentially independent from existing factors."
