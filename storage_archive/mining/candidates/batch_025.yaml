candidates:
  # ── Direction 1: size_x_turnover (L010, cross_sectional) ───────────────────
  # Probe: 1/circ_mktcap × mean_turnover_5  IC=-0.026  ICIR=-0.298  WinRate=36.8%
  # Strongest probe this round. Small-cap × high-turnover = retail-driven speculative
  # stocks. Already validated: F039(size_x_ps), F038(size_x_pb). Turnover is a new
  # interaction dimension for size.

  - name: size_x_mean_turnover_5
    expression: "Mul(Div(1, Add($circ_market_cap, 1)), Mean($turnover_rate, 5))"
    category: other
    logic_id: L010
    direction: size_x_turnover
    rationale: >
      Small-cap × 5-day mean turnover. Probe IC=-0.026, ICIR=-0.298 (strongest).
      Small stocks with high short-term trading activity = retail speculation.
      Unlike size_x_pb/size_x_ps (valuation crossover), this captures the
      liquidity/attention dimension of small-cap premium.

  - name: size_x_mean_turnover_20
    expression: "Mul(Div(1, Add($circ_market_cap, 1)), Mean($turnover_rate, 20))"
    category: other
    logic_id: L010
    direction: size_x_turnover
    rationale: >
      Small-cap × 20-day mean turnover. Longer window smooths noise, captures
      sustained attention on small stocks rather than transient spikes.
      Structural analog of size_x_mean_turnover_5 but different time horizon.
      May have lower corr with F033 (mean_turnover_5) due to size interaction.

  - name: size_x_turnover_vol_10
    expression: "Mul(Div(1, Add($circ_market_cap, 1)), Std($turnover_rate, 10))"
    category: other
    logic_id: L010
    direction: size_x_turnover
    rationale: >
      Small-cap × 10-day turnover volatility. F027 (turnover_vol_10, IC=-0.047)
      is the strongest liquidity factor. Multiplying by inverse size amplifies
      the signal for small stocks where turnover instability matters more.
      Different from pure turnover level — captures instability of trading activity.

  # ── Direction 2: trend_resonance (L013, multi_scale) ────────────────────────
  # Probe: (close-MA5)×(close-MA20)  IC=-0.020  ICIR=-0.188  WinRate=40.9%
  # Novel construct: product of short and mid MA deviations. Positive when both
  # same direction, near zero when conflicting. No existing factor captures
  # multi-scale trend alignment.

  - name: trend_resonance_5_20
    expression: "Mul(Sub($close, Mean($close, 5)), Sub($close, Mean($close, 20)))"
    category: momentum
    logic_id: L013
    direction: trend_resonance
    rationale: >
      Product of (close-MA5) × (close-MA20). Probe IC=-0.020, ICIR=-0.188.
      When both terms are same sign: strong directional signal (above/below both MAs).
      When conflicting: near-zero signal. Captures multi-scale trend alignment.
      Negative IC = trend-aligned stocks underperform = reversal at resonance.

  - name: trend_resonance_5_60
    expression: "Mul(Sub($close, Mean($close, 5)), Sub($close, Mean($close, 60)))"
    category: momentum
    logic_id: L013
    direction: trend_resonance
    rationale: >
      Product of (close-MA5) × (close-MA60). Wider gap between time scales (5 vs 60)
      captures stronger conviction: stock is trending above/below both short-term
      and medium-term averages. Longer MA60 acts as regime anchor. May have lower
      noise than 5×20 version, different corr profile.

  - name: trend_resonance_10_60
    expression: "Mul(Sub($close, Mean($close, 10)), Sub($close, Mean($close, 60)))"
    category: momentum
    logic_id: L013
    direction: trend_resonance
    rationale: >
      Product of (close-MA10) × (close-MA60). Uses 10-day short window instead of 5.
      Less noisy than 5-day, captures intermediate-term + longer-term alignment.
      Different time-scale pair from 5×20 and 5×60 — may be the most robust variant
      if shorter windows add noise without information.

  # ── Direction 3: drawdown_ratio (L012, tail_risk) ───────────────────────────
  # Probe: Min($close,20)/Max($close,20)  IC=+0.015  ICIR=+0.081  WinRate=58.7%
  # Novel metric: ratio of lowest to highest price in window. Close to 1 = stable,
  # close to 0 = severe drawdown. Unlike vol (symmetric), captures directional stress.

  - name: drawdown_ratio_20
    expression: "Div(Min($close, 20), Max($close, 20))"
    category: volatility
    logic_id: L012
    direction: drawdown_ratio
    rationale: >
      20-day price range ratio (min/max). Probe IC=+0.015, WinRate=58.7%.
      High ratio = tight range = stable = outperform (positive IC).
      Unlike Std (symmetric), this captures DIRECTIONAL compression/expansion.
      Stocks with small drawdowns in recent 20 days continue performing.

  - name: drawdown_ratio_60
    expression: "Div(Min($close, 60), Max($close, 60))"
    category: volatility
    logic_id: L012
    direction: drawdown_ratio
    rationale: >
      60-day price range ratio. Longer window captures medium-term stability.
      Stocks that have stayed near their highs for 60 days are in sustained
      uptrends or consolidation. Different time horizon from 20d version,
      likely different corr profile with F001 (std_returns_20).
