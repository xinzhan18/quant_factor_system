batch_id: "batch_010"
timestamp: "2026-03-24T10:02:00"
description: "Push for orthogonal factors — cross-frequency, conditional volume, novel composites"
candidates:
  # === Distribution: try truly different construction ===
  - name: "downside_vol_20"
    expression: "Std(If(Less($close/Ref($close,1)-1, 0), $close/Ref($close,1)-1, 0), 20)"
    category: "distribution"
    rationale: "Downside-only volatility — only counts negative returns. Different from symmetric vol."

  # === Momentum: try binary/counting approaches since continuous failed ===
  - name: "consecutive_up_score"
    expression: "Sum(If(Greater($close, Ref($close,1)), 1, -1), 10)"
    category: "momentum"
    rationale: "Net up/down day count over 10 days — +10 = all up, -10 = all down"

  # === Novel interaction: high * volume ===
  - name: "high_relative_volume"
    expression: "Mul(Div($high, $close), Div($volume, Mean($volume, 20)))"
    category: "candlestick"
    rationale: "How high price goes * volume intensity — conviction of intraday highs"

  # === Trend: completely different from resi ===
  - name: "price_position_in_mean"
    expression: "Div(Sub($close, Mean($close, 60)), Mean($close, 60))"
    category: "trend"
    rationale: "Price deviation from 60d mean as percentage — long-term mean reversion"

  # === Try multiplying non-correlated signals ===
  - name: "vol_times_up_count"
    expression: "Mul(Std($close/Ref($close,1)-1, 20), Div(Count(Greater($close, Ref($close,1)), 20), 20))"
    category: "other"
    rationale: "Volatility * up-day fraction — high vol + many up days = overextended?"

  # === Volume shape: how concentrated are volume spikes ===
  - name: "volume_skew_20"
    expression: "Skew($volume, 20)"
    category: "volume"
    rationale: "Volume skewness — are there a few very large volume days?"

  # === Long-window regime with different payloads ===
  - name: "trend_regime_slope_var"
    expression: "If(Greater(Rsquare($close, 60), 0.5), Slope($close, 20), Var($close/Ref($close,1)-1, 20))"
    category: "regime"
    rationale: "Strong trend → use slope; no trend → use variance. R²=0.5 as threshold."

  # === OHLC: open-close gap over multiple days ===
  - name: "avg_body_ratio_10"
    expression: "Mean(Div(Abs(Sub($close, $open)), Sub($high, $low)), 10)"
    category: "candlestick"
    rationale: "Average body/range ratio — how much of range is body vs shadows"
