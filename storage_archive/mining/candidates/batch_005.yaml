batch_id: "batch_005"
timestamp: "2026-03-24T01:40:00"
candidates:
  - name: "resi_close_20"
    expression: "Resi($close, 20)"
    category: "trend"
    rationale: "Regression residual of close price over 20 days. Positive residual = price above trend line. Classic mean-reversion signal."

  - name: "up_vol_ratio"
    expression: "Div(Sum(If(Greater($close, Ref($close, 1)), $volume, 0), 20), Sum($volume, 20))"
    category: "volume"
    rationale: "Fraction of 20-day volume occurring on up-days. High ratio = buying pressure dominance, low = selling pressure."

  - name: "down_day_intensity"
    expression: "Div(Sum(If(Less($close, Ref($close, 1)), Abs($close/Ref($close,1)-1), 0), 20), Sum(Abs($close/Ref($close,1)-1), 20))"
    category: "distribution"
    rationale: "Fraction of total absolute return contributed by down days. High = concentrated downside, asymmetric risk."

  - name: "return_autocorr_proxy"
    expression: "Mean(Mul($close/Ref($close,1)-1, Ref($close/Ref($close,1)-1, 1)), 20)"
    category: "momentum"
    rationale: "Mean of r(t)*r(t-1) over 20 days — proxy for return autocorrelation. Positive = trending, negative = mean-reverting."

  - name: "wma_deviation"
    expression: "Div(Sub($close, WMA($close, 20)), WMA($close, 20))"
    category: "momentum"
    rationale: "Deviation from 20-day WMA. WMA gives more weight to recent prices than SMA, so deviation captures short-term dislocation."

  - name: "vol_asymmetry"
    expression: "Sub(Std(If(Greater($close, Ref($close, 1)), $close/Ref($close,1)-1, 0), 20), Std(If(Less($close, Ref($close, 1)), $close/Ref($close,1)-1, 0), 20))"
    category: "distribution"
    rationale: "Upside vol minus downside vol over 20 days. Positive = upside moves are more volatile than downside (distribution asymmetry)."

  - name: "volume_return_sync"
    expression: "Mean(Mul(Sign($close/Ref($close,1)-1), Sign(Sub($volume, Ref($volume, 1)))), 20)"
    category: "volume"
    rationale: "Average sign agreement between return and volume change. Positive = price-volume coordination (healthy trend)."

  - name: "mean_open_close_gap"
    expression: "Mean(Div(Sub($close, $open), Sub($high, $low)), 20)"
    category: "candlestick"
    rationale: "Average intraday return (close-open) normalized by range. Positive = bullish intraday bias, negative = bearish."
