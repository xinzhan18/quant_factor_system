batch_id: "baseline_C"
timestamp: "2026-03-24T10:00:00"
description: "Custom Operators + Alpha101 Styles — tests custom ops, composite constructions"
candidates:
  # === Custom operators ===
  - name: "ts_decay_close_20"
    expression: "TsDecay($close, 20)"
    category: "trend"
    rationale: "Decay-weighted close — recent prices weighted more"

  - name: "ts_decay_volume_10"
    expression: "TsDecay($volume, 10)"
    category: "volume"
    rationale: "Decay-weighted volume — recent volume emphasis"

  - name: "ts_momentum_close_20"
    expression: "TsMomentum($close, 20)"
    category: "momentum"
    rationale: "Custom period return: close[t]/close[t-20]-1"

  - name: "ts_momentum_close_60"
    expression: "TsMomentum($close, 60)"
    category: "momentum"
    rationale: "Custom quarterly momentum"

  - name: "ts_autocorr_ret_20"
    expression: "TsAutoCorr($close/Ref($close,1)-1, 20)"
    category: "distribution"
    rationale: "Return autocorrelation — persistence measure"

  - name: "realized_vol_20"
    expression: "RealizedVol($close/Ref($close,1)-1, 20)"
    category: "volatility"
    rationale: "Realized volatility — sqrt(sum(ret^2))"

  - name: "ts_entropy_ret_20"
    expression: "TsEntropy($close/Ref($close,1)-1, 20)"
    category: "distribution"
    rationale: "Return entropy — information content/unpredictability"

  - name: "hhi_volume_20"
    expression: "HHI($volume, 20)"
    category: "volume"
    rationale: "Volume concentration index — institutional activity proxy"

  - name: "amihud_illiq_20"
    expression: "AmihudIlliq($close/Ref($close,1)-1, 20)"
    category: "volume"
    rationale: "Simplified Amihud illiquidity — mean(|ret|)"

  - name: "bounded_zscore"
    expression: "Tanh(Div(Sub($close, Mean($close,20)), Std($close,20)))"
    category: "trend"
    rationale: "Tanh-bounded z-score — non-linear mean reversion"

  - name: "signed_sqrt_return"
    expression: "SignedPower($close/Ref($close,1)-1, 0.5)"
    category: "momentum"
    rationale: "Signed sqrt of return — compresses outliers"

  # === Alpha101-style composites ===
  - name: "rank_ret_times_rank_vol"
    expression: "Mul(Rank($close/Ref($close,1)-1, 20), Rank($volume, 20))"
    category: "volume"
    rationale: "Return rank * volume rank — cross-sectional composite"

  - name: "sign_ret_delta_vol"
    expression: "Mul(Sign(Delta($close, 5)), Delta($volume, 5))"
    category: "volume"
    rationale: "Sign of 5d price change * 5d volume change"

  - name: "williams_r_variant"
    expression: "Div(Sub(Mul(2, $close), $low), Sub($high, $low))"
    category: "candlestick"
    rationale: "Williams %R variant — close position relative to range"

  - name: "pv_corr_times_vol"
    expression: "Mul(Corr($close, $volume, 10), Std($close/Ref($close,1)-1, 10))"
    category: "volume"
    rationale: "PV correlation * volatility — interaction term"

  - name: "trend_vs_vol_rank"
    expression: "Sub(Rank(Slope($close, 20), 60), Rank(Std($close/Ref($close,1)-1, 20), 60))"
    category: "trend"
    rationale: "Trend rank minus volatility rank — risk-adjusted trend"

  - name: "obv_ratio_20"
    expression: "Div(Sum(If(Greater($close, Ref($close,1)), $volume, 0), 20), Sum($volume, 20))"
    category: "volume"
    rationale: "OBV ratio — fraction of up-day volume over 20 days"

  - name: "price_vol_co_movement"
    expression: "Mul(Delta($close, 10), Delta($volume, 10))"
    category: "volume"
    rationale: "Price-volume co-movement — 10d delta product"

  - name: "volume_beta"
    expression: "Div(Cov($close/Ref($close,1)-1, $volume, 20), Var($close/Ref($close,1)-1, 20))"
    category: "volume"
    rationale: "Volume beta of returns — return sensitivity to volume"

  - name: "vol_weighted_abs_return"
    expression: "Mean(Mul(Abs($close/Ref($close,1)-1), Div($volume, Mean($volume,20))), 20)"
    category: "volume"
    rationale: "Volume-weighted absolute return — activity measure"

  - name: "drawdown_from_20d_high"
    expression: "Sub(Div(Max($close,20), $close), 1)"
    category: "momentum"
    rationale: "Drawdown from 20-day high"

  # === Additional novel combos ===
  - name: "robust_normalized_residual"
    expression: "Div(Resi($close, 20), Mad($close/Ref($close,1)-1, 20))"
    category: "trend"
    rationale: "Regression residual normalized by MAD — robust"

  - name: "pv_aligned_trend"
    expression: "Mul(Corr($close,$volume,20), Slope($close,20))"
    category: "trend"
    rationale: "PV correlation * price slope — aligned trend signal"

  - name: "relative_idx_max_60"
    expression: "Div(IdxMax($close,60), 60)"
    category: "momentum"
    rationale: "Relative position of 60d high (0=today, 1=60d ago)"

  - name: "volume_extreme_timing"
    expression: "Div(Sub(IdxMin($volume,20), IdxMax($volume,20)), 20)"
    category: "volume"
    rationale: "Volume min vs max timing gap — activity cycle"

  - name: "volume_range_iqr"
    expression: "Sub(Quantile($volume, 20, 0.9), Quantile($volume, 20, 0.1))"
    category: "volume"
    rationale: "Volume interquantile range — volume dispersion"
