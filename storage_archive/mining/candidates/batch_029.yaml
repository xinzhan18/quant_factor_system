candidates:
  # ── Direction 1: Value composite (PB × PS) ──────────────────────────────────
  - name: value_composite_pb_ps
    expression: "Mul(Div(1, Add($pb_ratio, 0.001)), Div(1, Add($ps_ratio, 0.001)))"
    category: valuation
    logic_id: L009
    direction: value_composite
    rationale: >
      Inverse PB × inverse PS. Probe IC=+0.030, ICIR=+0.269, WinRate=60.7%.
      Stocks cheap on BOTH book and sales measures. Multiplicative interaction
      amplifies stocks that are deep value across multiple dimensions.

  - name: value_composite_sqrt
    expression: "Mul(Div(1, Add($pb_ratio, 0.001)), Div(1, Add(Abs($pe_ratio), 1)))"
    category: valuation
    logic_id: L009
    direction: value_composite
    rationale: >
      Inverse PB × inverse |PE|. Combines book value cheapness with earnings cheapness.
      Handles negative PE with Abs. Different from PB×PS — uses earnings dimension.

  - name: value_composite_all3
    expression: "Mul(Mul(Div(1, Add($pb_ratio, 0.001)), Div(1, Add($ps_ratio, 0.001))), Div(1, Add(Abs($pe_ratio), 1)))"
    category: valuation
    logic_id: L009
    direction: value_composite
    rationale: >
      Triple value composite: 1/PB × 1/PS × 1/|PE|. Stocks that are cheap on
      all three measures simultaneously. Maximum value signal concentration.

  # ── Direction 2: Return asymmetry ──────────────────────────────────────────
  - name: up_down_magnitude_diff_20
    expression: "Sub(Mean(If(Greater(Sub(Div($close,Ref($close,1)),1),0),Sub(Div($close,Ref($close,1)),1),0),20),Mean(If(Less(Sub(Div($close,Ref($close,1)),1),0),Abs(Sub(Div($close,Ref($close,1)),1)),0),20))"
    category: momentum
    logic_id: L001
    direction: return_asymmetry
    rationale: >
      Avg up-day magnitude minus avg down-day magnitude over 20d. Probe IC=-0.026.
      Positive = up days bigger than down days = bullish asymmetry. Negative IC means
      bullish asymmetry predicts underperformance (reversal). Novel construct — captures
      return distribution shape, not just level or volatility.

  - name: up_down_magnitude_diff_10
    expression: "Sub(Mean(If(Greater(Sub(Div($close,Ref($close,1)),1),0),Sub(Div($close,Ref($close,1)),1),0),10),Mean(If(Less(Sub(Div($close,Ref($close,1)),1),0),Abs(Sub(Div($close,Ref($close,1)),1)),0),10))"
    category: momentum
    logic_id: L001
    direction: return_asymmetry
    rationale: >
      10-day version. Shorter window captures more recent asymmetry.

  # ── Direction 3: Stochastic position ────────────────────────────────────────
  - name: stochastic_60
    expression: "Div(Sub($close, Min($close, 60)), Add(Sub(Max($close, 60), Min($close, 60)), 0.001))"
    category: momentum
    logic_id: L011
    direction: stochastic_position
    rationale: >
      60-day stochastic oscillator. (close-min60)/(max60-min60). Probe IC=-0.020.
      Close position within 60-day range. 0=at bottom, 1=at top. Negative IC means
      stocks at top of range underperform (overbought). Different from williams_r (F011)
      which uses daily range only.

  - name: stochastic_20
    expression: "Div(Sub($close, Min($close, 20)), Add(Sub(Max($close, 20), Min($close, 20)), 0.001))"
    category: momentum
    logic_id: L011
    direction: stochastic_position
    rationale: >
      20-day stochastic oscillator. Shorter window, more sensitive.

  # ── Direction 4: PE × turnover cross ────────────────────────────────────────
  - name: pe_rank_x_turnover_rank
    expression: "Mul(Rank($pe_ratio, 60), Rank($turnover_rate, 60))"
    category: other
    logic_id: L009
    direction: pe_turnover_cross
    rationale: >
      PE rank × turnover rank. Probe IC=-0.016, ICIR=-0.164.
      Expensive (high PE) + actively traded = overvalued speculative stocks.
      Cross-dimensional: valuation × liquidity.
