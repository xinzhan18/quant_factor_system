  - name: ps_rank_60
    expression: "Rank($ps_ratio, 60)"
    category: valuation
    logic_id: L009
    direction: ps_valuation
    rationale: >
      60-day rolling rank of PS ratio. Probe IC=-0.023, ICIR=-0.137. Structural
      analog of F034 (pb_ratio_rank_60) but using PS dimension. Likely low corr.

  - name: ps_rank_20
    expression: "Rank($ps_ratio, 20)"
    category: valuation
    logic_id: L009
    direction: ps_valuation
    rationale: >
      20-day rolling rank of PS ratio. Shorter window than 60d, captures more recent
