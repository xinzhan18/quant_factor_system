  # ── Direction 1: PS re-exploration (F037 removed) ───────────────────────────
  - name: inverse_ps
    expression: "Div(1, Add($ps_ratio, 0.001))"
    category: valuation
    logic_id: L009
    direction: ps_valuation
    rationale: >
      Inverse PS ratio. Was F037 (removed in cleanup). Probe IC=+0.022, ICIR=+0.233.
